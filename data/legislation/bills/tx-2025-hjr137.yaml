bill_number: HJR 137
title: Proposing a constitutional amendment authorizing the legislature to regulate and authorize casino gaming and sports wagering
market_segment: [regulated_sportsbook]
summary: >-
  House Joint Resolution 137 would have put to Texas voters a constitutional amendment allowing the
  legislature to authorize and strictly regulate casino gaming and sports wagering by general law, with
  required licensing, license application fees and a tax on casino gaming and sports wagering revenue. Filed
  February 12, 2025 and referred to the House Committee on State Affairs on March 19, 2025, it received no
  further action before the regular session ended on June 2, 2025.
would:
  - Amend Section 47, Article III of the Texas Constitution to let the legislature authorize and strictly regulate casino gaming and sports wagering by general law, defining the activities, requiring licenses and application fees, and imposing a tax on revenue (introduced text, Section 1).
