bill_number: S 444
title: South Carolina Sports Wagering Act (Interactive Sports Wagering)
market_segment: [regulated_sportsbook]
summary: >-
  Senate Bill 444 would enact the South Carolina Sports Wagering Act, adding Chapter 55 to Title 39 to make the
  operation of sports wagering lawful when licensed, create a South Carolina Sports Wagering Commission, levy
  a privilege tax, provide for licenses, ineligible persons, regulations, enforcement and reporting, and add
  Section 16-19-135 so that a person who wagers under the act does not violate the gambling statutes. It was
  introduced in the Senate on March 12, 2025 and referred to the Committee on Labor, Commerce and Industry,
  where it remained as of the bill page archived on October 16, 2026.
would:
  - Make the operation of sports wagering and ancillary activities lawful when conducted under the new chapter and the Commission's regulations (Section 39-55-100).
  - Create the South Carolina Sports Wagering Commission, a licensing scheme and a privilege tax on adjusted gross sports wagering receipts (bill summary as introduced; rate to be entered from the bill text on review).
