session: 2025-2026 (60th Legislature)
bill_number: HB 1047
title: "Amusements and sports; state-tribal gaming; Gaming Compact Supplement; sports betting; tribal administration (short title as engrossed)"
market_segment: [regulated_sportsbook]
summary: >-
  House Bill 1047 would have authorized sports betting in Oklahoma as an additional covered game offered to
  tribes under the State-Tribal Gaming Act, accepted by each tribe through a model Gaming Compact Supplement
  set out in the bill. It passed the House 62 to 31 on March 26, 2025, carried over to the 2026 session, was
  amended by a Senate floor substitute on April 22, 2026 and failed on the Senate floor the same day, 21 ayes
  to 27 nays. A motion to reconsider expired on April 28, 2026.
would:
  - Add sports betting ("wagering on the outcome of sporting contests") to the games the state offers tribes under the State-Tribal Gaming Act, accepted by a tribe by executing the model Gaming Compact Supplement in the bill (engrossed text, Sections 2 and 3).
  - Set the fee to the state at ten percent of the monthly adjusted transaction total from sports betting, defined as gross transactions less winnings paid, voided wagers, free play and promotional credits, generally accepted associated operating costs and federal excise taxes (engrossed text, supplement Part 2.B).
  - Split fees received under the supplements as under the existing compact, twelve percent to the General Revenue Fund and eighty-eight percent to the Education Reform Revolving Fund, after the first $20,833.33 each month to the Department of Mental Health and Substance Abuse Services for treatment of compulsive gambling disorder and related education (engrossed text, Section 2).
  - The engrossed text does not specify whether wagers may be placed by mobile device or only on tribal premises; the Senate floor substitute of April 22, 2026 has not yet been read and may differ.
