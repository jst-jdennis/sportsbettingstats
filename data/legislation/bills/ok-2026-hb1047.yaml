bill_number: HB 1047
title: Sports wagering; authorizing tribal gaming operators to conduct sports wagering under compact
market_segment: [regulated_sportsbook]
summary: >-
  House Bill 1047 would have authorized sports wagering in Oklahoma by allowing tribes with gaming compacts to
  offer retail and, through compact supplements, mobile wagering, with a share of revenue paid to the state. It
  passed the House in 2025, carried over to the 2026 session, and failed on the Senate floor on April 22, 2026.
would:
  - Authorize federally recognized tribes with Class III compacts to conduct sports wagering through a compact supplement.
  - Set a state revenue share on sports wagering receipts (rate as stated in the enrolled text; confirm from bill text rather than press).
  - Direct a portion of state receipts to education and to problem gambling programs (confirm from bill text).
