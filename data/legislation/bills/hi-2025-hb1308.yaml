session: Thirty-Third Legislature, 2025 Regular Session (carried over to 2026)
bill_number: HB 1308
title: Relating to Sports Wagering (HD 3, SD 2)
market_segment: [regulated_sportsbook]
summary: >-
  House Bill 1308 would have let the Department of Law Enforcement license and regulate online sports wagering
  operators and suppliers, levied a tax on adjusted gross sports wagering receipts with a share to a new
  Problem Gambling Prevention and Treatment Special Fund administered by the Department of Health, set a
  wagering age of 21 and provided that licensed sports wagering and fantasy sports contests are not gambling
  under state law. It passed the House on March 4, 2025 and the Senate, amended, on April 8, 2025; the House
  disagreed with the Senate amendments, conferees were appointed on April 22 and 24, 2025, and the measure was
  carried over to the 2026 Regular Session on December 8, 2025 without a conference agreement. In 2026 the Senate
  discharged its conferees on March 20 and the House its conferees on April 1, ending the measure for the biennium.
would:
  - Add a chapter on the regulation of sports wagering administered by the Department of Law Enforcement, with operator and supplier licenses and criminal history checks (measure description, SD 2).
  - Tax adjusted gross sports wagering receipts, at ten percent in the HD 1 text, with a stated share deposited to the Problem Gambling Prevention and Treatment Special Fund; the final rate and share were among the points left unresolved in conference (HD 1 text sections 11 and 12).
  - Require a person placing a wager to be at least twenty-one years of age (HD 1 and SD 2 texts).
  - Provide that legal sports wagering and fantasy sports contests are not contests of chance or gambling (measure description, SD 2).
