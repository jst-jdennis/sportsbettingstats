bill_number: SF 4760
title: Omnibus public safety policy bill (Session Law 2026, Chapter 97), carrying the prohibition on event contracts
market_segment: [prediction_market]
summary: >-
  Senate File 4760, the 2026 omnibus public safety policy bill, was passed by the Senate 52 to 13 on April 21,
  2026, by the House as amended 116 to 16 on April 30, repassed by the Senate on the conference committee
  report 57 to 9 on May 12, adopted by the House on May 13, presented to the Governor on May 14 and approved on
  May 18, 2026 as Chapter 97. Among its provisions, as reported at enactment, is a prohibition on offering or
  advertising event contracts on sports, elections and other listed subjects, the first state law to bar
  prediction markets outright; the chapter text is being archived and the provision will be summarized from it
  with section references.
would:
  - Prohibit offering or advertising event contracts on listed subjects, including sporting events, in Minnesota (provision to be entered from the chapter text with its section number; description here is from the status page and contemporaneous reporting, not yet from the text).
