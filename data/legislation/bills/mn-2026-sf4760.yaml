notes: >-
  The House vote on adopting the conference committee report (May 13, 2026) is not tallied on the status page
  and is to be entered from the House Journal page 10541. Contemporaneous reporting describes the event
  contract prohibition as effective August 1, 2026 and challenged in federal court by the Commodity Futures
  Trading Commission and the platforms; litigation status is not recorded here. The chapter text is queued for
  archiving so the provision can be cited by section.
