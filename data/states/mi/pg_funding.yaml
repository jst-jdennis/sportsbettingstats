    notes: 'MCL 432.416 as currently published directs the board, after regulation and enforcement costs, to pay "each year,
      $1,000,000.00 to the compulsive gaming prevention fund created in section 3 of the compulsive gaming prevention act,
      1997 PA 70, MCL 432.253"; the original 2019 PA 149 text (https://www.legislature.mi.gov/documents/2019-2020/publicact/htm/2019-PA-0149.htm)
      read 500,000 dollars, and the section history lists a 2026 amendment (Act 94) whose effect on the amount should be confirmed.
      MCL 432.316 (https://www.legislature.mi.gov/Laws/MCL?objectName=mcl-432-316) now reads 3,000,000 dollars each year after
      reading 500,000 dollars in 2019 PA 152 (the change is attributed to 2024 PA 142 and should be confirmed). The Compulsive
      Gaming Prevention Act (https://www.legislature.mi.gov/documents/mcl/pdf/mcl-Act-70-of-1997.pdf) lists money appropriated
      from both funds among the deposits and states "Public funds for the treatment of pathological gamblers shall be taken
      exclusively from the compulsive gaming prevention fund." The leads citing MCL 432.512 and 432.414 were wrong: 432.512
      is in the Fantasy Contests Consumer Protection Act and the distribution sections are 432.316 and 432.416. Transfers
      to the fund from the commercial casino act and the lottery were not checked and should be added to mechanism_text if
      present. Retrieval caveat: the network policy of the drafting environment blocked legislature.mi.gov and michigan.gov,
      so quoted language comes from search-index excerpts of these pages, not from loading them. Amount: not entered; the
      statutory floor is 4,000,000 dollars a year from the two internet funds, and the appropriated amount should be taken
      from the MDHHS FY2026 revenue sources report under section 217 of 2025 PA 22 (https://www.michigan.gov/mdhhs/-/media/Project/Websites/mdhhs/Inside-MDHHS/Budget-and-Finance/Legislative-Reports-FY26/Section_217.pdf),
      which lists the compulsive gaming prevention fund under the "Gambling addiction" line. Archived copy checked on 2026-10-17:
      MCL 432.416 as archived: after regulatory costs, each year 1,000,000.00 dollars to the compulsive gaming prevention
      fund created in section 3 of the compulsive gaming prevention act, 1997 PA 70, MCL 432.253.'
