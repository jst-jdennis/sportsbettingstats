  mechanism_text: Michigan dedicates fixed annual amounts of internet gaming and internet sports betting tax to the compulsive
    gaming prevention fund created by the Compulsive Gaming Prevention Act (MCL 432.253). After paying the Gaming Control
    Board's regulatory costs, the Lawful Internet Gaming Act directs 3,000,000 dollars each year from the internet gaming
    fund (MCL 432.316) and the Lawful Sports Betting Act directs 1,000,000 dollars each year from the internet sports betting
    fund (MCL 432.416) to the compulsive gaming prevention fund. The fund is in the Department of Treasury and is spent by
    the Department of Health and Human Services, and the act provides that public funds for treatment of pathological gamblers
    are taken exclusively from it.
