tax:
  - channel: all
    basis: adjusted_gross_revenue
    rate: 0.084
    tiers: null
    per_wager_fee_cents: null
    promo_deduction_rule: >-
      MCL 432.403 defines adjusted gross sports betting receipts as gross receipts less the monetary value of
      free play wagered by participants as an incentive to place or as a result of having placed wagers. Unlike
      the Lawful Internet Gaming Act, the sports betting act's definition contains no year by year cap on the
      free play deduction in the text retrieved.
    effective_from: "2020-03-11"
    effective_to: null
    destination:
      - fund_name: Internet Sports Betting Fund (distributed to the School Aid Fund, the First Responder Presumed Coverage Fund and the Board's regulatory costs)
        share: null
    authority_citation: MCL 432.414 (8.4 percent tax on adjusted gross sports betting receipts; a city imposing a 1.25 percent municipal services fee on a casino licensee may charge an additional 1.25 percent on that operator's receipts; tribal operators make an equivalent payment under the act rather than the tax)
    provenance:
      <<: *mileg
      notes: Rate, free play definition and the Detroit 1.25 percent fee confirmed from the public act text. Distribution shares not read by search on 2026-10-16, so share is left null.
