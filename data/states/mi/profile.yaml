summary: >-
  Michigan enacted the Lawful Sports Betting Act, 2019 PA 149, approved December 20, 2019 with immediate
  effect. Retail wagering began at the Detroit casinos in March 2020 and online wagering in January 2021,
  with both the three commercial Detroit casinos and the federally recognized tribes eligible to operate.
  The Michigan Gaming Control Board regulates the market and collects an 8.4 percent tax on adjusted gross
  sports betting receipts, which are reported after a free play deduction.
