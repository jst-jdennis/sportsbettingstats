limitations:
  - Michigan reports adjusted gross sports betting receipts after an uncapped free play deduction, so reported revenue is materially below gross revenue and below the figures of states such as New Jersey or Massachusetts.
  - Tribal operators report internet sports betting through the Board but their retail wagering is governed by compacts and is not in the state series.
  - Michigan borders Ohio and Indiana, both with online wagering, and Ontario, which has a regulated online market, so cross-border flows are present in all directions.
