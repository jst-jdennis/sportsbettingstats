        Archived copy checked on 2026-10-17: 2019 PA 149 requires the operator to display on the platform, in a clear, conspicuous and accessible manner, the number of the toll-free compulsive gambling hotline maintained by the state.
        Excerpt language: "A sports betting operator shall display or require its internet sports betting platform
        provider to display, on the internet sports betting platform used by the sports betting operator, in a clear,
        conspicuous, and accessible manner the number of the toll-free compulsive gambling hotline." The statute names
        no number; the Board's responsible gaming materials use 1-800-GAMBLER and the Michigan Lottery page lists
