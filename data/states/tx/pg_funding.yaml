  mechanism_text: No Texas statute dedicates gambling revenue to problem gambling services. Texas has no casino or sports
    wagering statute; state lottery net revenue goes to the Foundation School Fund under Government Code chapter 466. Health
    and Safety Code 461A.106 (added by Acts 2015, 84th Leg., S.B. 219) directs the Health and Human Services Commission to
    establish a compulsive gambling program, but names no funding source. Whether the legislature currently appropriates any
    money to that program could not be established from a primary document; press reports in June 2026 state that the program
    has had no state funding since the mid-2000s and that the Texas Lottery provides no direct funding for problem gambling
    treatment.
  administering_agency: Texas Health and Human Services Commission
