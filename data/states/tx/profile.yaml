summary: >-
  Texas has not authorized sports wagering in any form. Wagering on the outcome of a game or contest is an
  offense under Texas Penal Code section 47.02, and Article III, section 47 of the Texas Constitution directs
  the Legislature to prohibit lotteries, so authorization would require a constitutional amendment approved by
  voters. Proposed amendments in the 2025 regular session (HJR 134 and SJR 65) did not advance out of committee.
