limitations:
  - Texas is a comparison state with no regulated sports wagering. Residents can and do use offshore sites, sweepstakes products and, depending on platform geofencing, federally regulated prediction markets; none of that activity appears in any state revenue series.
  - As of 2026-10-16 no Texas state body had been found to have issued a cease and desist, advisory opinion or lawsuit concerning prediction market sports contracts; press reports note the Texas Attorney General did not join the 2026 multistate amicus brief on the question. A Senate State Affairs interim hearing examined the issue. Prediction market status is tracked in prediction_markets.yaml when a primary record exists.
