limitations:
- Rhode Island's state share is a 51 percent revenue split under a lottery monopoly, not a tax rate, and the published
  revenue line is after prizes. It is not comparable to commercial-state tax rates without adjustment.
- The market is two hosting facilities and one online platform, so single-operator events (such as the 2019 to 2020
  account registration rule) move the whole state series.
