summary: >-
  Rhode Island conducts sports wagering as a state lottery game under R.I. Gen. Laws chapter 42-61.2, hosted at the
  Twin River (now Bally's) casinos in Lincoln and Tiverton. Retail wagering began in November 2018 and statewide
  online wagering, authorized by a 2019 act, began in September 2019 through the Lottery's Sportsbook Rhode Island
  platform. The state keeps 51 percent of sports wagering revenue, with the balance shared between the technology
  vendor and the host casinos.
