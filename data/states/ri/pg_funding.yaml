    notes: 'The statute page could not be opened from the drafting container (outbound fetches were blocked); the operative
      language is quoted from a search-engine extract of the cited page: "Twin River and Twin River-Tiverton shall reimburse
      and pay to the Division no less than two hundred thousand dollars ($200,000) in aggregate annually for compulsive and
      problem gambling programs established by the Division and no less than fifty thousand dollars ($50,000) in the aggregate
      annually for education and prevention programs" and "the contribution from each facility shall be determined by the
      Division". R.I. Gen. Laws 40.1-1-19 (https://webserver.rilegislature.gov/statutes/TITLE40.1/40.1-1/40.1-1-19.htm) directs
      the division of substance abuse to designate "comprehensive treatment services for problem gamblers and their family
      members; provided, however, the cost of the treatment services program does not exceed one hundred fifty thousand dollars".
      The lead citations 42-61.2-7 (titled "Division of revenue") and chapter 42-61.3 were not found to contain a problem
      gambling dedication and are not relied on. A 2022 bill (H 7424) would send forfeited winnings of self-excluded players,
      up to 150,000 dollars a year, to the Rhode Island Council on Problem Gambling; its enactment was not confirmed. Classified
      as license_fee because the money is paid by the licensed facilities rather than taken from the state''s revenue share;
      the statutory floor is 250,000 dollars a year and the actual payments should be taken from the Lottery''s annual report.
