  mechanism_text: R.I. Gen. Laws 42-61.2-14 requires the two hosting facilities, Twin River in Lincoln and Twin River-Tiverton
    (both now operated by Bally's), to pay the Division of Lotteries no less than 200,000 dollars in aggregate each year for
    compulsive and problem gambling programs established by the Division and no less than 50,000 dollars in aggregate each
    year for education and prevention programs, with each facility's share set by the Division. The required programs include
    employee awareness training, a self-exclusion program, a problem gambling hotline and responsible gambling education.
    Treatment services are run separately by the Department of Behavioral Healthcare, Developmental Disabilities and Hospitals
    under R.I. Gen. Laws 40.1-1-19, which caps that program's cost at 150,000 dollars; no share of sports wagering or video
    lottery revenue is dedicated to problem gambling. The statute itself fixes the minimum amounts (200,000 and 50,000 dollars
    a year in aggregate) and their use, so under the classification rule this is a statutory earmark of a fixed amount per
    licensee rather than a regulator-set fee.
  administering_agency: Rhode Island Lottery (Division of Lotteries, Department of Revenue); treatment through the Department
    of Behavioral Healthcare, Developmental Disabilities and Hospitals
