summary: >-
  Arkansas voters approved Amendment 100 (Issue 4) on November 6, 2018, which defines casino gaming to include
  wagers on sporting events at four licensed casinos. Retail sports wagering began at Oaklawn on July 1, 2019.
  The Arkansas Racing Commission's amended Casino Gaming Rules allowed statewide mobile wagering through casino
  licensees from March 2022, and sports wagering is taxed as part of net casino gaming receipts at 13 percent of
  the first 150 million dollars and 20 percent above that.
