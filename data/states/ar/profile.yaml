limitations:
  - Arkansas taxes sports wagering inside net casino gaming receipts, so there is no sports-specific tax rate or tax revenue line; the Racing Commission's monthly reports break out sports wagering handle and revenue but the tier a licensee falls in depends on its total casino gaming receipts.
  - Mobile revenue is reported by casino licensee, and the 51 percent licensee retention rule makes operator-level figures incomparable with open-platform states.
  - A share of Arkansas handle comes from residents of Tennessee, Mississippi and Texas, and the Southland and Oaklawn markets changed materially when Tennessee (online only, November 2020) and Mississippi (on-premises mobile) regulated.
