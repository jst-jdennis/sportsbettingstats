  mechanism_text: Amendment 100 to the Arkansas Constitution (the 2018 casino gaming amendment, which also authorizes sports
    wagering at the licensed casinos) requires the Arkansas Racing Commission to provide not less than 200,000 dollars annually
    for compulsive gambling disorder treatment programs and compulsive gambling disorder educational programs, to be developed
    with the Department of Human Services, which may adopt rules and may be contracted to administer them. The casino gaming
    tax itself is split among the state general revenue, the Racing Commission purse funds and the host counties and cities
    with no percentage for problem gambling. Since November 2022 the Commission has met the requirement through a 200,000
    dollar annual contract with the Arkansas Problem Gambling Council. The Arkansas Scholarship Lottery's former 200,000 dollar
    annual contribution was repealed in 2015, though the lottery still pays for the helpline.
  administering_agency: Arkansas Racing Commission (Department of Finance and Administration), with the Department of Human
    Services
