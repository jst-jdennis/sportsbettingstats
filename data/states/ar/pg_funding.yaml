    notes: 'The Secretary of State''s copy of the amendment text could not be opened from this container; search excerpts
      of the amendment on 2026-10-17 place the requirement in subsection (r) of the licensing section, with the Racing Commission
      required to provide at least 200,000 dollars a year, the Department of Human Services authorized to promulgate rules,
      and the clause "The Arkansas Racing Commission may contract with the Department of Human Services for providing all
      services related to and administration of the compulsive gambling disorder treatment programs and the compulsive gambling
      disorder educational programs". The subsection letter and section number should be confirmed against the PDF. Implementation
      history (no funding until a December 2021 rainy day fund transfer, a 2021 illegal exaction suit dismissed in 2022, and
      the Arkansas Problem Gambling Council contract from November 1, 2022, renewable annually) comes from press coverage
      and is not cited. Amount to be taken from the Racing Commission''s contract or the DFA budget; the constitutional minimum
      is 200,000 dollars. Archived copy checked on 2026-10-17: Amendment 100 as archived from the Secretary of State, subsection
      (r)(1): the Arkansas Racing Commission shall provide an annual amount of at least 200,000 dollars for compulsive gambling
      disorder treatment and educational programs, working with the Department of Human Services.'
