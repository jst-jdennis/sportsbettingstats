state_actions:
  - action_type: cease_and_desist
    date: "2026-01-09"
    issuing_body: Tennessee Sports Wagering Council
    target: KalshiEX LLC, Polymarket and Crypto.com (North American Derivatives Exchange)
    summary: The Council notified the three platforms that their sports event contracts are unlicensed sports wagering
      under the Tennessee Sports Gaming Act and directed them to stop offering the contracts to Tennessee customers,
      void open contracts held by residents and refund customer funds by 2026-01-31, citing fines of up to 25,000
      dollars per offense and possible referral for prosecution.
    document_url: null
    provenance:
      <<: *swcpm
      notes: Letter date, targets, deadline and penalty language as reported in trade press on 2026-01-10 through
        2026-01-12. Not confirmed on tn.gov by search on 2026-10-16. In late 2025 the Council also wrote to the CFTC
        opposing sports event contracts; that letter is not entered pending a primary record.
litigation:
  - case_name: KalshiEX LLC v. Tennessee Sports Wagering Council officials
    court: US District Court for the Middle District of Tennessee (appeal in the US Court of Appeals for the Sixth Circuit)
    docket: null
    filed_on: "2026-01-09"
    status: appeal_pending
    posture_note: >-
      Rulings to date concern preliminary relief only. The district court entered a temporary restraining order and
      then a preliminary injunction barring enforcement of the Sports Gaming Act against Kalshi. Press reports a
      later Sixth Circuit ruling in Tennessee's favor; its date, scope and effect on the injunction were not confirmed
      on a primary domain by search on 2026-10-16. No final judgment has been entered.
    rulings:
