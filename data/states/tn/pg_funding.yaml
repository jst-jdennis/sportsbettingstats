    notes: 'Tennessee''s code is published for the General Assembly through a third-party platform without stable section
      URLs, so the department''s statutory annual report, which quotes the statute, is cited as the primary document; the
      report could not be opened from the drafting container and the quotation comes from a search-engine extract of it: "Notwithstanding
      section 4-51-111, five percent (5%) of the privilege tax collected under this section must be distributed by the corporation
      to the state treasurer and allocated to the department of mental health and substance abuse services", with the report
      citing the reporting duty to Tenn. Code Ann. 4-51-319(c)(2). The Act was moved to Title 4, Chapter 49 and the current
      section number (reported as 4-49-128) and text were not confirmed. The amount will come from the department''s Sports
      Gaming Act annual report for SFY 2024-25; the Sports Wagering Council''s monthly reports at https://www.tn.gov/swc.html
      give the privilege tax assessed from which the five percent is derived. The services covered ("includes") were not confirmed
      beyond treatment. Archiving on 2026-10-17 did not yield the section text: tn.gov reset the archiving connection; the
      clause remains as taken from the search excerpt until a reviewer opens the page.'
