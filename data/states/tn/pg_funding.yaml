  mechanism_text: The Tennessee Sports Gaming Act directs five percent of the sports wagering privilege tax (1.85 percent
    of gross wagers since July 1, 2023) to the state treasurer for allocation to the Department of Mental Health and Substance
    Abuse Services for problem gambling services, with eighty percent going to education and fifteen percent to local governments.
    The department must report each year by January 1 on the programs funded, people treated and administrative costs. The
    first distribution was made on July 1, 2022. The 2025 special session redirected the education share to public schools
    but, as reported, left the five percent share unchanged.
  administering_agency: Tennessee Department of Mental Health and Substance Abuse Services
  includes:
  - treatment
  authority_citation: Tenn. Code Ann. 4-49-128 (privilege tax distribution; formerly codified in Title 4, Chapter 51, Part
    3), section number to confirm
