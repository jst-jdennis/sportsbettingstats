summary: >-
  Tennessee authorized online-only sports wagering through the Tennessee Sports Gaming Act, 2019 Public Chapter 507,
  which became law without the governor's signature in May 2019. Licensed operators began accepting wagers on
  November 1, 2020. Since July 1, 2023 the state levies a privilege tax of 1.85 percent on gross wagers instead of
  the original 20 percent tax on adjusted gross income, and the Sports Wagering Council licenses and supervises
  operators. There are no retail sportsbooks.
