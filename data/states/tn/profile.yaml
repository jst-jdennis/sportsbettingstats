limitations:
- Tennessee changed its tax base from adjusted gross income to handle on 2023-07-01, so tax receipts before and after
  that date are not comparable as a share of revenue.
- Tennessee has no retail channel, so all handle is online and comparisons with states that split channels should use
  the online line only.
- Residents also used federally regulated prediction markets during the period covered; that activity is outside the
  Council's revenue series and is tracked in prediction_markets.yaml.
