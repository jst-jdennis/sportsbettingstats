tax:
  - channel: all
    basis: adjusted_gross_revenue
    rate: 0.15
    tiers: null
    per_wager_fee_cents: null
    promo_deduction_rule: Adjusted gross revenue is wagers less cash winnings, voided wagers, federal excise taxes and eligible noncash winnings (bonuses and promotional credits). Since the 2022 Appropriation Act, continued in later budgets, noncash winnings are deductible only during a permit holder's first twelve months of operation. A negative monthly balance may be carried forward for up to twelve months.
    effective_from: "2021-01-21"
    effective_to: null
    destination:
      - fund_name: General Fund
        share: 0.975
      - fund_name: Problem Gambling Treatment and Support Fund
        share: 0.025
    authority_citation: Va. Code 58.1-4037 (15 percent of adjusted gross revenue); Va. Code 58.1-4038 (2.5 percent of tax to the Problem Gambling Treatment and Support Fund, remainder to the general fund); Appropriation Act language limiting noncash winnings deductions
    provenance:
