summary: >-
  Virginia authorized sports wagering in April 2020 when the General Assembly accepted the Governor's
  amendments to HB 896 and SB 384. The Virginia Lottery licenses and regulates permit holders and publishes
  monthly activity reports. Online wagering began on January 21, 2021; retail sportsbooks followed once the
  first casino opened in 2022. Permit holders pay 15 percent of adjusted gross revenue, with promotional
  deductions limited to an operator's first twelve months.
