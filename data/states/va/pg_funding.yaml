    notes: 'Operative language of 58.1-4038(A): "The Department shall allocate 2.5 percent of the tax revenue collected pursuant
      to 58.1-4037 to the Problem Gambling Treatment and Support Fund established pursuant to 37.2-314.2." Casino share, Title
      58.1 chapter 41: "Eight-tenths of one percent of the Fund shall be deposited in the Problem Gambling Treatment and Support
      Fund established pursuant to 37.2-314.2." The amount is the FY2025 (July 2024 to June 2025) fund revenue reported in
      the DBHDS FY 2025 PGTS Fund Report to the General Assembly, https://dbhds.virginia.gov/wp-content/uploads/2025/10/FY-25-PGTSfund-Report-for-GA.pdf
      (also published as RD201 of 2026, https://rga.lis.virginia.gov/Published/2026/RD201/PDF): sports betting $2,584,864,
      casinos $1,256,369, historical horse racing $477,829, unclaimed prizes $909,569, interest $266,462; appropriation $2,622,631
      (after a $315,732 increase approved September 2024); spent $2,531,857. The legislature''s site could not be fetched
      from this session (network policy), so the statutory text was taken from search excerpts of the official law.lis.virginia.gov
      pages; a reviewer should open 58.1-4038, 58.1-4125 and 37.2-314.2 (the 37.2-314.2 page shows a 2026 amendment, Acts
      2026 cc. 565 and 566, adding revenue sources) and confirm the subsection letters. Archived copy checked on 2026-10-17:
      Va. Code 58.1-4038(A) as archived: the Department shall allocate 2.5 percent of the tax revenue collected pursuant to
      58.1-4037 to the Problem Gambling Treatment and Support Fund; the DBHDS FY25 fund report as archived states total FY25
      revenue of 5,495,094 dollars, an appropriation of 2,622,631 dollars and spending of 2,531,857 dollars.'
