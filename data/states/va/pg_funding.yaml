  mechanism_text: Va. Code 58.1-4038 directs the Virginia Lottery to allocate 2.5 percent of the 15 percent sports betting
    tax collected under 58.1-4037 to the Problem Gambling Treatment and Support Fund created by Va. Code 37.2-314.2; the remainder
    goes to the general fund. The fund also receives eight-tenths of one percent of the casino Gaming Proceeds Fund (Va. Code
    58.1-4125), a share of historical horse racing revenue and unclaimed prizes. The fund is a special nonreverting fund administered
    by the Department of Behavioral Health and Developmental Services for counseling, treatment and prevention programs and
    grants to organizations that help compulsive and problem gamblers. DBHDS reported FY2025 fund revenue of $5,495,094, of
    which $2,584,864 came from sports betting; the FY2025 appropriation was $2,622,631 and expenditures were $2,531,857.
