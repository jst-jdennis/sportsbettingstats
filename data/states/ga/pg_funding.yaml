  mechanism_text: The Georgia Lottery for Education Act directs a portion of unclaimed lottery prize money, not to exceed
    $200,000 a year, to the Department of Behavioral Health and Developmental Disabilities for the treatment of compulsive
    gambling disorder and related educational programs. The remainder of unclaimed prize money is returned to the prize pool
    or used for special prize promotions. Georgia has no casinos or regulated sports wagering, so the lottery transfer is
    the only gambling revenue dedicated to problem gambling by statute.
