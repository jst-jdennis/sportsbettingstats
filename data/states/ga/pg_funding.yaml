    notes: 'Operative language as excerpted from the Georgia Lottery Corporation''s published copy of the Act: "A portion
      of unclaimed prize money, not to exceed $200,000.00 annually, shall be directed to the Department of Behavioral Health
      and Developmental Disabilities for the treatment of compulsive gambling disorder and educational programs related to
      such disorder." The official O.C.G.A. is published for the General Assembly by LexisNexis, and legis.ga.gov, galottery.com
      and lexis were all blocked by this session''s network policy, so the state lottery''s copy of the statute is cited and
      the clause was taken from the search engine''s excerpt; the reviewer must confirm the subsection letter and current
      text. The Georgia Lottery Corporation''s audited financial statements (2014 edition) state that transfers for this purpose
      have been $200,000 each fiscal year; the amount for the latest fiscal year should be taken from the current GLC financial
      statements or the DBHDD budget. Archived copy checked on 2026-10-17: O.C.G.A. 50-27-24(h) as published by the Georgia
      Lottery Corporation: a portion of unclaimed prize money, not to exceed 200,000 dollars annually, shall be directed to
      the Department of Behavioral Health and Developmental Disabilities for the treatment of compulsive gambling disorder
      and educational programs.'
