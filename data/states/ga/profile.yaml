summary: >-
  Georgia has not authorized sports wagering. Constitutional amendment resolutions and enabling bills to put the
  question to voters, including HR 450 and HB 686 in 2025 and HB 910 in the 2026 session, were introduced in the
  General Assembly but no measure had become law or been placed on a ballot as of October 2026. The Georgia Lottery
  Corporation operates the state lottery and no state body regulates sports wagering.
