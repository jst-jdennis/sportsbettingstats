  mechanism_text: The sports wagering excise tax under KRS 138.552 (9.75 percent of retail and 14.25 percent of online adjusted
    gross revenue) is deposited in the sports wagering administration fund under KRS 230.817, and the statute directs two
    and one-half percent of the fund to the Kentucky problem gambling assistance account established by KRS 230.826, with
    the remainder going to state pension or lottery accounts. The account also receives fixed annual transfers from the horse
    breed development funds (100,000 dollars from the Thoroughbred development fund under KRS 230.400 and 25,000 dollars each
    from the quarter horse and the paint horse, Appaloosa and Arabian funds). The account is administered by the Division
    of Behavioral Health in the Cabinet for Health and Family Services, does not lapse, and caps administrative costs at 50,000
    dollars a year.
