    target: KalshiEX LLC and affiliates including Coinbase
    summary: The Attorney General sued in Franklin Circuit Court alleging that Kalshi offers sports wagering in Kentucky without a state license, in violation of KRS Chapter 230 and the Consumer Protection Act, and that its contracts are void under KRS 372.010.
