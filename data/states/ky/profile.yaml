summary: >-
  Kentucky authorized sports wagering through House Bill 551 of 2023, signed March 31, 2023 and effective
  June 28, 2023. Retail wagering at licensed racetracks began September 7, 2023 and online wagering on
  September 28, 2023. The Kentucky Horse Racing and Gaming Corporation licenses and regulates operators.
  The 2026 Wagering Consumer Protection Act (HB 904), enacted over a veto, raises the wagering age from
  18 to 21 effective July 15, 2026.
