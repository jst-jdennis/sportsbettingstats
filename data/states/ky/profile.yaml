    authority_citation: 809 KAR 10:004 (sports wagering accounts; account holder deposit and spend limits)
    notes: >-
      A licensee shall allow an account holder to limit the amount of money that may be deposited into an account and
      spent through an account; a deposit limit shall be offered on a daily, weekly and monthly basis. Any decrease
      to these limits is effective immediately or at the point in time clearly indicated to the account holder; any
      increase becomes effective only after the time period of the previous limit has expired, so the cooling-off
      period is the remainder of the limit period rather than a fixed number of hours. The excerpt shows no default
      limit and no requirement to set a limit at registration. Quoted from a search excerpt of the cited page; the
      page itself could not be opened from the drafting environment.
