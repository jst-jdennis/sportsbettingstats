          Quoted from a search excerpt of the cited page and of the July 1, 2024 technical amendment
          (https://apps.legislature.ky.gov/law/kar/downloads/docs/15397/document.engrossed.pdf); the page itself could
          not be opened from the drafting environment. The 2024 technical amendment replaced "commission" with
          "corporation" throughout.
    - rule_type: no_under_age_targeting
      text: >-
        A licensee shall not advertise or market at elementary, middle or high school activities. The prohibition
        excludes an advertisement distributed via mass media, such as television, radio, print media or the
        Internet, if the advertisement is not specifically directed toward (but could be incidentally received by)
        elementary, middle or high schools.
      authority_citation: 809 KAR 10:007 (responsible gaming and advertising; advertising and marketing section)
