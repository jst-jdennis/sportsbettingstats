  advertising:
    - rule_type: other
      text: >-
        A licensee shall not allow, conduct or participate in any false or misleading advertising or marketing
        concerning its sports wagering operations. Representations concerning winnings must be accurate, not
        misleading and capable of substantiation at the time of the representation; an advertisement is misleading if
        it makes representations about average winnings without equally prominently representing the average net
        winnings of all patrons.
      authority_citation: 809 KAR 10:007 (responsible gaming and advertising; advertising and marketing section)
      provenance:
        <<: *kyleg
        source_url: https://apps.legislature.ky.gov/law/kar/titles/809/010/007/
