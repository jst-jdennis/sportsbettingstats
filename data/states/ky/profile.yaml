limitations:
  - Kentucky reports adjusted gross revenue after winnings and federal excise tax, with no promotional deduction, so its revenue series is closer to gross revenue than states that deduct free play.
  - The minimum wagering age was 18 from launch until July 15, 2026, so Kentucky handle before that date includes bettors aged 18 to 20 who are excluded in most other states.
  - A share of early Kentucky handle came from residents of neighboring states, notably Ohio before January 2023 and Missouri before December 2025, and from Indiana and Tennessee border regions.
