review_note: >-
  The Nevada Gaming Control Board's March 4, 2025 cease and desist order to KalshiEX LLC is recorded below from
  the Board's own news release. Press reports state that Kalshi then sued the Board and the Attorney General in
  the US District Court for the District of Nevada and obtained a preliminary injunction, and that the Board
  later issued similar orders to other platforms; none of those later records was found on a Nevada state domain
  by search on 2026-10-16, so they are not entered. Absence of a record is not a finding that none exists.
