state_actions:
  - action_type: cease_and_desist
    date: "2025-03-04"
    issuing_body: Nevada Gaming Control Board
    target: KalshiEX LLC
    summary: >-
      The Board ordered Kalshi to cease offering event-based contracts on sporting events and election outcomes
      in Nevada, stating that such activity is unlawful unless and until approved as licensed gaming by the
      Nevada Gaming Commission, and set a compliance deadline of 5:00 p.m. on March 14, 2025. The order stated
      that past activity remains subject to criminal and civil penalties and that future activity would be
      treated as willful.
    document_url: https://www.gaming.nv.gov/uploadedFiles/gamingnvgov/content/about/press-release/NGCB%20-%20News%20Release%20-%20KalshiEX%20Cease%20and%20Desist%20Order%20(3-4-2025).pdf
    provenance:
      <<: *nvcd
      notes: Date, target, deadline and quoted language taken from the Board's news release as surfaced by search on 2026-10-16. The release could not be opened from the review container; archive it before verification.
