summary: >-
  Nevada has licensed sports pools under the Nevada Gaming Control Act (NRS chapter 463) since before the
  federal Professional and Amateur Sports Protection Act of 1992, from which it was exempt. Race books and
  sports pools are regulated by the Nevada Gaming Control Board and the Nevada Gaming Commission under
  Regulation 22, and mobile wagering accounts are offered by licensed sports pools. Gaming revenue, including
  sports pool revenue, is subject to the state's tiered monthly percentage fee under NRS 463.370.
