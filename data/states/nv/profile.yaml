limitations:
  - Nevada's percentage fee applies to all nonrestricted gaming revenue at a property, so no sports-specific tax receipt series exists; sports pool win is published separately by the Board but tax attribution is computed, not reported.
  - Nevada's sports pool win series is the longest in the country but counts visitors' wagers; per capita handle for Nevada residents is not observable.
  - Minimum age (NRS 463.350), self-exclusion (Regulation 5.170 operator programs), deposit limit and advertising rules were not confirmed from primary pages by search on 2026-10-16 and are left unentered.
