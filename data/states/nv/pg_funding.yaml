  mechanism_text: NRS 463.320 requires the Nevada Gaming Commission to deposit quarterly in the Revolving Account to Support
    Programs for the Prevention and Treatment of Problem Gambling an amount equal to 2 dollars for each slot machine subject
    to the state slot machine license fee; the deposit is a fixed amount per machine, not a share of gaming revenue. NRS 458A.090
    creates the account in the State General Fund, to be administered by the Director of the Department of Health and Human
    Services for grants or contracts for prevention and treatment programs, data collection, needs assessment, evaluation
    and technical assistance, with no more than 10 percent for administration. Sports pool revenue contributes nothing specific
    to the account; its size tracks the number of slot machines in the state and has declined as machine counts fell.
  administering_agency: Nevada Department of Health and Human Services, Division of Public and Behavioral Health
