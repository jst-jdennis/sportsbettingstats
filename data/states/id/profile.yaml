summary: >-
  Idaho has not authorized sports wagering. Article III, Section 20 of the Idaho Constitution declares gambling
  contrary to public policy and strictly prohibited, with exceptions only for the state lottery, pari-mutuel
  betting and charitable bingo and raffles; authorizing sports wagering would require a constitutional amendment
  approved by voters. Tribal casinos operate under federal law and compacts, and no state body regulates sports
  wagering.
