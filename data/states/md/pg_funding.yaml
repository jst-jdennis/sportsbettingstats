  mechanism_text: 'Maryland funds the Problem Gambling Fund (Health-General section 19-803) mainly through fixed annual assessments
    on casino operators: State Government section 9-1A-33 requires the State Lottery and Gaming Control Commission to collect
    an annual fee of 425 dollars for each video lottery terminal operated by a licensee and to distribute it to the Problem
    Gambling Fund, and the Commission has set a 500 dollar annual fee per table game by regulation. The sports wagering law
    adds unclaimed sports wagering winnings, which revert to the fund 182 days after a wager is won, but it does not dedicate
    a share of sports wagering tax. The Maryland Department of Health administers the fund and contracts with the Maryland
    Center of Excellence on Problem Gambling for services.'
