limitations:
  - Maryland taxes proceeds after a capped free promotional play exclusion, so taxable proceeds understate gross revenue, especially in each operator's first full fiscal year when the exclusion is uncapped.
  - The mobile tax rate changed on July 1, 2025, so contributions to the state before and after that date are not comparable as a measure of volume.
  - Maryland shares borders with Virginia, Pennsylvania, West Virginia, Delaware and the District of Columbia, all with online wagering, so cross-border handle flows in both directions.
