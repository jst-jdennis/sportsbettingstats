tax:
  - channel: retail
    basis: adjusted_gross_revenue
    rate: 0.15
    tiers: null
    per_wager_fee_cents: null
    promo_deduction_rule: >-
      Taxable proceeds are handle less winnings and less free promotional play. After a licensee's first full
      fiscal year the promotional exclusion may not exceed a percentage of prior-year proceeds set by Commission
      regulation (20 percent; an August 2025 proposal would reduce the mobile cap to 5 percent, and its adoption
      was not confirmed by search on 2026-10-16).
    effective_from: "2021-12-09"
    effective_to: null
    destination:
      - fund_name: Blueprint for Maryland's Future Fund
        share: 1.0
    authority_citation: Md. Code, State Gov. Title 9, Subtitle 1E (Chapter 356 of 2021); Agency revenue reports state 15 percent of taxable proceeds for retail operators
    provenance:
      <<: *mdreg
      source_url: https://www.mdgaming.com/maryland-sports-wagering/revenue-reports/
      notes: Rate and destination from the Agency's revenue report pages. The statute section number for the rate was not confirmed by search on 2026-10-16.
