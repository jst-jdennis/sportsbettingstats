summary: >-
  Maryland voters approved sports wagering as Question 2 in November 2020, and the General Assembly
  implemented it through House Bill 940, Chapter 356 of 2021, effective on signing May 18, 2021. Retail
  wagering began December 9, 2021 and mobile wagering November 23, 2022, regulated by the Maryland Lottery
  and Gaming Control Agency. The tax is 15 percent of taxable proceeds for retail and, since Chapter 604 of
  2025, 20 percent for mobile operators.
