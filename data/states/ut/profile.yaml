limitations:
  - Utah is a comparison state with no regulated gambling of any kind. Residents can and do use offshore sites, sweepstakes products and, depending on platform geofencing, federally regulated prediction markets; none of that activity appears in any state revenue series.
  - Litigation over whether Utah may apply its gambling statutes to a federally designated prediction market exchange was pending in the Tenth Circuit as of 2026-10-16 (press reports; no primary-domain record retrieved). It belongs in prediction_markets.yaml once a primary record is archived.
