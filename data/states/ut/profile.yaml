summary: >-
  Utah has not authorized sports wagering in any form and has no lottery, casinos or pari-mutuel wagering.
  Article VI, section 27 of the Utah Constitution bars the Legislature from authorizing any game of chance,
  lottery or gift enterprise, so authorization would require a constitutional amendment. The gambling offenses
  in Title 76 of the Utah Code were amended in 2026 to define a proposition bet.
