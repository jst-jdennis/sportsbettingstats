  mechanism_text: Utah authorizes no lottery, casino, racing or sports wagering (Utah Const. art. VI, sec. 27; gambling offenses
    in Utah Code Title 76), so there is no gambling revenue to dedicate and no state gaming regulator. No Utah statute or
    appropriation line for problem gambling services was found. Any services would be funded, if at all, through the general
    substance use and mental health budget of the Department of Health and Human Services, Office of Substance Use and Mental
    Health, delivered by county local authorities; no primary document stating that gambling is covered was located.
