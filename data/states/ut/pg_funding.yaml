    notes: 'Searched le.utah.gov (bills, fiscal notes, Legislative Fiscal Analyst budget documents and interim materials),
      sumh.utah.gov, dhhs.utah.gov, cobi.utah.gov and medicaid.utah.gov for "problem gambling", "gambling disorder" and "gambling
      addiction" with "appropriation", "treatment" and "funding". Results were limited to gambling prohibition and enforcement
      bills (for example 2020 S.B. 214, "Money Appropriated in this Bill: None") and general behavioral health budget lines
      that do not mention gambling. No agency or legislative report stating that Utah provides no problem gambling funding
      was found, so none is not used. The Utah Constitution page and le.utah.gov could not be fetched from this session (network
      policy). To settle: ask the Office of Substance Use and Mental Health whether any state or federal block grant money
      is directed to gambling disorder services, and check the Social Services Appropriations Subcommittee budget for a gambling
      line.'
