    notes: '20.435(5)(kg) as shown in search excerpts of the official page: "Compulsive gambling awareness campaigns. The
      amounts in the schedule for the purpose of awarding grants under s. 46.03 (43). All moneys transferred from s. 20.566
      (8) (q) shall be credited to this appropriation account. Notwithstanding s. 20.001 (3) (a), the unencumbered balance
      of this appropriation account at the end of each fiscal year shall be transferred to the lottery fund." The legislature''s
      site could not be fetched from this session (network policy), so the schedule amount for 2025-26 and 2026-27 (2025 Wis.
      Act 15) and the current text of s. 20.566(8)(q) and s. 20.505(8)(hm) were not read; a reviewer should open them. Classified
      as appropriation because the amount is a schedule figure re-set each budget; if a reviewer reads s. 20.566(8)(q) as
      a fixed statutory transfer from the lottery fund, reclassify as statutory_earmark_fixed. The 1999 and 2001 budget acts
      show the account was once fed from Indian gaming receipts under s. 20.505(8)(hm) before the lottery fund source was
      substituted (2001 Wis. Act 16, s. 740). Amount to come from the ch. 20 schedule for s. 20.435(5)(kg) or the Legislative
      Fiscal Bureau informational paper Tribal Gaming in Wisconsin (Paper 91, January 2025, https://docs.legis.wisconsin.gov/misc/lfb/informational_papers/january_2025)
      and State Lottery and Charitable Gaming (Paper 90, January 2025). Searched docs.legis.wisconsin.gov, dhs.wisconsin.gov
      and doa.wi.gov.'
