  mechanism_text: Wisconsin funds problem gambling services through a Department of Health Services appropriation in the biennial
    budget rather than a statutory share of gaming revenue. Wis. Stat. 20.435(5)(kg), compulsive gambling awareness campaigns,
    appropriates the amounts in the schedule for grants under s. 46.03(43), credited with moneys transferred from the lottery
    appropriation under s. 20.566(8)(q), with the unencumbered year-end balance returned to the lottery fund. The schedule
    amount is set by the legislature each budget, so the dollar level is an appropriation decision, not a formula. The Department
    of Health Services awards the grants (historically to the Wisconsin Council on Problem Gambling for the helpline and awareness
    work). Tribal gaming compact payments are credited to s. 20.505(8)(hm) and transferred to listed state programs; whether
    a current subdivision funds compulsive gambling services could not be confirmed.
