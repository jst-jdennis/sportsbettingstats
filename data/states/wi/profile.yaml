limitations:
  - Wisconsin publishes no handle or revenue series for tribal sports wagering, so the state cannot be placed in revenue comparisons.
  - Minimum age and self-exclusion terms are set by compact and tribal ordinance and were not confirmed on a primary page by search on 2026-10-16; the sections are left empty rather than estimated.
  - Press reports describe lawsuits filed by the Wisconsin Attorney General in April 2026 against prediction market operators over sports event contracts. No release on a state domain was retrieved, so no prediction_markets.yaml record is entered; see the review report.
