name: Wisconsin
profile_completeness: status_only
summary: >-
  Wisconsin has no statute authorizing commercial sports wagering. Sports and other event wagering is offered
  only by tribes whose Class III gaming compacts with the state have been amended to permit it, beginning with
  the Oneida Nation amendment signed on July 1, 2021. The Oneida sportsbook near Green Bay opened on
  November 30, 2021 and other tribes followed. The compacts also permit remote wagering on tribal land; no
  statewide mobile wagering is authorized.
