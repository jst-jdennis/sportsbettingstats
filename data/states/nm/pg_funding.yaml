    notes: 'The Board''s page states that racetrack gaming operator licensees "are required to contribute one quarter of one
      percent of net slot revenues toward the prevention, education, and treatment of compulsive gambling" and that the set-aside
      has funded counseling, personnel training in recognizing problem gambling, help line advertising and participation in
      the New Mexico Problem Gambling Alliance. The statute itself reads "A racetrack gaming operator licensee shall spend
      no less than one-fourth percent of the net take of its gaming machines to fund or support programs for the treatment
      and assistance of compulsive gamblers" (Subsection E in the 2018 compilation; the 2023 amendments, Laws 2023 ch. 122
      and ch. 154, restructured the subsection and the current letter was not confirmed). The official compilation is on nmonesource.com
      (New Mexico Compilation Commission); its section URL could not be opened from the drafting container and is cited here
      through the Board''s page, which is the state page that states the requirement. The compact text hosted by the Bureau
      of Indian Affairs (https://www.bia.gov/sites/default/files/dup/assets/as-ia/oig/pdf/508_compliant_2015.06.22_pueblo_of_acoma_tribal_state_gaming_compact.pdf)
      was excerpted as requiring the Gaming Enterprise to spend "annually, an amount no less than one-quarter of one percent
      (.25%) of its Adjusted Net Win" on compulsive gambler treatment and assistance and prevention, with "a substantial portion"
      to "an organization that has expertise in and provides such services". The lead citation to a Responsible Gaming Association
      of New Mexico was not found in any document; the Board names the New Mexico Problem Gambling Alliance. No annual dollar
      figure is published by the state; the Board''s annual report or licensee compliance filings would be the source. Outbound
      web fetches were blocked from the drafting container, so quotes come from search-engine excerpts of the cited pages.
      Archived copy checked on 2026-10-17: The Gaming Control Board page as archived states that racetrack gaming operator
      licensees are required to contribute one quarter of one percent of net slot revenues toward the prevention, education
      and treatment of compulsive gambling.'
