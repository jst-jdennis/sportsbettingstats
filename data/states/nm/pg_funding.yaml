  mechanism_text: Section 60-2E-47 of the Gaming Control Act requires each racetrack gaming operator licensee to spend no
    less than one-fourth percent of the net take of its gaming machines to fund or support programs for the treatment and
    assistance of compulsive gamblers; the money is spent by the licensees under Gaming Control Board oversight rather than
    paid to the state. Section 4(B)(16) of the 2015 tribal-state Class III gaming compact imposes a parallel obligation on
    each tribal gaming enterprise to spend at least one-quarter of one percent of its adjusted net win on compulsive gambling
    treatment, assistance and prevention, with a substantial portion going to an organization with expertise in such services.
    Sports wagering at tribal casinos falls under the compact share; no state appropriation or state-held problem gambling
    fund was found.
  administering_agency: New Mexico Gaming Control Board (compliance oversight; funds are spent by racetrack licensees and
    tribal gaming enterprises)
