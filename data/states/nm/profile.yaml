name: New Mexico
profile_completeness: status_only
summary: >-
  New Mexico has no statute authorizing sports wagering. Several tribal casinos offer retail sports wagering on
  the position that the 2015 tribal-state Class III gaming compact, which does not name sports wagering, permits
  it; the first sportsbook opened at Santa Ana Star Casino in October 2018 under the regulation of the Pueblo of
  Santa Ana Gaming Regulatory Commission. The New Mexico Gaming Control Board monitors compact compliance but
  does not license sports wagering, and no online wagering is authorized.
