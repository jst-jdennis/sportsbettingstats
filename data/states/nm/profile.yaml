limitations:
  - New Mexico tribal sportsbooks report no handle or revenue to the state, and the compact revenue sharing formula applies to slot machine net win only. No sports wagering revenue series exists for the state.
  - Problem gambling indicators for New Mexico reflect a large tribal casino and racino market and cannot be attributed to sports wagering.
  - Minimum age at tribal sportsbooks is set by compact and tribal ordinance (reported as 21) and was not confirmed from a state domain on review.
