    notes: 'The leginfo section page follows the publisher''s URL pattern and could not be opened from this container. Search
      excerpts on 2026-10-17 quoted 12012.85 as making fund money "available for appropriation by the Legislature for ...
      grants, including any administrative costs, for programs designed to address gambling addiction", and a 2023 bill analysis
      (SB 351) described existing law as "prioritizing an appropriation to the Office of Problem Gambling within the State
      Department of Public Health". The Department of Public Health''s Office of Problem Gambling brief (https://www.cdph.ca.gov/Programs/OPG/CDPH%20Document%20Library/OPG_Brief.pdf,
      undated, not opened) states total annual funding of 8.5 million dollars from the Special Distribution Fund, the Gambling
      Addiction Program Fund and a California Lottery interagency agreement. The amount will come from the Budget Act of 2025,
      Department of Public Health item 4265 (Indian Gaming Special Distribution Fund, local assistance and state operations).
      The 2022 State Auditor report 2021-102 found the fund''s reserve excessive and oversight of the problem gambling programs
      weak. Archiving on 2026-10-17 did not yield the section text: the leginfo.legislature.ca.gov section page refused the
      archiving request (HTTP 403); the clause remains as taken from the search excerpt until a reviewer opens the page.'
