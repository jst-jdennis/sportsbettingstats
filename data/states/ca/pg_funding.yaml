  funding_mechanism: appropriation
  mechanism_text: The Office of Problem Gambling in the California Department of Public Health, established by Welfare and
    Institutions Code 4369, is funded by annual Budget Act appropriations from the Indian Gaming Special Distribution Fund,
    which holds tribal compact payments and which Government Code 12012.85 makes available for appropriation for, among other
    purposes, grants for programs designed to address gambling addiction, with an appropriation to the Office of Problem Gambling
    listed among the priority uses. The statute does not dedicate a percentage or fixed sum, so the amount is set each year
    by the Legislature. The office also receives money from the Gambling Addiction Program Fund (cardroom license fees) and
    an interagency agreement with the California Lottery. California has no regulated sports wagering.
  administering_agency: California Department of Public Health, Office of Problem Gambling
