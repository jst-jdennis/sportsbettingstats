summary: >-
  California has not authorized sports wagering. Two competing ballot measures in November 2022, Proposition 26
  (in-person wagering at tribal casinos and racetracks) and Proposition 27 (online wagering), both failed by wide
  margins. Tribal casinos operate Class III gaming under compacts that do not cover sports wagering, and no
  authorizing statute or initiative has qualified since.
