limitations:
  - California is the largest comparison state with no regulated sports wagering. Residents may use offshore sites, sweepstakes products and, depending on platform geofencing, federally regulated prediction markets; none of that activity appears in any state revenue series.
  - Problem gambling indicators for California reflect all gambling, including a large tribal casino and cardroom market, and cannot be read as sports wagering effects.
  - The California Attorney General has joined multistate amicus briefs defending other states' enforcement against prediction market operators (most recently in KalshiEx LLC v. Schuler, Sixth Circuit, on 2026-06-12) but search found no California cease and desist, advisory or lawsuit directed at a platform; that history is tracked in prediction_markets.yaml if and when a state action is found.
