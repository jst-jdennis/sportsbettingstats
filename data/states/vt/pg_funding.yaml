  mechanism_text: 'Act 63 of 2023 (H.127) deposits all sports wagering revenues and fees received by the Department of Liquor
    and Lottery into the Sports Wagering Enterprise Fund (31 V.S.A. 1304 and 1341) and directs the Department of Mental Health
    to establish and administer a Problem Gambling Program for education, assistance and treatment services and public awareness
    (31 V.S.A. 1341a). The act''s appropriations section funds the program from the fund: $250,000 in fiscal year 2024, and
    in each fiscal year after fiscal year 2025 a sum equal to five percent of the annual sports wagering revenue received
    by the Department of Liquor and Lottery, appropriated from the Sports Wagering Enterprise Fund to the Department of Mental
    Health. The Department of Mental Health reported a $500,000 program budget for state fiscal year 2025. Act 63 as enacted
    appropriates a sum for one fiscal year and fixes no share of revenue, so the mechanism is an appropriation; the 500,000
    dollar SFY25 budget is the latest amount.'
