limitations:
  - Vermont reports the state's revenue share rather than a tax, and the share differs by operator (31 or 33 percent of adjusted gross revenue). Do not compare the headline percentage with tax rates in states that permit promotional deductions.
  - The market is small and launched in January 2024, so monthly figures are volatile and seasonal patterns are not yet established.
  - No Vermont cease and desist, lawsuit or advisory opinion directed at a prediction market platform was found by search on 2026-10-16; absence of a record is not a finding that none exists.
