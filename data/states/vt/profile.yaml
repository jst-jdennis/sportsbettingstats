  - channel: online
    basis: adjusted_gross_revenue
    rate: null
    tiers: null
    per_wager_fee_cents: null
    promo_deduction_rule: The state's share is a contracted percentage of adjusted gross revenue, with a statutory floor of 20 percent. Per the Commissioner's testimony to the legislature, adjusted gross revenue allows deduction of federal excise tax but not promotional play. Contracted shares are 33 percent (FanDuel) and 31 percent (DraftKings and Fanatics), so no single flat rate applies.
    effective_from: "2024-01-11"
    effective_to: null
    destination:
      - fund_name: Sports Wagering Enterprise Fund
        share: null
    authority_citation: Act 63 (2023), 31 V.S.A. 1304 (revenues to the Sports Wagering Enterprise Fund); operator contracts set the revenue share. Each operator also pays an operator fee ($550,000 over the contract term per the Senate proposal of amendment; confirm against the enacted text).
    provenance:
      <<: *vtleg
      notes: Structure is a revenue share under Department contracts, not a tax on licensees. Rate left null because it differs by operator; the 31 and 33 percent figures come from Department testimony filed with the House Ways and Means Committee (legislature.vermont.gov, H.887 public comment, 2024) and the Department's January 2025 Responsible Gaming Program status report. Confirm the 20 percent floor and the fund name against 31 V.S.A. 1304.
