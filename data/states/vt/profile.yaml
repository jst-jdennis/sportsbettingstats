summary: >-
  Vermont authorized mobile sports wagering through Act 63 of 2023 (H.127), which directs the Department of
  Liquor and Lottery to operate a sportsbook through two to six contracted operators selected by competitive
  bid. Wagering began on January 11, 2024 with three operators. There is no retail sports wagering. The state
  receives a negotiated share of each operator's adjusted gross revenue rather than a tax on licensees.
