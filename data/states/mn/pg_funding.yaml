  mechanism_text: 'Minnesota has no regulated sports betting; problem gambling services are funded by statutory shares of
    charitable (lawful) gambling tax and lottery revenue. Minn. Stat. 297E.02, subd. 3, appropriates one-half of one percent
    of lawful gambling tax revenue deposited in the general fund to the commissioner of human services for the compulsive
    gambling treatment program established under Minn. Stat. 245.98, and a further one-half of one percent for a grant to
    the state affiliate of the National Council on Problem Gambling for awareness, training and research, with a requirement
    that the money supplement rather than replace existing state funding. Lottery revenue also supports the program: the Governor''s
    2026-27 lottery budget reports about 1.5 million dollars a year designated for compulsive gambling treatment from lottery
    proceeds. The program is run by the Department of Human Services.'
