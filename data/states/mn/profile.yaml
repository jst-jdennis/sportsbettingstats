summary: >-
  Minnesota has not authorized sports wagering in any form. Bills were introduced in each session from 2019
  through 2026; in the 2026 session the Senate declined to adopt the committee report on SF 4139 by a 22 to 44
  vote on March 23, 2026, and the companion House bill HF 4204 did not reach a floor vote before adjournment.
  Tribal casinos operate Class III gaming under compacts that do not cover sports wagering.
