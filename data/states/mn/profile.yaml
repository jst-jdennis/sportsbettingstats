limitations:
  - Minnesota is a comparison state with no regulated sports wagering. Residents can use offshore sites, sweepstakes products and, depending on geofencing, federally regulated prediction markets; none of that activity appears in any state series.
  - Minnesota borders Iowa, which has had online wagering since 2019, so some resident activity appears in Iowa's figures.
  - Problem gambling indicators reflect a large tribal casino and charitable gambling market and cannot be read as sports wagering effects.
