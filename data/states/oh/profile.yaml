summary: >-
  Ohio authorized retail and online sports gaming through House Bill 29 of the 134th General Assembly, effective
  March 23, 2022, and both channels launched on January 1, 2023 under the Ohio Casino Control Commission. The tax
  on sports gaming receipts was raised from 10 percent to 20 percent by the 2023 budget act, and promotional
  credits are not deductible until 2027. The Commission runs a statewide voluntary exclusion program that covers
  casinos, racinos and sports gaming.
