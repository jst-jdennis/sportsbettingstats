limitations:
- Ohio's taxable base is sports gaming receipts with no promotional credit deduction through 2026, so Ohio's reported
  taxable revenue is higher relative to handle than in states that deduct promotions. Comparisons must adjust for this,
  and the base changes again in 2027 and 2032.
- Type C kiosk sports gaming through the Ohio Lottery is reported separately from type A and type B proprietors.
- Residents also used federally regulated prediction markets during the period covered; that activity is outside the
  Commission's revenue series and is tracked in prediction_markets.yaml.
