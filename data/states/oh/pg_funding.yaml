  mechanism_text: Ohio Rev. Code 5753.031 creates the problem sports gaming fund in the state treasury and, after a transfer
    to the sports gaming tax administration fund to cover the Department of Taxation's costs, directs two percent of the sports
    gaming tax collected to it, with the other ninety-eight percent going to the sports gaming profits education fund. The
    Ohio Casino Control Commission spends the fund under an agreement with the Department of Mental Health and Addiction Services
    (renamed the Department of Behavioral Health in 2025), which runs the program of services to alleviate problem sports
    gaming on the Commission's behalf under Ohio Rev. Code 3772.062. A separate two percent share of the casino tax funds
    the problem casino gambling and addictions fund, which pays for the statewide helpline. The FY 2026 appropriation for
    line item 955602 (Problem Sports Gaming, Fund 5YR0) is 3,500,000 dollars.
  administering_agency: Ohio Casino Control Commission, through an agreement with the Ohio Department of Mental Health and
    Addiction Services (Department of Behavioral Health)
