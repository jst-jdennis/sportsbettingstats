  mechanism_text: D.C. Code 36-621.15 as currently codified imposes the sports wagering tax (20, 10 or 30 percent of gross
    sports wagering revenue by operator class) and shows subsections (c) and (d) as repealed. Subsection (c)(1), added by
    D.C. Law 22-312 in 2019, had directed the first 200,000 dollars of the tax each year to Department of Behavioral Health
    programs to prevent, treat and research gambling addiction; the section has since been amended by D.C. Law 25-50 (2023),
    25-217 (2024) and 26-55 (2025), and the current text carries no problem gambling earmark. No appropriation line for problem
    gambling services was located, so the current mechanism is recorded as unknown.
  administering_agency: District of Columbia Department of Behavioral Health
