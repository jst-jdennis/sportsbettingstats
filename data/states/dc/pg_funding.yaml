  mechanism_text: The District's sports wagering tax statute directs the first $200,000 of sports wagering tax revenue each
    year to programs run through the Department of Behavioral Health to prevent, treat and research gambling addiction. The
    2018 act originally split the remainder between the Early Childhood Development Fund and the Neighborhood Safety and Engagement
    Fund, and the code now marks that second paragraph repealed. Press and Council oversight reporting in 2023 said the Department
    of Behavioral Health had not spent the set-aside and that the FY2024 budget did not fund it, so the reviewer should confirm
    whether the $200,000 is still budgeted in the latest Budget Support Act.
