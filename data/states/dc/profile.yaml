limitations:
  - The District's published sports wagering figures mix a District-operated platform (GambetDC, then FanDuel) with privately licensed Class A, B and C operators under different tax and revenue arrangements, so District totals are not directly comparable to a single-model state.
  - Federal enclaves and the two-block exclusion zones around sports venues shaped where mobile wagers could be placed before the 2024 amendments; handle before and after August 2024 reflects different geographic rules.
