profile_completeness: full
summary: >-
  The District of Columbia authorized sports wagering through the Sports Wagering Lottery Amendment Act of 2018
  (D.C. Law 22-312). The Office of Lottery and Gaming runs a District-operated mobile platform (GambetDC from 2020,
  replaced by FanDuel on April 15, 2024) and licenses private Class A, B and C operators at and around sports
  venues and retail locations. The Sports Wagering Amendment Act of 2024 (Subtitle R of D.C. Law 25-217) opened
  District-wide mobile wagering to Class A and Class C operators and replaced the flat 10 percent tax with
  class-based rates from August 1, 2024.
