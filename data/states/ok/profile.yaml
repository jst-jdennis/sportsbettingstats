name: Oklahoma
profile_completeness: full
summary: >-
  Oklahoma has not authorized sports wagering in any form. Tribal casinos operate Class III gaming under
  compacts with the state, and those compacts do not cover sports wagering. The most recent authorization
  attempt, House Bill 1047, passed the House and failed on the Senate floor on April 22, 2026.
