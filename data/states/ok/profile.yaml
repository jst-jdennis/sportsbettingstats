limitations:
  - Oklahoma is a comparison state with no regulated sports wagering. Residents can and do use offshore sites, sweepstakes products and, depending on platform geofencing, federally regulated prediction markets; none of that activity appears in any state revenue series.
  - Problem gambling indicators for Oklahoma reflect all gambling, including a large tribal casino market, and cannot be read as sports wagering effects.
