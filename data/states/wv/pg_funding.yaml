    notes: '29-22A-19: "The fund shall be appropriated from the Commission''s administrative expense account and shall be
      not less than $150,000 nor more than $500,000 per fiscal year" and "The Department of Human Services shall administer
      the grants and funds issued from the ''Compulsive Gambling Treatment Fund''." 29-22B-1408 (https://code.wvlegislature.gov/29-22B-1408/):
      not less than $150,000 nor more than $1 million per fiscal year, as the commission determines. 29-22C-27 (https://code.wvlegislature.gov/29-22C-27/):
      at least $100,000 and not more than $500,000 annually. 29-22D-17 (https://code.wvlegislature.gov/29-22D-17/) was checked
      and has no compulsive gambling share, so the lead that sports wagering revenue funds the program is not supported. The
      code site could not be fetched from this session (network policy); the quotations are from search excerpts of the official
      pages and should be confirmed. Amount: the West Virginia Lottery financial report for the year ended June 30, 2025 (http://www.wvlegislature.gov/legisdocs/reports/agency/L04_FY_2025_26834.pdf)
      and the Department of Human Services annual report to the Joint Committee should give the actual transfers; the Lottery''s
      responsible play page says it provides up to $2 million a year. Record the combined transfer when sourced. Archived
      copy checked on 2026-10-17: W. Va. Code 29-22A-19 as archived establishes the Compulsive Gambling Treatment Fund, appropriated
      from the Commission''s administrative expense account at not less than 150,000 dollars and not more than 500,000 dollars
      per fiscal year, administered by the Department of Human Services.'
