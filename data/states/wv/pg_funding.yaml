  mechanism_text: 'West Virginia funds the Compulsive Gambling Treatment Fund with fixed annual dollar amounts set by statute
    and chosen by the Lottery Commission within statutory bands, not with a percentage of revenue: W. Va. Code 29-22A-19 appropriates
    not less than $150,000 nor more than $500,000 per fiscal year from the commission''s racetrack video lottery administrative
    expense account; 29-22B-1408 transfers not less than $150,000 nor more than $1,000,000 per fiscal year from the limited
    video lottery two percent administrative share; and 29-22C-27 transfers not less than $100,000 nor more than $500,000
    per year from the racetrack table games administrative allowance. The Department of Human Services administers the grants
    and funds and must report annually to the Joint Committee on Government and Finance. The sports wagering fund statute
    (29-22D-17) directs net profit to the State Lottery Fund and the PEIA Financial Stability Fund and contains no problem
    gambling allocation.'
