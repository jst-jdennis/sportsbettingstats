    authority_citation: 179 CSR 9, section 13.4.4 (mobile applications and other digital platforms must have rules governing self-imposed responsible gaming limits and the ability for the patron to establish those limits); compare 179 CSR 10, section 6.22 (interactive wagering deposit, spend and time limits on a daily, weekly and monthly basis)
    notes: >-
      The sports wagering rule requires online sports pool sites and apps to carry rules governing self-imposed
      responsible gaming limits and the ability for the patron to establish those limits; it does not, in the
      excerpt, specify limit periods, a default limit, a limit at registration or a cooling-off period. The
      Lottery's separate interactive wagering rule (179 CSR 10, section 6.22) requires deposit and spend limits on a
      daily, weekly and monthly basis and a daily time limit, with decreases effective no later than the next login
      and increases effective only after the previous limit period expires; that rule governs interactive casino
      wagering, not sports wagering, and is noted for comparison only. Quoted from a search excerpt of a mirror of
      the cited rule; the official page itself could not be opened from the drafting environment.
