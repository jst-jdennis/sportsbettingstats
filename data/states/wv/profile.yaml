  advertising:
    - rule_type: other
      text: >-
        The Director shall approve all advertising of sports wagering systems in advance of a sports pool operator,
        its sports pool intermediaries, its agents or its affiliates publishing or otherwise releasing such
        advertisements; further requirements are defined by the Commission in its minimum internal control
        standards. The Commission may cap the amount or percentage of revenue used for promotional credits, set
        quarterly by Commission order, and any excess promotional credit must be accounted for as taxable revenue.
      authority_citation: 179 CSR 9, section 21 (advertising), subsections 21.1 and 21.2
