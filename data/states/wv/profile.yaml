summary: >-
  West Virginia enacted the West Virginia Lottery Sports Wagering Act (SB 415) in March 2018, before the
  Supreme Court's decision in Murphy v. NCAA. The West Virginia Lottery licenses the state's five casinos
  and racetracks as sports wagering operators and their online platforms. Retail wagering began at Hollywood
  Casino at Charles Town Races on August 30, 2018 and the first mobile app launched in late December 2018.
  Operators pay a 10 percent privilege tax on adjusted gross sports wagering receipts.
