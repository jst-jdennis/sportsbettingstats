limitations:
  - West Virginia reports adjusted gross receipts (gross receipts less winnings), which is closer to a gross revenue measure than states that deduct promotional credits; compare with care.
  - The first mobile platform operated only from December 2018 to March 2019; online handle series effectively begin in August 2019.
  - No West Virginia Lottery or Attorney General cease and desist, lawsuit or advisory opinion directed at a prediction market platform was found by search on 2026-10-16; absence of a record is not a finding that none exists.
