    enrollment_methods: null
    url: https://www.in.gov/igc/files/sportswagering/Sports-Wagering-FAQs.pdf
    notes: >-
      The Commission's FAQs state that a person may exclude himself or herself from all sports wagering by enrolling
      in the Voluntary Exclusion Program, that the Commission also runs a statewide Internet Self-Restriction Program,
      and that each operator must maintain its own separate self-exclusion program. House Bill 1052 (2026) proposed
      adding sports wagering certificate holders to the statutory VEP; its enactment was not confirmed. Durations
      not confirmed by search.
