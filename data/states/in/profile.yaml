  - channel: all
    basis: adjusted_gross_revenue
    rate: 0.095
    tiers: null
    per_wager_fee_cents: null
    promo_deduction_rule: >-
      Adjusted gross receipts under 68 IAC 27-1-2 are all cash and property received from sports wagering less
      winnings paid to patrons and less uncollectible receivables capped at the lesser of a reasonable provision or
      2 percent of the total. The definition contains no deduction for promotional credits or free play.
    effective_from: "2019-09-01"
    effective_to: null
    destination: null
    authority_citation: IC 4-38-10-1 (9.5 percent tax on adjusted gross receipts of a certificate holder), as summarized in the Indiana Gaming Commission's June 15, 2023 sports wagering presentation
