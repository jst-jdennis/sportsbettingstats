summary: >-
  Indiana authorized sports wagering in House Enrolled Act 1015 (2019), codified at Indiana Code article 4-38,
  which took effect July 1, 2019. Retail wagering began at casinos and off-track betting locations on September 1,
  2019 and the first mobile operators went live on October 3, 2019. The Indiana Gaming Commission licenses
  operators and taxes adjusted gross receipts at 9.5 percent.
