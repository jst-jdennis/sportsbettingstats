    notes: 'Operative language as excerpted from the enrolled text of HEA 1194 (2024) on iga.in.gov and from a current-code
      mirror: "three and thirty-three hundredths percent (3.33%) of the admissions tax and supplemental wagering tax collected
      by the licensed owner during the preceding calendar quarter must be paid to the division of mental health and addiction"
      and "The division shall allocate at least twenty-five percent (25%) of the funds derived from the admissions tax to
      the prevention and treatment of compulsive gambling." The iga.in.gov host was blocked by this session''s network policy,
      so the code section itself was not opened; the reviewer must confirm the subsection letters and whether the 2026 session
      (HB 1210, HB 1052) moved this language or created a separate responsible gaming and problem gambling services fund.
      The Indiana Gaming Commission sports wagering FAQ states that the sports wagering tax is deposited in the state general
      fund. Amount to be taken from the State Comptroller or State Budget Agency gaming distribution report line for the addiction
      services fund. Archiving on 2026-10-17 did not yield the section text: the Indiana Code page archived is rendered by
      script and holds no section text; the clause remains as taken from the search excerpt until a reviewer opens the page.'
