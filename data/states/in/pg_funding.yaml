  mechanism_text: Indiana's riverboat statute pays 3.33 percent of the admissions tax and supplemental wagering tax collected
    by each licensed owner to the Division of Mental Health and Addiction, which must allocate at least 25 percent of that
    money to the prevention and treatment of compulsive gambling. The money is deposited in the addiction services fund established
    by Ind. Code 12-23-2-2 and administered by the Family and Social Services Administration. The 9.5 percent sports wagering
    tax under Ind. Code 4-38-10 is deposited in the state general fund with no problem gambling share.
  administering_agency: Indiana Family and Social Services Administration, Division of Mental Health and Addiction
