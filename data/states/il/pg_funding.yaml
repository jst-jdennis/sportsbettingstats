    notes: 'Operative language as summarized by the search engine from the ilga.gov section page: appropriations, as approved
      by the General Assembly, may be made from the State Gaming Fund to the Department of Human Services for the administration
      of programs to treat problem gambling, including problem gambling from sports wagering. Both the ilga.gov fulltext path
      and the documents path were blocked by this session''s network policy (DNS and proxy refusal, not the site''s bot block),
      so the section was not opened; the reviewer must confirm the subsection and that no later amendment added a fixed share.
      230 ILCS 45/25-90 (Sports Wagering Fund) as excerpted directs fund transfers to the General Revenue Fund and the Capital
      Projects Fund and no Department of Human Services share was seen in it; 230 ILCS 45/25-95 only requires a helpline statement
      on licensee platforms. Amount to be taken from the FY2026 appropriations act line for the Department of Human Services
      from the State Gaming Fund; IDHS notices of funding opportunity for FY26 estimate $4,000,000 for the gambling disorder
      public awareness campaign and $800,000 for the helpline and website, with the helpline described as funded by a split
      between the gambling initiative and the Illinois Lottery. Archiving on 2026-10-17 did not yield the section text: ilga.gov
      did not respond to the archiving request; the clause remains as taken from the search excerpt until a reviewer opens
      the page.'
