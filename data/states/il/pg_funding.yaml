  mechanism_text: The Illinois Gambling Act provides that appropriations approved by the General Assembly may be made from
    the State Gaming Fund to the Department of Human Services for programs to treat problem gambling, including problem gambling
    from sports wagering. The statute names the fund and the program but dedicates no percentage or fixed amount, so the amount
    depends on the annual appropriation. The Department of Human Services Division of Behavioral Health and Recovery awards
    the money as gambling disorder treatment, prevention, helpline and public awareness grants, with the helpline also drawing
    on Illinois Lottery funds.
