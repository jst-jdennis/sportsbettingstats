review_note: >-
  The Illinois Gaming Board publishes its cease and desist letters at
  https://igb.illinois.gov/sports-wagering/cease-and-desist-letters.html. The index lists KalshiEX LLC d/b/a Kalshi
  (04/01/2025), Robinhood and Crypto.com (2025) and Polymarket (01/27/2026) as operators the Board believes are
  engaging in unlicensed sports wagering. The Board also filed a comment with the CFTC on 2025-04-25 asking it to
  prohibit designated contract markets from offering sports event contracts that violate state law
  (https://igb.illinois.gov/content/dam/soi/en/web/igb/documents/press-releases/additional-news/20250425-comment-to-the-commodities-futures.pdf).
  Trade press reported a December 2025 suit by Coinbase against the Board in Illinois; no primary docket record was
  found by search, so litigation is left empty. No Illinois Attorney General action against a prediction market
  platform was found.
