  - action_type: cease_and_desist
    date: "2025-04-01"
    issuing_body: Illinois Gaming Board
    target: KalshiEX LLC d/b/a Kalshi
    summary: The Board stated that Kalshi's sports event contracts constitute unlicensed sports wagering in violation of the Illinois Sports Wagering Act (230 ILCS 45) and the Criminal Code (720 ILCS 5/28-1(a)) and directed Kalshi and its affiliates to cease and desist, noting that failure to comply may subject it to civil or criminal penalties.
    document_url: https://igb.illinois.gov/content/dam/soi/en/web/igb/documents/sports/cease-and-desist-letters/20250401-cease-desist-letter-kalshi.pdf
