name: Illinois
profile_completeness: status_only
summary: >-
  Illinois authorized sports wagering in the Sports Wagering Act (230 ILCS 45), enacted in June 2019. Legal
  wagering began in March 2020 at Rivers Casino Des Plaines and online wagering followed in June 2020. The Illinois
  Gaming Board licenses and regulates operators. The privilege tax moved from a flat rate to graduated tiers on
  July 1, 2024 and a per-wager fee was added on July 1, 2025.
