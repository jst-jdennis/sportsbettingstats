limitations:
  - Illinois reports adjusted gross receipts, which excludes winnings but not promotional credits, so its revenue line sits between New Jersey's gross revenue and the adjusted bases used by states that deduct promotions.
  - The per-wager fee introduced in July 2025 led several operators to add customer surcharges or minimum bet sizes, which changes the composition of handle after that date.
