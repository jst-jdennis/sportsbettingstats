limitations:
  - New York's mobile tax base is gross gaming revenue with no promotional deduction, which makes its tax receipts higher relative to handle than states that tax adjusted revenue; do not compare effective rates without adjusting for the base.
  - Before January 2022 a large share of New York residents' online wagering occurred in New Jersey, so New Jersey's pre-2022 series and New York's post-2022 series are not independent.
  - Minimum age (21), the retail tax rate, self-exclusion, deposit limit, advertising, credit card and helpline rules were not confirmed from Commission or statute pages by search on 2026-10-16 and are left unentered.
