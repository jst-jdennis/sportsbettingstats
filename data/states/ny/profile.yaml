summary: >-
  New York authorized sports wagering at its four upstate commercial casinos in the 2013 Upstate New York Gaming
  Economic Development Act, and retail sportsbooks opened in July 2019 after the federal prohibition fell.
  Mobile wagering was added by the state fiscal year 2022 budget in April 2021 and launched on January 8,
  2022 through platform providers selected by the Gaming Commission, which pay the state 51 percent of mobile
  gross gaming revenue. The New York State Gaming Commission regulates both channels and publishes weekly and
  monthly figures.
