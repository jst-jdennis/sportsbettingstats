    page_or_table: PML 1367, subdivision 8
    notes: 'Operative language as excerpted: "the commission shall pay into the commercial gaming fund one percent of the
      state tax imposed on mobile sports wagering by this section to be distributed for problem gambling education and treatment
      purposes", with the proviso that the amount "shall be equal to six million dollars for each fiscal year" after the first,
      which is why the mechanism is recorded as fixed rather than a percentage; a reviewer should confirm the proviso wording
      on the Senate page. The Gaming Commission and OASAS report on the impact of mobile sports wagering on problem gamblers
      (March 31, 2025, updated December 17, 2025, https://gaming.ny.gov/system/files/documents/2025/12/12.17.25.mswimpactreport.pdf)
      states "Currently, $6 million annually from New York State''s tax imposed on mobile sports wagering is dedicated for
      problem gambling education and treatment purposes" citing section 1367(8), and that commercial casino operators pay
      "an annual fee of $500 per slot machine and table" for OASAS treatment and education. The fiscal year is New York state
      fiscal year 2025-26 (April 2025 to March 2026). Pending bills S2615 and A7629 (2025) would change the floor; neither
      was confirmed enacted. Outbound web fetches were blocked from the drafting container, so quotes come from search-engine
      excerpts of the cited pages. Archived copy checked on 2026-10-17: The Gaming Commission''s December 2025 mobile sports
      wagering impact report as archived states that 6 million dollars annually from the tax on mobile sports wagering is
      dedicated for gambling harms education and treatment pursuant to Racing, Pari-Mutuel Wagering and Breeding Law 1367(8),
      with an additional 6 million dollars annually beginning in 2026; the State Comptroller''s September 2026 report as archived
      confirms the increase from 6 million to 12 million dollars.'
- fiscal_year: 2027
  amount_usd: 12000000
  amount_type: appropriation
  funding_mechanism: statutory_earmark_fixed
  mechanism_text: For state fiscal year 2026-27 the enacted budget doubled the portion of the mobile sports wagering tax dedicated
    to problem gambling services from six million to twelve million dollars, according to the Office of the State Comptroller's
    September 2026 report on sports wagering. The statutory vehicle, which should be an amendment to Racing, Pari-Mutuel Wagering
    and Breeding Law section 1367(8) or budget bill language, was not read. The money continues to flow through the commercial
    gaming fund to the Office of Addiction Services and Supports.
  administering_agency: New York State Office of Addiction Services and Supports
  includes:
