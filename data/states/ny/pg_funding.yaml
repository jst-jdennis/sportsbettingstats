  funding_mechanism: statutory_earmark_fixed
  mechanism_text: Racing, Pari-Mutuel Wagering and Breeding Law section 1367, subdivision 8, directs the Gaming Commission
    to pay into the commercial gaming fund one percent of the state tax on mobile sports wagering for problem gambling education
    and treatment, provided that the amount equals six million dollars in each fiscal year after the first, so the earmark
    operated as a fixed 6,000,000 dollars a year through state fiscal year 2025-26 while the remaining mobile tax went to
    the lottery fund for education aid. The money is distributed through the Office of Addiction Services and Supports. Commercial
    casinos separately pay an annual fee of 500 dollars per slot machine and table game for OASAS problem gambling treatment
    and education.
  administering_agency: New York State Office of Addiction Services and Supports
