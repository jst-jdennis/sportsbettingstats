  mechanism_text: RSA 287-I:9 directs that money the Lottery Commission receives from sports wagering, after deducting the
    Commission's administrative costs, prizes and payments for problem gambling services, be deposited in the education trust
    fund under RSA 198:39, so problem gambling payments come out of sports wagering revenue before education receives anything.
    The statute sets no percentage or dollar amount; the share is fixed by the Commission and its agent contracts rather than
    by the legislature. Separately, the 2025 budget trailer bill (HB 2, chapter 141) added a requirement that each video lottery
    terminal licensee pay 0.25 percent of gross video lottery revenue to the fund of the Governor's Commission on Alcohol
    and Other Drugs, which is continually appropriated for alcohol and problem gambling prevention and treatment programs.
    The statute names problem gambling payments as a deduction before education receives the proceeds but fixes no share or
    amount; the Lottery Commission sets the payment, so under the classification rule this is discretionary funding recorded
    as appropriation.
  administering_agency: New Hampshire Lottery Commission (payments for problem gambling services); Governor's Commission on
    Alcohol and Other Drugs (video lottery share)
