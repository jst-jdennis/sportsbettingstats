    notes: 'Operative language as excerpted from the chapter page: sports wagering proceeds, "after deducting the commission''s
      administrative costs, prizes, and payments for problem gambling services", go to the education trust fund established
      in RSA 198:39. RSA 287-I:8 requires each agent to submit a responsible gaming plan; RSA 287-I:3 makes "commitment to
      prevention of problem gambling" a selection factor. The introduced version of 2019 HB 480 would have set aside ten percent
      of revenue sharing proceeds for treatment and prevention, but that figure does not appear in the enacted chapter, so
      no percentage is recorded and the classification rests on an open-ended statutory deduction from gambling revenue; a
      reviewer may prefer appropriation if the Commission''s payments are set only in the budget. The 2025 HB 2 chaptered
      text (https://gc.nh.gov/lba/budget/operating_budgets/2026-2027/House_Finance/HB%202%20-%20Chaptered%20Final%20Version%20-%207-1-25.pdf)
      was excerpted as requiring that "each VLT licensee shall distribute 0.25 percent of gross video lottery revenue collected
      to the governor''s commission on addiction, treatment, and prevention" and describing that fund as "continually appropriated
      for the purposes of funding alcohol education and abuse and problem gambling prevention and treatment programs"; the
      RSA section number for that provision and whether video lottery terminals were operating in FY 2025 were not confirmed.
      The Lottery''s FY 2026 second quarter newsletter lists HB 1559 (2026), which would increase the percentage of gaming
      revenue allocated to problem gaming services; its status was not confirmed. No annual dollar figure was found: the Lottery
      Commission''s FY 2025 release reports 39 million dollars to education from sports betting but no problem gambling line;
      the amount should come from the Lottery Commission''s annual report or the Governor''s Commission fund report. Outbound
      web fetches were blocked from the drafting container, so quotes come from search-engine excerpts of the cited pages.
      Archived copy checked on 2026-10-17: RSA 287-I:9 as archived: the proceeds received by the commission from sports wagering,
      less the administrative costs of the commission, prizes paid, and payments for problem gambling services, shall be deposited
      in the education trust fund. The statute fixes no share or amount, so the mechanism is recorded as an appropriation-type
      payment set by the Lottery Commission.'
