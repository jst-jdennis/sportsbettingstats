name: New Hampshire
profile_completeness: status_only
summary: >-
  New Hampshire authorized sports wagering in 2019 through House Bill 480, codified at RSA 287-I, which places
  mobile, retail and lottery-directed sports wagering under the New Hampshire Lottery Commission. The Commission
  contracts with agents selected by competitive bid and approved by the Governor and Executive Council; the
  agents pay the state a percentage of in-state sports wagering revenue, and DraftKings has been the sole mobile
  agent since the December 2019 launch. Net proceeds go to the education trust fund.
