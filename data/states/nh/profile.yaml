    promo_deduction_rule: >-
      New Hampshire has no operator tax. RSA 287-I requires each agent contract to give the state a percentage of
      in-state sports wagering revenue. Press and the Lottery's presentations report the DraftKings share as 51
      percent of mobile revenue and 50 percent of retail revenue; the contract figures and the revenue
