limitations:
  - New Hampshire's state receipts are a contractual revenue share collected through a single mobile agent, so they are not comparable to tax receipts in states with multiple licensed operators.
  - The Lottery reports sports wagering revenue on a state fiscal year basis; monthly figures are published but have been restated.
  - Self-exclusion, deposit limit, advertising, credit card and helpline rules exist in Lot 3000 but were not read on review and are left unentered.
