    notes: Searches on 2026-10-17 for an Alabama Department of Mental Health problem gambling program, a General Fund appropriation
      for problem gambling, a contract with the Alabama Council on Compulsive Gambling, and any Code of Alabama provision
      on compulsive gambling returned only third-party directories stating that Alabama has no state-appropriated gambling
      treatment program and a 2021 fiscal note on SB 318 (https://alison.legislature.state.al.us/files/pdf/SearchableInstruments/2021RS/FiscalNotes/FN-42410.htm)
      describing a proposed 500,000 dollar set-aside that was not enacted. State agency and legislature pages could not be
