  mechanism_text: Alabama has no lottery, commercial casino or sports wagering statute and therefore no statutory earmark
    of gambling revenue. No primary document was found establishing a state appropriation for problem gambling services or
    a formal statement that none exists; the Alabama Council on Compulsive Gambling, a nonprofit, provides the helpline and
    referrals. Proposed gaming amendments (SB 318 of 2021, the 2024 package, SB 257 of 2026) would have created funding for
    compulsive gambling programs and did not pass.
