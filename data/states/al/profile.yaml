summary: >-
  Alabama has not authorized sports wagering in any form, and the 2022 Constitution's prohibition on lotteries
  remains in place. The most recent proposal, Senate Bill 257 of the 2026 Regular Session, would have asked voters
  to approve a lottery, casino gaming and retail and online sports wagering; it was introduced on February 3, 2026,
  referred to the Senate Tourism committee and recorded no further action.
