limitations:
  - Alabama is a comparison state with no regulated sports wagering. Residents may use offshore sites, sweepstakes products and, depending on platform geofencing, federally regulated prediction markets; none of that activity appears in any state revenue series.
  - Problem gambling indicators for Alabama reflect all gambling, including Poarch Band of Creek Indians Class II facilities and electronic bingo disputes, and cannot be read as sports wagering effects.
