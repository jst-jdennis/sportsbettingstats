    mechanism_text: >-
      Two percent of the state's sports wagering revenue share is credited to the Problem Gambling and Addictions
      Grant Fund, which also receives two percent of state-owned casino revenue under the Kansas Expanded Lottery
      Act. The fund is administered by the Kansas Department for Aging and Disability Services. The dollar amount
      for the fiscal year has not yet been entered from the fund report.
