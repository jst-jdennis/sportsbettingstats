summary: >-
  Kansas authorized sports wagering in May 2022 through Senate Bill 84. Retail and online wagering both launched
  on September 1, 2022. The Kansas Lottery is the statutory operator and contracts with the four state-owned
  casinos' managers, each of which may partner with up to three online platforms. The Kansas Racing and Gaming
  Commission regulates and runs the voluntary exclusion program.
