limitations:
  - Kansas reports revenue after payouts and permitted free play deductions, which differs from New Jersey's gross revenue definition. Do not compare the two states' revenue lines directly.
  - A material share of Kansas handle in the first year came from Missouri residents before Missouri launched in December 2025.
