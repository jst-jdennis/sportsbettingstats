  mechanism_text: No Montana statute was found that dedicates lottery, sports wagering, video gambling machine tax or other
    gambling revenue to problem gambling services, and no appropriation for such services was found in the documents searched.
    The Department of Justice Gambling Control Division's problem gambling page refers callers to the Montana Council on Problem
    Gambling, a nonprofit that the Division describes as providing support, referrals and education and that contracts with
    private providers for outpatient treatment. Press accounts describe the Council as funded by gaming industry donations
    rather than state money, but no state agency or legislative document confirming the absence of public funding was located.
