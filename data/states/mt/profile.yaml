summary: >-
  Montana authorized sports wagering in 2019 through House Bill 725, which amended the Montana State Lottery Act
  so that the Montana Lottery is the sole operator. The product, Sports Bet Montana, is offered through
  terminals and a mobile application at licensed lottery sports wagering locations; wagers placed through the
  application must be made on the premises of a licensed location. The Lottery launched the product in March
  2020.
