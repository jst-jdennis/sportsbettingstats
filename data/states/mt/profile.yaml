limitations:
  - Montana structures sports wagering as a lottery product. There is no operator tax; the state's take is the Lottery's net revenue after prizes, retailer commissions and costs, and it is reported in the Lottery's annual report rather than as a tax series.
  - Montana handle is small and concentrated in on-premises play, so per capita comparisons with statewide mobile states measure different products.
  - Minimum age (18 for lottery products), tax treatment and consumer protection rules were not confirmed from the statute or the Lottery's rules by search on 2026-10-16 and are left unentered.
