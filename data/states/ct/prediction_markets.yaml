state_actions:
  - action_type: cease_and_desist
    date: "2025-12-03"
    issuing_body: Connecticut Department of Consumer Protection, Gaming Division
    target: KalshiEX LLC, Robinhood Derivatives, LLC and Crypto.com
    summary: The Gaming Division ordered the three platforms to stop advertising, offering, promoting or otherwise making available sports event contracts or any other unlicensed online gambling to Connecticut residents and to allow Connecticut users to withdraw funds, stating that only licensed entities may offer sports wagering in the state and citing the absence of integrity controls.
    document_url: https://portal.ct.gov/dcp/news-releases-from-the-department-of-consumer-protection/2025-news-releases/connecticut-consumer-protection-orders-cease-and-desist-conducting-unlicensed-online-gambling
    provenance:
      <<: *ctdcp
      notes: Release dated 2025-12-03; press reports give 2025-12-02 as the date on the letters themselves. Archive the letters at review.
  - action_type: lawsuit_filed
    date: "2026-08-26"
    issuing_body: Connecticut Attorney General, with the Commissioner of Consumer Protection
    target: KalshiEX LLC
    summary: The state sued Kalshi in Hartford Superior Court seeking an injunction barring it from advertising or offering sports event contracts (game winners, season win totals, point spreads, scoring outcomes and player statistics) to Connecticut residents as unlicensed sports wagering.
    document_url: https://portal.ct.gov/ag/press-releases/2026-press-releases/connecticut-sues-kalshi-to-stop-illegal-unlicensed-sports-betting
