tax:
  - channel: all
    basis: gross_gaming_revenue
    rate: 0.1375
    tiers: null
    per_wager_fee_cents: null
    promo_deduction_rule: >-
      Gross gaming revenue excludes the face value of promotional coupons and credits up to a threshold share of
      monthly gross gaming revenue (25 percent in the first year of sports wagering, 20 percent in the second and
      15 percent in the third and later years); 25 percent of the excess above the threshold is added back into
      gross gaming revenue. Wagers placed on the Mashantucket Pequot and Mohegan reservations are excluded from the
      state payment.
    effective_from: "2021-09-30"
    effective_to: null
    destination:
      - fund_name: General Fund
        share: null
    authority_citation: Public Act 21-23 (payment to the state of 13.75 percent of gross gaming revenue from retail and online sports wagering, with the definition of gross gaming revenue in section 1), codified in Conn. Gen. Stat. 12-850 et seq.; section numbers to be confirmed
    provenance:
      <<: *ctleg
      notes: Rate confirmed by search on 2026-10-16 against the Governor's December 2021 collections release and the act summary; the promotional credit thresholds are taken from the 2021 bill text as filed (https://www.cga.ct.gov/2021/FC/PDF/2021HB-06451-R000384-FC.PDF) and must be checked against the codified section.
