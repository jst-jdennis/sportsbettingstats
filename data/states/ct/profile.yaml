  deposit_limits:
    player_set_available: true
    mandatory_default: false
    player_set_required_at_signup: false
    cooling_off_on_increase_hours: null
    statutory_cap_usd: null
    authority_citation: Regs. Conn. State Agencies 12-865-13 (electronic wagering platform requirements; responsible gaming limits), subsection letter to be confirmed; 12-865-30 (consumer disclosure of the right to set responsible gaming limits)
    notes: >-
      The platform must allow a patron to establish responsible gaming limits, and the options must include a deposit
      limit offered on a daily, weekly and monthly basis, a spend limit on the same bases and a daily time-based
      limit; patrons must have an easy and obvious method to impose deposit caps, wager maximums and time limits. A
      change making a limit more restrictive is effective no later than the patron's next log in; a change making it
      less restrictive takes effect only after the previously set period expires and the patron reaffirms the change,
      so no fixed number of hours is stated. Patron limits do not override more restrictive operator limits. When a
      patron's lifetime deposits exceed 2,500 dollars the platform must stop wagering until the patron acknowledges
      the right to set limits or close the account, repeated every six months; that is an acknowledgment, not a
      default limit. No rule read requires a limit at signup. Quoted from a search excerpt of the cited page; the
      page itself could not be opened from the drafting environment.
    provenance:
      <<: *ctdcp
      source_url: https://eregulations.ct.gov/eRegsPortal/Search/getDocument?guid=%7B3037BC7E-0100-CBF0-A99D-BCC1148E33B6%7D
      archive_url: sha256:5e06673c1585ac1e66363090b7643692a1db6dfa60ff87cc3e68fb12061b72bb
      retrieved_at: "2026-10-17"
      retrieval_method: manual_entry
      entered_by: claude-draft-2026-10-17
      page_or_table: Sec. 12-865-13
      notes: >-
        Archived copy checked on 2026-10-17: subsection (p) requires the platform to let a patron establish responsible gaming limits, with a less restrictive change effective only after the prior limit expires and the patron reaffirms it.
        Quoted from a search excerpt of the cited page (eRegulations, Regulations of Connecticut State Agencies,
        revised February 2022); the page itself could not be opened from the drafting environment. Excerpt: "An
        electronic wagering platform shall allow a patron to establish responsible gaming limits. Any change making
        the limits more restrictive shall be effective no later than the patron's next log in. Any change making the
        limits less restrictive shall become effective only after the time limit previously established by the patron
        has expired and the patron reaffirms the requested change"; "Responsible gaming limit options offered to
        patrons shall include, but are not limited to, the following: (1) A deposit limit shall be offered on a
        daily, weekly, and monthly basis"; "When a patron's lifetime deposits exceed $2,500, the electronic wagering
        platform shall prevent any wagering until the patron acknowledges the following". The full compilation
        12-865-1 to 12-865-34 is at
        https://eregulations.ct.gov/eRegsPortal/Browse/getDocument?guid=%7B4036BC7E-0000-CB24-A8AB-4BF5F355C236%7D.
