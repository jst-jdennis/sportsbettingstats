limitations:
  - Connecticut's monthly reports show gross gaming revenue and a separate figure after promotional deductions; the payment to the state is computed on the latter, and wagers placed on the two reservations are excluded, so published revenue is not a complete measure of in-state wagering.
  - With three master licensees and three online skins, Connecticut operator-level figures are not comparable with open-licensing states.
  - Deposit limit, credit card and helpline advertising rules exist in Regs. Conn. State Agencies 12-865 but were not confirmed by search on 2026-10-16 and are left unentered.
