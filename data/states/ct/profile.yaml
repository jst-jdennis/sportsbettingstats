name: Connecticut
profile_completeness: full
summary: >-
  Connecticut authorized retail and online sports wagering, online casino gaming and related products through
  Public Act 21-23, signed on May 27, 2021, together with amended compacts with the Mashantucket Pequot and Mohegan
  tribes. Retail wagering began at the tribal casinos at the end of September 2021 and statewide online wagering
  opened at 6:00 a.m. on October 19, 2021 after a week-long soft launch. The two tribes and the Connecticut Lottery
  Corporation hold the master wagering licenses, and the Department of Consumer Protection's Gaming Division
  regulates and publishes monthly figures.
