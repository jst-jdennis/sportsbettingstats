  credit_card_deposits:
    allowed: true
    authority_citation: Regs. Conn. State Agencies 12-865-11 (internet gaming account management; permitted funding methods include one credit card held in the name of the patron)
    notes: >-
      The funding methods list permits it. A patron's internet gaming account may be funded by bank transfer or by one
      credit card held in the patron's name, which may not be processed through a payment gateway or aggregator, and a
      patron may link only one credit card or one debit card to the account at any time. Before a withdrawal, any
      balance up to the deposited amount is returned to the funding card (language seen in the 2021 emergency version;
      confirm in the current text). A 2025 bill (HB 5269) touching credit card funding appeared in results; its
      enactment was not checked and is not reflected here. Quoted from a search excerpt of the cited page; the page
      itself could not be opened from the drafting environment.
    provenance:
      <<: *ctdcp
      source_url: https://eregulations.ct.gov/eRegsPortal/Search/getDocument?guid=%7B3037BC7E-0100-C253-B9BB-1EDAA6A60765%7D
      archive_url: sha256:b65bb2e192b5ad40ca40b2243853eb15510f788041fd51d9492eced243ced271
      retrieved_at: "2026-10-17"
      retrieval_method: manual_entry
      entered_by: claude-draft-2026-10-17
      page_or_table: Sec. 12-865-11
      notes: >-
        Archived copy checked on 2026-10-17: a patron may link one credit card or one debit card held in the patron's own name to fund the account.
        Quoted from a search excerpt of the cited page; the page itself could not be opened from the drafting
