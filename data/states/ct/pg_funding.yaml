  mechanism_text: The Connecticut Lottery Corporation must transfer 2,300,000 dollars of lottery ticket revenue each fiscal
    year to the chronic gamblers treatment and rehabilitation account created by C.G.S. 17a-713, plus an additional 1,000,000
    dollars from its retail and online sports wagering and fantasy contest revenue in any year it holds those licenses, under
    C.G.S. 12-818 as amended by Public Act 21-23. The Mashantucket Pequot and Mohegan tribes, as master wagering licensees,
    make a further annual contribution to problem gambling programs under C.G.S. 12-871, reported at 500,000 dollars each.
    The account is administered by the Department of Mental Health and Addiction Services for prevention, treatment and rehabilitation
    of chronic gamblers, and the amounts are fixed sums rather than a percentage of revenue.
