  mechanism_text: Two percent of the tribal gaming contributions deposited in the Arizona Benefits Fund under the tribal-state
    gaming compacts is reserved for the Department of Gaming to fund state and local programs for the prevention and treatment
    of, and education concerning, problem gambling. The Department's Division of Problem Gambling administers the money and
    the helpline, and the State Lottery Fund adds a fixed 300,000 dollars a year under A.R.S. 5-572. The event wagering statute
    (A.R.S. Title 5, Chapter 10) sends privilege fees to the event wagering fund and the state general fund and does not itself
    dedicate any share to problem gambling; bills to add such a share (SB 1727 of 2024, SB 1717 of 2025, SB 1765 of 2026)
    were introduced and their enactment was not confirmed.
  administering_agency: Arizona Department of Gaming, Division of Problem Gambling
