limitations:
  - Arizona reports adjusted gross event wagering receipts after free bet deductions that were capped on a declining schedule and that differ by operator launch year, so the taxable base is not comparable across years or with gross revenue states such as New Jersey.
  - Wagers placed on tribal land under the compacts are reported through the Department's event wagering series but tribal casino gaming revenue is not; sports wagering cannot be isolated from the tribal contribution series.
  - Deposit limit, advertising and payment method rules exist in A.A.C. Title 19, Chapter 4 (for example R19-4-128, forms of payment) but were not confirmed by search on 2026-10-16 and are left unentered.
