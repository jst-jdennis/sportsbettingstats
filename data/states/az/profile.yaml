tax:
  - channel: retail
    basis: adjusted_gross_revenue
    rate: 0.08
    tiers: null
    per_wager_fee_cents: null
    promo_deduction_rule: >-
      Adjusted gross event wagering receipts are gross receipts (excluding voided wagers) less winnings paid and
      federal excise tax, less free bets and promotional credits subject to a declining cap set in A.R.S. 5-1301:
      up to 20 percent of gross receipts in the operator's first two years, 15 percent in year three, 10 percent in
      years four and five and no deduction from year six, counted from the January 1 after the operator began
      operations. For operators that launched in September 2021 the deduction fell to zero on 2027-01-01 under this
      schedule; the year count should be confirmed against the Department's reporting instructions.
    effective_from: "2021-09-09"
    effective_to: null
    destination:
      - fund_name: Event Wagering Fund (90 percent of monthly deposits transferred to the State General Fund; up to 10 percent retained for regulation)
        share: null
    authority_citation: A.R.S. 5-1318 (privilege fee not to exceed 10 percent of adjusted gross event wagering receipts; event wagering fund) and A.A.C. R19-4-112 (8 percent retail, 10 percent mobile); definition in A.R.S. 5-1301
    provenance:
      <<: *azleg
      source_url: https://www.azleg.gov/ars/5/01318.htm
      notes: Statutory cap and fund distribution confirmed on the statute page. The 8 and 10 percent rates are set by rule (A.A.C. R19-4-112) and restated in the Department's monthly reporting instructions and a 2022 House appropriations summary; the rule text itself was not opened from this container.
