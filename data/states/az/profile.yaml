summary: >-
  Arizona authorized event wagering through House Bill 2772, signed on April 15, 2021 together with amended
  tribal-state gaming compacts. Retail and mobile wagering launched on September 9, 2021. Licenses are split
  between tribes and professional sports franchises or venues, and the Arizona Department of Gaming regulates
  and collects a privilege fee of 8 percent (retail) and 10 percent (mobile) of adjusted gross event wagering
  receipts.
