  mechanism_text: Hawaii has no lottery, casinos or regulated sports wagering and no gambling revenue to dedicate. No statute
    or appropriation line dedicated to problem gambling services was found in the Hawaii Revised Statutes, the Department
    of Health Alcohol and Drug Abuse Division reports to the Legislature, or the 2025 session bills. Bills in 2022 (HB 1962)
    and 2025 (HB 1308) that would have created a gambling addiction special fund were not confirmed as enacted.
