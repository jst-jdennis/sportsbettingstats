    notes: 'Searched capitol.hawaii.gov, data.capitol.hawaii.gov, health.hawaii.gov and budget.hawaii.gov for problem gambling,
      gambling addiction and gambling treatment funding. The only on-point statement found was a legislative finding in HB
      1962 (2022), an unenacted bill, that no public funding was provided for gambling treatment and prevention; the Department
      of the Attorney General''s 2025 testimony on HB 1308 SD1 describes a proposed problem gambling special fund funded by
      sports wagering license fees and taxes, which was not confirmed as enacted. The Alcohol and Drug Abuse Division''s FY2024-25
      appropriation (Act 230, SLH 2024, $34,159,042) covers substance use services and the division''s reports do not list
      a gambling program. A bill finding is not an agency or legislative report, so the mechanism is recorded as unknown rather
      than none. All hosts were blocked by this session''s network policy, so no document was opened directly; the reviewer
      should check the Department of Health budget and the current HB 1308 status. Archived copy checked on 2026-10-17: HB
      1962 (2022) as archived carries the legislative finding that no public funding was provided for gambling treatment and
      prevention; the bill was not enacted, so the mechanism stays unknown.'
