summary: >-
  Hawaii has not authorized sports wagering or any other commercial gambling. House Bill 1308 (2025) passed both
  chambers in differing forms and died in conference committee, and House Bill 2570 (2026) advanced through House
  committees; no measure had become law as of October 2026. Hawaii has no lottery, casinos or racing, and no state
  body regulates wagering.
