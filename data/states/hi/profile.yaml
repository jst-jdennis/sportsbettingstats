limitations:
  - Hawaii is a comparison state with no legal gambling of any kind. Residents can and do use offshore sites, sweepstakes products and, depending on platform geofencing, federally regulated prediction markets; none of that activity appears in any state series.
  - With no lottery or casino baseline, Hawaii problem gambling indicators are not comparable to those of states with established regulated markets.
