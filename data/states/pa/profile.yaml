    authority_citation: 58 Pa. Code 814a.2 (responsible gaming self-limits), applied to interactive and mobile sports wagering accounts by 58 Pa. Code 1408a.14; see also 58 Pa. Code 812a.9 (player account controls)
    notes: >-
      A deposit limit must be offered on a daily, weekly and monthly basis and must specify the maximum amount a
      registered player may deposit during the period; a limit on the amount of money spent on a daily, weekly and
      monthly basis must also be offered. Any decrease may not be effective later than the player's next login; any
      increase becomes effective only after the time period of the previous limit has expired and the player
      reaffirms the requested increase, so the cooling-off period is the remainder of the limit period rather than a
      fixed number of hours. Where system-imposed limitation values are greater than self-imposed values, the
      system-imposed limitations take priority. 1408a.14 makes the Subpart L player account requirements apply to
      sports wagering accounts used for interactive or mobile sports wagering. The excerpts show no default limit and
      no requirement to set a limit at registration. Quoted from a search excerpt of the cited page; the page itself
      could not be opened from the drafting environment.
    provenance:
      source_id: pa-legislature
      source_url: https://www.pacodeandbulletin.gov/Display/pacode?file=/secure/pacode/data/058/chapter814a/s814a.2.html&d=reduce
      archive_url: sha256:b51b1f897495a188d5c7b90c5838211c8e93c0c65ccaca94e0802d8059180d52
      retrieved_at: "2026-10-17"
      retrieval_method: manual_entry
      transform: null
      entered_by: claude-draft-2026-10-17
      reviewed_by: null
      status: pending_review
      page_or_table: 58 Pa. Code 814a.2; 1408a.14
      notes: >-
        Archived copy checked on 2026-10-17: 58 Pa. Code 814a.2 requires the system to let a registered player establish responsible gaming limits, and 1408a.14 applies the account rules to sports wagering accounts, including the right to suspend an account for at least 72 hours.
        Pennsylvania Code as published on pacodeandbulletin.gov (Legislative Reference Bureau). Operative language in
        the excerpt: a deposit limit must be offered on a daily, weekly and monthly basis and must specify the maximum
        amount of money a registered player may deposit into his interactive gaming account during a particular
        period of time; any decrease to these limits may not be effective later than the registered player's next
        login; any increase to these limits must become effective only after the time period of the previous limit
        has expired and the registered player reaffirms the requested increase. The cross-reference comes from the
        excerpt of 58 Pa. Code 1408a.14 (chapter page
        https://www.pacodeandbulletin.gov/Display/pacode?file=/secure/pacode/data/058/chapter1408a/chap1408atoc.html&d=reduce):
        a sports wagering certificate holder's or sports wagering operator's sports wagering system shall comply with
        the player account requirements in Subpart L as it pertains to sports wagering accounts used by a patron to
        participate in interactive or mobile sports wagering. Quoted from search excerpts of the cited pages; the
        pages themselves could not be opened from the drafting environment.
