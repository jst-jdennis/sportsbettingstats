  self_exclusion:
    program_type: statewide_registry
    administered_by: Pennsylvania Gaming Control Board, Office of Compulsive and Problem Gambling
    durations: [1 year, 5 years, lifetime]
    covers: [casinos, retail_sports_wagering, online_sports_wagering, igaming, vgts, fantasy_contests]
    enrollment_methods: [online, in_person]
    url: https://responsibleplay.pa.gov/self-exclusion/
    notes: Two separate lists. The casino list (established 2006) covers casinos and retail sports wagering locations and
      a one or five year ban remains until the person requests removal. The interactive list (launched 2019-05-28)
      covers online sports wagering and iGaming and expires at the end of the chosen term. Sportsbook operators must
      honor both lists under 58 Pa. Code 1411a.1.
    provenance:
