summary: >-
  Pennsylvania authorized sports wagering in Act 42 of 2017, which added Chapter 13C to Title 4 of the Pennsylvania
  Consolidated Statutes. Retail wagering began in November 2018 and online wagering in May 2019, both regulated by
  the Pennsylvania Gaming Control Board. The state assesses 34 percent of daily gross sports wagering revenue for the
  General Fund plus a 2 percent local share assessment, and the Board runs separate self-exclusion lists for casinos
  and for online play.
