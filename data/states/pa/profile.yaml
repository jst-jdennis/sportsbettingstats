    authority_citation: 58 Pa. Code 812a.7 (funding of interactive gaming accounts; a player's credit card or debit card, including prepaid cards, is a listed funding method), applied to interactive and mobile sports wagering accounts by 58 Pa. Code 1408a.14
    notes: >-
      Permitted by the funding methods list: 812a.7 lists a player's credit card or debit card, including prepaid
      cards, alongside cash, checks, reloadable prepaid cards and other methods. The same section bars an operator
      from extending credit to a player or allowing deposits derived from the extension of credit by affiliates or
      agents. 58 Pa. Code 1408a.5 requires sports wagering operators to display the methods of funding a sports
      wager. No prohibition on credit card funding was found in the Subpart O or Subpart L excerpts; a 2024 Senate
      bill (SB 1159) proposing a ban was reported but not confirmed enacted. Quoted from a search excerpt of the
