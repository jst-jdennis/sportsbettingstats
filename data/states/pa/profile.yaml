limitations:
- Pennsylvania reports revenue, promotional credits and taxable revenue as separate lines. Use taxable gross revenue
  when comparing with states that tax after promotional deductions and total revenue when comparing with states
  that do not.
- Retail and online figures are published by certificate holder, and several holders report both channels, so
  channel totals must be built from the Board's monthly report rather than from headline figures.
