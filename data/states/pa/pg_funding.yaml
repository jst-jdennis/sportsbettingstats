    notes: 'The statute page could not be opened from the drafting container (outbound fetches were blocked), so the operative
      language is taken from state documents that quote it: the Department of Drug and Alcohol Programs'' gambling strategic
      plan and annual reports state that under Act 1 of 2010 the transfer is "$2,000,000 or an amount equal to .002 multiplied
      by the total gross terminal revenue of all active and operating licensed gaming entities, whichever is greater", and
      the Office of the Budget''s expenditure notices state that Act 71 of 2004 created the fund and that section 1509 limits
      its use to education, prevention, treatment and administration. The sports wagering transfer ("0.2 percent of gross
      sports wagering revenue be transferred each year to the Compulsive and Problem Gambling Treatment Fund") is quoted from
      the House Appropriations Committee''s 2018 Act 42 fact sheet, not from the section itself; confirm the section number
      (reported as 4 Pa.C.S. 13C62) and the interactive gaming and video gaming terminal counterparts. The amount will come
      from the Department of Drug and Alcohol Programs'' Compulsive and Problem Gambling Annual Report for SFY 2024-25 (published
      October 2025 at prdddap.pwpca.pa.gov); a secondary summary of the 2022-23 report put that year''s transfer at about
      8,300,000 dollars, which has not been entered. Archiving on 2026-10-17 did not yield the section text: the Pennsylvania
      consolidated statutes page archived is a shell without the section text; the clause remains as taken from the search
      excerpt until a reviewer opens the page.'
