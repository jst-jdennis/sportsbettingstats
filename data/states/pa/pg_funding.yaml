  mechanism_text: Under 4 Pa.C.S. 1509 the State Gaming Fund transfers each year to the Compulsive and Problem Gambling Treatment
    Fund the greater of 2,000,000 dollars or 0.002 times the gross terminal revenue of all licensed slot machine facilities,
    a formula set by Act 1 of 2010. Act 42 of 2017 added parallel annual transfers of 0.2 percent of gross sports wagering
    revenue and of gross interactive gaming revenue to the same fund, plus a further 0.2 percent of each to the Department
    of Drug and Alcohol Programs for drug, alcohol and gambling treatment. The fund is administered by the Department of Drug
    and Alcohol Programs, which took the program over from the Department of Health, and the statute limits spending to education,
    prevention, treatment and program administration.
