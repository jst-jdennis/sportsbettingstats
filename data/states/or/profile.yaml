  credit_card_deposits:
    allowed: true
    authority_citation: OAR 177-046-0027 (player account funding; no funding method is prohibited) and the Oregon Lottery's Scoreboard (DraftKings) funding page, which lists debit and credit cards
    notes: >-
      No Oregon statute or Lottery rule located by search prohibits funding a sports betting player account with a
      credit card. OAR 177-046-0027 provides that the Lottery does not hold or manage money on behalf of players, that
      the entity holding the player account does not charge for deposits or withdrawals, that payment processor fees
      are the player's responsibility and that a charged-back deposit is removed and related winnings forfeited; a
      DraftKings Sportsbook account is a player account under the rule. The Lottery, which is itself the operator,
      states on its Scoreboard funding and FAQ pages that accounts may be funded from bank accounts and debit and
      credit cards, that a Play+ account may be funded by debit and credit card, PayPal or personal bank account, and
      that card funding is deposit only. Recorded as allowed because the operator's published funding methods permit
      it and nothing prohibits it. Quoted from search excerpts of the cited pages; the pages themselves could not be
      opened from the drafting environment.
    provenance:
      <<: *orrg
      source_url: https://sports.oregonlottery.org/how-to-fund/
      retrieved_at: "2026-10-17"
      retrieval_method: manual_entry
      entered_by: claude-draft-2026-10-17
      page_or_table: OAR 177-046-0027; Scoreboard funding page
      notes: >-
        Archiving on 2026-10-17 did not yield the section text: the archived OAR 177-046-0027 says the Lottery does not hold player money and lists no funding methods, and the Lottery's sports site could not be fetched, so the permitted-methods claim rests on the search excerpt; the clause rests on the search excerpt.
        Funding page excerpt: debit and credit card, PayPal and personal bank account listed as Play+ funding options,
        with a warning that some card issuers decline gambling transactions; FAQ (https://sports.oregonlottery.org/most-asked-questions/)
        excerpt: accounts may be funded from "bank accounts, debit and credit cards". Rule excerpt (OAR 177-046-0027,
        https://secure.sos.state.or.us/oard/viewSingleRule.action?ruleVrsnRsn=288692): "The entity holding the player
        account does not charge for deposits or withdrawals in or out of the player account. Neither the Lottery, nor
        the entity holding the player account, are responsible for any fees that may be charged to the player by a
        payment processor, or financial institution." Quoted from search excerpts of the cited pages; the pages
        themselves could not be opened from the drafting environment.
