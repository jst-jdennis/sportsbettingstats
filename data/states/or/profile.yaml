    - rule_type: other
      text: >-
        Broadcast and print advertisements for lottery games must state that the games are based on chance and should
        be played for entertainment only and not for investment purposes; a billboard promoting a lottery game must
        state that lottery games should not be played for investment purposes, and a billboard publicizing a project
        or program funded by Lottery revenue must carry an entertainment-only statement.
      authority_citation: ORS 461.220(8) and (9) (billboards) and ORS 461.220 generally
      provenance:
        <<: *oradv
        notes: >-
          Excerpt summary: broadcast and print ads must say the games are based on chance and should be played for
          entertainment only, not for investment purposes; billboards promoting a game carry the shorter statement that
          lottery games should not be played for investment purposes (subsection (8)); billboards promoting funded
          projects carry a separate entertainment-only line (subsection (9)). Subsection numbers as shown in the
          excerpt; confirm against the current text, which SB 914 (2025) renumbered or amended. Quoted from a search
          excerpt of the cited page; the page itself could not be opened from the drafting environment.
    - rule_type: responsible_gambling_message_required
      text: >-
        Billboards that promote a lottery game, show where tickets are sold or publicize prize winners, and billboards
        that publicize projects or programs funded by Lottery revenue, must include a problem gambling helpline
        statement, "Need help with problem gambling? Call or text" followed by the telephone number of a problem
        gambling helpline, in addition to the investment or entertainment disclaimer; applies to billboard advertising
        first published on or after the effective date of the 2025 Act.
      authority_citation: ORS 461.220 as amended by SB 914 (2025 Or. Laws ch. 185)
      provenance:
