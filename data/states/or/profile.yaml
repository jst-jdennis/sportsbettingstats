      text: >-
        Television, radio and newspaper advertisements for a lottery game must carry a disclaimer stating a close
        approximation of the odds of winning a prize and the prize payout percentage, in the form "The odds of winning
        some prize are one in (some number). The prize payout percentage is (some number)."
