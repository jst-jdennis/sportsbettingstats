        help with problem gambling? Call or text" followed by the phone number of a helpline, so required_number is
        null. Effective date of the 2025 Act not shown in any excerpt. Quoted from a search excerpt of the cited page;
        the page itself could not be opened from the drafting environment.
limitations:
- Oregon reports lottery sports betting as net lottery proceeds rather than taxable revenue, so the state has no tax
  rate to compare and its revenue line is not defined the same way as commercial states' gross gaming revenue.
- Tribal casino sportsbook handle and revenue are not published by the state.
- Residents also used federally regulated prediction markets during the period covered. No action by an Oregon state
  body against a prediction market platform was found by search on 2026-10-16; a private class action (Reynolds v.
  Kalshi, D. Or., 2026) was reported and is not a state action.
