summary: >-
  Oregon's online sports betting is a state lottery game operated by the Oregon Lottery under ORS chapter 461 and
  Article XV, section 4 of the Oregon Constitution. The Lottery launched its Scoreboard app on October 16, 2019 and
  migrated players to DraftKings Sportsbook, its official provider, in January 2022. Retail sportsbooks operate only
  at tribal casinos, beginning with Chinook Winds in 2019. There is no tax; the Lottery's net proceeds are
  transferred under the constitution and statute.
