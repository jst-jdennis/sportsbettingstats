  mechanism_text: ORS 461.549 directs the Oregon State Lottery to transfer each fiscal quarter to the Problem Gambling Treatment
    Fund the greater of one percent of the moneys transferred that quarter from the State Lottery Fund to the Administrative
    Services Economic Development Fund or one percent of the transfer in the same quarter of the 2011 to 2013 biennium, a
    floor added by HB 2355 (2013). Sports betting is a Lottery game, so its net proceeds flow through the same formula. The
    fund is continuously appropriated to the Oregon Health Authority for prevention and treatment programs under ORS 413.522,
    and the Authority reported that the one percent came to approximately eight million dollars in each of fiscal years 2023-24
    and 2024-25.
