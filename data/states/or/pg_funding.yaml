    notes: 'The ORS chapter page could not be opened from the drafting container (outbound fetches were blocked); the operative
      language is quoted from search-engine extracts of ORS 461.549 as enacted by HB 2355 (2013): the fund receives the greater
      of "(a) One percent of the moneys transferred from the Oregon State Lottery Fund to the Administrative Services Economic
      Development Fund in that fiscal quarter; or (b) One percent of the moneys transferred ... during the same fiscal quarter
      of the biennium beginning July 1, 2011", and ORS 413.522 provides that "all moneys in the Problem Gambling Treatment
      Fund are continuously appropriated to the Oregon Health Authority for prevention and treatment programs and their administration".
      Confirm against the current ORS edition. The amount is left null because the Authority''s reports state it only approximately:
      the OHA FY 2024-25 PGS Treatment Program Services Report (https://www.oregon.gov/oha/HSD/Problem-Gambling/Documents/FY%202024-25%20PGS%20Treatment%20Program%20Services%20Report.pdf)
      says "approximately eight million dollars in Oregon Lottery revenues were transferred to the OHA"; the exact figure
      should be taken from the Legislatively Adopted Budget or the Lottery''s transfer records. Archived copy checked on 2026-10-17:
      ORS chapter 461 as archived lists 461.549, use of video lottery proceeds for treatment of gambling-related behavioral
      problems, with the one percent allocation; the Oregon Health Authority program report as archived describes the Problem
      Gambling Services funding.'
