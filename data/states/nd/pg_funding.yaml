    notes: 'The Century Code chapter PDF could not be opened from the drafting container (outbound fetches were blocked);
      the operative language is quoted from search-engine extracts of 2025 bill drafts amending the section: "the attorney
      general shall allocate remaining moneys in the charitable gaming operating fund on a quarterly basis as follows: a.
      Ten thousand dollars to the gambling disorder prevention and treatment fund", with SB 2205 (https://ndlegis.gov/assembly/69-2025/regular/bill-overview/bo2205.html,
      bill text at https://ndlegis.gov/sites/default/files/resource/69-2025/library/sb2205.pdf) striking that figure. SB 2205
      passed the Senate 47 to 0 and the House 67 to 25 and was signed March 24, 2025; the enacted quarterly amount must be
      read from the enrolled bill, since the 75,000 dollar figure comes from the Charitable Gaming Association''s testimony.
      The lottery transfer under 53-12.1-09(4) was 50,000 dollars a quarter per a 2008 Legislative Council memo and a 2017
      bill text shows 80,000 dollars a quarter; the current figure was not confirmed. The lead citations 53-06.1-11.1 and
      chapter 54-23.3 were not found to carry the allocation. The amount will come from the Department of Health and Human
      Services'' budget or the fund''s balance in the biennial appropriation act. Archived copy checked on 2026-10-17: N.D.C.C.
      53-06.1-11.2 as archived from the Century Code reads: the attorney general shall allocate remaining moneys in the charitable
      gaming operating fund on a quarterly basis, seventy-five thousand dollars to the gambling disorder prevention and treatment
      fund, which is the SB 2205 (2025) figure.'
