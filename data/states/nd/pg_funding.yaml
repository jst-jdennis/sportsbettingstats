  mechanism_text: N.D.C.C. 53-06.1-11.2 deposits the charitable gaming tax in the charitable gaming operating fund and directs
    the attorney general to allocate from it each quarter a fixed dollar amount to the gambling disorder prevention and treatment
    fund; the amount was 10,000 dollars a quarter until SB 2205 (2025), signed March 24, 2025, raised it (testimony put the
    new figure at 75,000 dollars a quarter). N.D.C.C. 53-12.1-09 directs the state lottery to transfer a further fixed amount
    each quarter to the same fund. The fund is spent by the Department of Health and Human Services on prevention and treatment
    under a continuing appropriation. Sports wagering is offered only at tribal casinos under compacts and contributes nothing
    to the fund. The archived Century Code text gives the quarterly allocation as seventy-five thousand dollars.
