limitations:
- North Dakota is a comparison state with no state-regulated sports wagering. Tribal sportsbook activity under the
  compacts is not reported by the state, and residents can use offshore sites, sweepstakes products and federally
  regulated prediction markets; none of that appears in any state revenue series.
- Problem gambling indicators for North Dakota reflect charitable gaming and tribal casinos and cannot be read as
  sports wagering effects.
