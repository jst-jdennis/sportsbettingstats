summary: >-
  North Dakota has no state statute authorizing sports wagering, and a constitutional amendment would be required
  for the Legislature to authorize it; House Concurrent Resolution 3002 passed the House in January 2023 and failed
  in the Senate 16 to 30 on April 10, 2023, after similar measures failed in 2019 and 2021. Sports wagering is
  offered only at tribal casinos under the tribal-state gaming compacts signed in December 2022, which also permit
  mobile wagering within reservation boundaries. The Attorney General's Gaming Division oversees compact compliance.
