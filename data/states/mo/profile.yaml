legal_age:
  - age: 21
    scope: all
    authority_citation: Mo. Const. art. III, sec. 39(g); Missouri Gaming Commission sports wagering launch notice (patrons must be at least 21 to establish an account and place wagers)
    provenance:
      <<: *mogc
      notes: Age confirmed from the Commission's launch notice by search on 2026-10-16. The constitutional subsection carrying the age was not read directly.
tax:
  - channel: all
    basis: adjusted_gross_revenue
    rate: 0.10
    tiers: null
    per_wager_fee_cents: null
    promo_deduction_rule: >-
      Adjusted gross revenue is defined in the constitution as receipts less winnings paid, promotional credits
      and uncollectible receivables of up to 2 percent, as summarized in the Commission's FY 2026 annual report.
      Press reports describe a cap on the promotional credit deduction at 25 percent of cash received in the
      month; that cap was not confirmed from the constitutional text by search on 2026-10-16.
    effective_from: "2025-12-01"
    effective_to: null
    destination:
      - fund_name: Compulsive Gaming Prevention Fund (the greater of 10 percent of annual tax revenue or 5,000,000 dollars, after Commission expenses not covered by fees)
        share: null
      - fund_name: Sports Wagering Education Fund (remaining balance)
        share: null
    authority_citation: Mo. Const. art. III, sec. 39(g), para. 10 (10 percent wagering tax on adjusted gross revenue)
    provenance:
      source_id: mo-legislature
      source_url: https://revisor.mo.gov/main/OneSection.aspx?section=III+++39%28g%29
      archive_url: null
      retrieved_at: "2026-10-16"
      retrieval_method: manual_entry
      transform: null
      entered_by: agent-batch4-2026-10-16
      reviewed_by: null
      status: pending_review
      page_or_table: Section 39(g), paragraph 10
      notes: >-
        Rate, base and fund allocation drawn from the Revisor of Statutes page and the Commission's FY 2026
        annual report (https://mgc.dps.mo.gov/annual_reports/AR_2026.pdf) as surfaced by search on 2026-10-16.
        The constitution names the fund the Compulsive Gaming Prevention Fund in the creating clause and the
        Compulsive Gaming Fund in the allocation clause. Shares are not published as percentages. The effective
        date is the first day wagering was accepted.
