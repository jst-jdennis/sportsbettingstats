      url: https://revisor.mo.gov/main/OneSection.aspx?section=III+++39%28g%29
    operator_model: commercial
    notes: Retail licenses cover wagering at excursion gambling boats and within professional sports districts. The constitution caps retail licenses at 19 and mobile licenses at 14.
