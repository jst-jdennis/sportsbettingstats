limitations:
  - Missouri's taxable base is adjusted gross revenue after promotional credit deductions. In the first months after launch, reported deductions exceeded net revenue for most operators, so tax receipts are not a proxy for handle or gross revenue.
  - Revenue series begin December 2025, so no full fiscal year is available and seasonal comparison is not yet possible.
  - Deposit limit, advertising, credit card and helpline rules exist in 11 CSR 45-20 but were not read on review and are left unentered rather than summarized from secondary sources.
