abbr: MO
name: Missouri
profile_completeness: status_only
summary: >-
  Missouri voters approved Amendment 2 on November 5, 2024, adding Article III, Section 39(g) to the state
  constitution and directing the Missouri Gaming Commission to license retail and mobile sports wagering by
  December 1, 2025. The Commission's launch notice states that legal wagering became available to patrons at
  12:00 a.m. on December 1, 2025. The constitution sets a 10 percent wagering tax on adjusted gross revenue,
  with promotional credits among the permitted deductions.
