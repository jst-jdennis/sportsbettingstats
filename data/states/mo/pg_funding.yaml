    page_or_table: Mo. Const. art. III, sec. 39(g), subsection 10 (tax) and the Compulsive Gaming Prevention Fund paragraph
    notes: 'Operative language as excerpted from the Revisor page and the Commission''s FY 2026 annual report: "the greater
      of 10% of the annual tax revenue or $5,000,000 is transferred to the Compulsive Gaming Prevention Fund" and "There is
      hereby created in the state treasury the ''Compulsive Gaming Prevention Fund'', which shall consist of taxes and fees
      collected under this section. Any monies remaining in the fund at the end of a biennium shall not revert to the credit
      of the general revenue fund." The amount is the total the Missouri Gaming Commission FY 2026 Annual Report (https://mgc.dps.mo.gov/annual_reports/AR_2026.pdf)
      shows allocated to the fund from sports wagering in the fiscal year ending June 30, 2026: 11,054,794.77 dollars, made
      up of the 5,000,000 dollar minimum transfer plus 6,054,794.77 dollars of license fee revenue remaining after expenses;
      rounded to the nearest dollar. Wagering began December 1, 2025, so FY 2026 is a partial year. Rule 11 CSR 45-20.590
      (proposed August 2025) states the Commission "shall utilize interagency agreements with the Missouri Department of Mental
      Health to facilitate the distribution and use of monies from the fund" and lists research, counseling, treatment and
      prevention programs, and grants as permitted uses. RSMo 313.842 (https://revisor.mo.gov/main/OneSection.aspx?section=313.842)
      reads "Subject to appropriation, such programs shall be funded from the one-cent admission fee authorized pursuant to
      section 313.820" and "The department of mental health shall administer programs, either directly or by contract, for
      compulsive gamblers." The constitutional subsection numbering (10(b)(2)) follows the Commission''s report; the Secretary
      of State''s certified ballot text uses the shorter name "Compulsive Gaming Fund" in that paragraph. Outbound web fetches
      were blocked from the drafting container, so the quotes come from search-engine excerpts of the cited pages; a reviewer
      should open the Revisor page and the report to confirm the subsection number and the figure. Expenditure by the Department
      of Mental Health for FY 2026 was not found. Archived copy checked on 2026-10-17: Mo. Const. art. III, sec. 39(g) as
      archived from the Revisor: the greater of ten percent of sports wagering tax revenue or 5,000,000 dollars, plus license
      fees remaining after Commission expenses, is deposited in the Compulsive Gaming Prevention Fund.'
