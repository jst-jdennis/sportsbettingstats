  mechanism_text: Article III, Section 39(g) of the Missouri Constitution, added by Amendment 2 in November 2024, levies a
    10 percent tax on sports wagering adjusted gross revenue and directs that the greater of 10 percent of the annual tax
    revenue or 5,000,000 dollars be transferred to the Compulsive Gaming Prevention Fund, with the remainder of the tax appropriated
    to education. Sports wagering license fees left over after the Missouri Gaming Commission's expenses are reimbursed also
    go to the fund, which is a dedicated fund that does not revert to general revenue. The Commission holds the fund and distributes
    it through interagency agreements with the Department of Mental Health, which administers compulsive gambling programs
    under RSMo 313.842; that older statute also lets one cent of the casino admission fee be credited to the Compulsive Gamblers
    Fund, subject to appropriation.
  administering_agency: Missouri Gaming Commission, with distribution through the Missouri Department of Mental Health
