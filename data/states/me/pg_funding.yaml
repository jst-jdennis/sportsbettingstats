  mechanism_text: Maine taxes sports wagering operators at 10 percent of adjusted gross sports wagering receipts, and 8 M.R.S.
    section 1218 directs one percent of adjusted gross sports wagering receipts to the Gambling Addiction Prevention and Treatment
    Fund established by 5 M.R.S. section 20006-B, with the balance going to the General Fund and the Gambling Control Unit.
    The fund also receives a share of net slot machine income under 8 M.R.S. section 1036(2). The fund is a dedicated, nonlapsing
    fund overseen by the Maine Center for Disease Control and Prevention in the Department of Health and Human Services, which
    reports on it to the Legislature each March 1.
