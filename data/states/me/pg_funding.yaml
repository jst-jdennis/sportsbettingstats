    notes: '8 M.R.S. 1218 (Allocation of funds) provides that one percent of adjusted gross sports wagering receipts goes
      to the Gambling Addiction Prevention and Treatment Fund established under Title 5, section 20006-B; the fund statute
      (https://legislature.maine.gov/statutes/5/title5sec20006-B.html) describes "a dedicated, nonlapsing fund into which
      payments are received in accordance with Title 8, section 1036, subsection 2". The amount is the deposit reported in
      the Maine CDC Gambling Addiction Prevention and Treatment Fund Annual Report for the period 10/1/2023 to 9/30/2024 (https://legislature.maine.gov/doc/11887):
      "the amount deposited in the fund during FY24 was $323,254.15", attributed to the one percent sports wagering share
      after wagering began in November 2023; the report lists the 211 Maine Problem Gambling Helpline, the AdCare problem
      gambling services contract, prevention and recovery mini-grants and the Gambling Addiction Treatment Reimbursement Network
      as uses. The amount is rounded to the dollar; confirm whether the report period is the state fiscal year and whether
      slot machine transfers under 8 M.R.S. 1036 are included. Retrieval caveat: the network policy of the drafting environment
      blocked legislature.maine.gov and maine.gov, so the quoted language comes from search-index excerpts of these documents,
      not from loading them; the reviewer should open the statute page and the report. The leads to 8 M.R.S. 1216 and 1217
      were wrong: those sections cover unauthorized wagering and applicability of other laws; the allocation section is 1218.
      The Gambling Control Unit revenue page (https://www.maine.gov/dps/gcu/sports-wagering/sports-wagering-revenue) restates
      the one percent share. Archived copy checked on 2026-10-17: 8 M.R.S. 1218 as archived, paragraph B: one percent of the
      adjusted gross sports wagering receipts must be deposited in the Gambling Addiction Prevention and Treatment Fund established
      by Title 5, section 20006-B; the Maine CDC fund report as archived states the amount deposited during FY24 was 323,254.15
      dollars.'
