        Archiving on 2026-10-17 confirmed the section in part: the Legislature's committee amendment to LD 2080 is archived and carries the 8 M.R.S. 1214-A language barring wagers made with a credit card; the Gambling Control Unit's bill tracker and rules on maine.gov refused the runner (403) even with browser headers.
        Quoted from a search excerpt of the cited page; the page itself could not be opened from the drafting
        environment. Excerpt: "Public Law 2025, chapter 628 prohibits an operator and a management services licensee
