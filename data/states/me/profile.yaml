limitations:
  - Maine's market is small and dominated by two online operators under tribal licenses, so monthly figures are volatile and operator-level reports can identify individual firms.
  - Retail wagering began only in September 2024 at a single location, so the retail series is short and nearly all handle is online.
  - Maine deducts no promotional play from the tax base, so its adjusted gross receipts are closer to gross revenue than in states with free play deductions.
