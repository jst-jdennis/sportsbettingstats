  credit_card_deposits:
    allowed: false
    authority_citation: 8 M.R.S. 1214-A (credit cards prohibited), enacted by Public Law 2025, chapter 628 (LD 2080, 132nd Legislature), effective 90 days after adjournment of the 132nd Legislature; 16-633 CMR sports wagering rules (effective November 1, 2023), permitted funding sources for mobile accounts exclude credit cards and provide that extending credit to patron accounts is strictly prohibited
    notes: >-
      Statute prohibits it. Public Law 2025, chapter 628 provides that an operator and a management services licensee
      conducting sports wagering (and, as amended, internet gaming under 8 M.R.S. 1412-A) may not accept a wager from
      a person using a credit card, and directs the Director of the Gambling Control Unit to ensure through rulemaking
      that a person does not use a credit card to make a wager. Before that act, the Unit's 2023 rules listed the
      permitted funding sources for a mobile sports wagering account (the patron's deposit account, cash or chips at a
      facility lounge, promotional credit, winnings, operator adjustments and other means approved by the Director)
      without credit cards and stated that providing credit to patron accounts is strictly prohibited. The exact
      effective date and whether the Unit has amended its rules to match were not confirmed. Quoted from search
      excerpts of the cited pages; the pages themselves could not be opened from the drafting environment.
    provenance:
      <<: *mereg
      source_url: https://www1.maine.gov/dps/gcu/bill-tracker/VLA-132-Session-Bills
      retrieved_at: "2026-10-17"
