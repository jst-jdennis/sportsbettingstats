tax:
  - channel: all
    basis: adjusted_gross_revenue
    rate: 0.10
    tiers: null
    per_wager_fee_cents: null
    promo_deduction_rule: >-
      8 M.R.S. 1202 defines adjusted gross sports wagering receipts as gross receipts less winnings paid to
      patrons, including the cash equivalent of merchandise prizes, and less federal excise tax. The definition
      contains no deduction for promotional credits.
    effective_from: "2023-11-03"
    effective_to: null
    destination:
      - fund_name: General Fund
        share: 0.65
      - fund_name: Gambling Control Unit administrative expenses
        share: 0.10
      - fund_name: Gambling Addiction Prevention and Treatment Fund
        share: 0.10
      - fund_name: Harness racing purses, Sire Stakes Fund and agricultural fair support
        share: 0.15
    authority_citation: 8 M.R.S. 1218 (operator collects and distributes 10 percent of adjusted gross sports wagering receipts; of the receipts, 1 percent to the Unit, 1 percent to the Gambling Addiction Prevention and Treatment Fund, 6.5 percent to the General Fund, remainder to racing and fairs)
    provenance:
      <<: *meleg
      source_url: https://legislature.maine.gov/legis/statutes/8/title8sec1218.html
      notes: Shares are expressed as fractions of the 10 percent tax (1 point of receipts equals 0.10 of the tax). The 1.5 point remainder is split among racing and fair funds in subsections not captured; confirm the split.
