summary: >-
  Maine enacted sports wagering through LD 585 (Public Law 2021, chapter 681), signed May 2, 2022. Online
  wagering is reserved to the state's four federally recognized tribes, each of which may hold one mobile
  license, and launched November 3, 2023. Facility licenses are open to commercial tracks, off-track betting
  facilities, casinos and the tribes; the first retail sportsbook opened in Portland in September 2024. The
  Gambling Control Unit of the Department of Public Safety regulates both channels and collects a 10 percent
  tax on adjusted gross sports wagering receipts.
