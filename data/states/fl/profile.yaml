limitations:
  - Florida publishes no operator-level sports wagering handle or revenue; the only public figures are the Tribe's aggregate revenue share payments reported in state budget documents, which cover all compact gaming, not sports wagering alone.
  - The market operated for 34 days in late 2021, was dark from December 2021 to November 2023 during federal litigation over the compact, and relaunched in stages; any time series must account for the gap.
