summary: >-
  Florida sports wagering operates under the 2021 Gaming Compact between the Seminole Tribe of Florida and the
  State, executed April 23, 2021 and ratified by the Legislature in Senate Bill 2-A (2021A). The Tribe is the sole
  operator; mobile wagers placed anywhere in Florida are routed through servers on tribal land, and the Tribe
  contracts with pari-mutuel permitholders for marketing. Federal approval of the compact was set aside by the US
  District Court for the District of Columbia on November 22, 2021, and wagering resumed in late 2023 after that
  ruling was reversed on appeal.
