  mechanism_text: Florida's compulsive or addictive gambling prevention program is funded by an annual nonrefundable regulatory
    fee of $250,000 paid by each slot machine licensee to the Florida Gaming Control Commission, which contracts with a private
    provider for a helpline and an advertising program promoting responsible gaming. The fee is a flat amount per licensee
    rather than a share of gaming revenue or tax. The Seminole compact revenue share is deposited to the General Revenue Fund
    with no problem gambling earmark in the ratifying statute, and any Florida Lottery funding of the helpline under chapter
    24 was not confirmed from the statute in this pass. The statute itself fixes the amount (250,000 dollars per licensee
    per year) and its use, so under the classification rule this is a statutory earmark of a fixed amount per licensee rather
    than a regulator-set fee.
