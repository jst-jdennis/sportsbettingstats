    notes: 'Operative language as excerpted from the Florida Senate statutes site (2025 Florida Statutes): "The compulsive
      or addictive gambling prevention program shall be funded from an annual nonrefundable regulatory fee of $250,000 paid
      by the licensee to the commission." The flsenate.gov and leg.state.fl.us hosts were blocked by this session''s network
      policy, so the clause was taken from the search engine''s excerpt of that page; the reviewer must open the section.
      A 2025 paragraph limits the commission''s prevention services contract for the 2025-2026 fiscal year to one year. Amount
      (fee receipts and the contract value) to be taken from the Florida Gaming Control Commission annual report or the General
      Appropriations Act line for the commission. Still to confirm: whether s. 24.105 or the Florida Lottery appropriation
      funds the Florida Council on Compulsive Gambling helpline in addition to the slot licensee fee, and whether the 2021
      Seminole compact contains a problem gambling contribution term. Archived copy checked on 2026-10-17: Fla. Stat. 551.118(3)
      as archived: the compulsive or addictive gambling prevention program shall be funded from an annual nonrefundable regulatory
      fee of 250,000 dollars paid by the licensee to the commission.'
