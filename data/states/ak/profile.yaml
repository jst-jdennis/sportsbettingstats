summary: >-
  Alaska has not authorized sports wagering in any form and has no commercial casinos or tribal Class III gaming.
  House Bill 145 (34th Legislature), introduced on March 21, 2025, would have licensed up to ten online sportsbooks
  at a 20 percent tax on adjusted gross revenue; it was heard and held in the House Labor and Commerce Committee,
  most recently on February 27, 2026, and did not reach a floor vote.
