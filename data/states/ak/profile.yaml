limitations:
  - Alaska is a comparison state with no regulated sports wagering and no casino market. Residents may use offshore sites, sweepstakes products and, depending on platform geofencing, federally regulated prediction markets; none of that activity appears in any state revenue series.
  - Alaska's small population makes per capita indicators volatile from year to year.
