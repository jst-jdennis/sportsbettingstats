  mechanism_text: Alaska has no lottery, casino or sports wagering statute, and the charitable gaming chapter (Alaska Stat.
    Title 5, Chapter 15) contains no problem gambling fund or set-aside. No primary document was found establishing a Department
    of Health appropriation for problem gambling services or an official statement that the state funds none. House Bill 145
    of 2025, which would have licensed online sports wagering, did not advance.
