    notes: 'Enrolled Act No. 23 (2023 HB 181), amending W.S. 9-24-104(a): "Not later than the fifteenth day of each month,
      in accordance with commission rules, a sports wagering operator shall remit ten percent (10%) of online sports wagering
      revenue from the prior month to the commission, except as provided in subsection (b) of this section. Each fiscal year,
      the first three hundred thousand dollars ($300,000.00) of revenue generated under this section is continuously appropriated
      to the department of health to be distributed to the counties for the purpose of funding county health programs to prevent
      and treat problematic gambling behavior." The provision originated in 2021 HB 133 (https://wyoleg.gov/2021/Enroll/HB0133.pdf).
      The codified text is in the Title 9 statute file at https://wyoleg.gov/statutes/compress/title09.pdf, which could not
      be fetched from this session (network policy); confirm there. The $300,000 FY2025 figure is from the LSO Gaming Revenues
      Fact Sheet (May 2025, https://wyoleg.gov/InterimCommittee/2025/SCF-2025061210-01_20250514_GamingRevenuesFactSheetwAppend_Final.pdf),
      which lists $300,000 to the Department of Health in each of FY2022 to FY2025; the Gaming Commission''s 2025 press release
      repeats the distribution. 2026 HB 171 (problem gaming treatment distribution) was not considered for introduction (2026-02-13);
      the Select Committee on Gaming has a 2027 draft, 27LSO-0096, on problem gambling funding, so check for changes after
      the 2027 session. Archived copy checked on 2026-10-17: The 2023 enrolled act as archived carries the first-300,000-dollars
      provision, and the LSO Gaming Revenues Fact Sheet as archived states that the first 300,000 dollars per fiscal year
      of the ten percent online sports wagering remittance is continuously appropriated to the Department of Health for county
      gambling abuse and treatment programs, with 300,000 dollars transferred in each of 2022 through 2025.'
