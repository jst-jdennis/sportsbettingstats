  mechanism_text: W.S. 9-24-104(a) requires each online sports wagering operator to remit ten percent of online sports wagering
    revenue to the Wyoming Gaming Commission monthly and continuously appropriates the first $300,000 of that revenue each
    fiscal year to the Department of Health, to be distributed to the counties to fund county health programs to prevent and
    treat problematic gambling behavior; the remainder is deposited in the general fund. The amount is a fixed dollar figure,
    not a share of revenue. No other Wyoming gaming statute (skill-based games, historic horse racing) dedicates revenue to
    problem gambling, apart from a racing benevolence fund share of breakage; the Gaming Commission's own responsible gaming
    work is paid from operator administrative contributions. The Legislative Service Office reports the $300,000 distribution
    each fiscal year from 2022 through 2025.
