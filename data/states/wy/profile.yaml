        Operative language quoted from a search excerpt of the Justia mirror of Wyoming Administrative Code agency
        038, sub-agency 0002, Chapter 6, Section 7
        (https://regulations.justia.com/states/wyoming/agency-038/sub-agency-0002/chapter-6/section-6-7): a patron's
