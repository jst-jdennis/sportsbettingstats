consumer_protections:
  self_exclusion:
    program_type: statewide_registry
    administered_by: Wyoming Gaming Commission
    durations: null
    covers: [sports_wagering_online, other_commission_regulated_gambling]
    enrollment_methods: [online, mail]
    url: https://gaming.wyo.gov/resources/responsible-gaming/self-exclusion
    notes: The Commission's program lets a person commit to refrain from sports wagering and other gambling offered by the Commission and its permittees; applicants may submit a request online or download and file a form. Available durations were not retrieved.
    provenance: *wygc
  deposit_limits:
    player_set_available: true
    mandatory_default: false
    player_set_required_at_signup: false
    cooling_off_on_increase_hours: null
    statutory_cap_usd: null
    authority_citation: Wyoming Gaming Commission Online Sports Wagering Rules, Chapter 6 (sports wagering accounts), Section 12 (responsible gaming limits); see also Chapter 6, Sections 3, 4 and 13
    notes: >-
      Account holders may set responsible gaming limits, and deposit limits must be offered on daily, weekly and
      monthly bases. Any decrease to a limit is effective immediately or at the point in time clearly indicated to
      the patron; any increase becomes effective only after the previous limit period has expired and the patron
      reaffirms the change, so the cooling-off period is the remainder of the limit period rather than a fixed
      number of hours. Section 4 requires a Commission-approved patron protection page listing available measures
      such as self-imposed limits and how to invoke them; Section 13 lets a patron suspend an account for at least
      72 hours. The excerpts show no default limit and no requirement to set a limit at registration. Quoted from a
      search excerpt of a mirror of the cited rule; the official page itself could not be opened from the drafting
      environment.
    provenance:
      <<: *wygc
      source_url: https://gaming.wyo.gov/rules-and-regs
      archive_url: sha256:3b86f7f49c3d21498fca9a2566a7678d12fd5de9f2fefe29df793d75873e396b
      retrieved_at: "2026-10-17"
      entered_by: claude-draft-2026-10-17
      page_or_table: Online Sports Wagering Rules, Chapter 6, Section 12
      notes: >-
        Checked on 2026-10-17 against the archived Cornell LII copy of the section (sha256 99bf89e69d4f): 038-6 Wyo. Code R. section 6-12: deposit, wager and time limits on a daily, weekly and monthly basis, with an increase effective only after the period expires and the player reaffirms it; the regulator's own document could not be fetched.
        The Commission's rules page lists the Online Sports Wagering chapters and refers readers to the Secretary of
        State for the current text. The operative language (deposit limits offered on a daily, weekly and monthly
        basis; any decrease to these limits shall be effective immediately or at the point in time clearly indicated
        to the patron; any increase effective only after the prior period ends and the patron reaffirms the change)
        was quoted from search excerpts of the Cornell LII and Justia mirrors of Wyoming Administrative Code agency
        038, sub-agency 0002, Chapter 6, Section 12
        (https://www.law.cornell.edu/regulations/wyoming/038-6-Wyo-Code-R-SSSS-6-12 and
        https://regulations.justia.com/states/wyoming/agency-038/sub-agency-0002/chapter-6/section-6-12). Neither the
        official page nor the mirrors could be opened from the drafting environment; the Justia copy is current
        through 2024-09-21 and Chapter 6 was listed for final adoption at a 2024 Commission meeting, so confirm
        against the adopted text.
