        Every form of advertising must contain a statement that minors are not allowed to open or have access to
        sports wagering accounts, together with information on programs to prevent, treat or monitor compulsive or
        problem gambling and on self-exclusion procedures.
      authority_citation: Wyoming Gaming Commission Online Sports Wagering Rules, Chapter 8 (responsible gaming), Section 5 (advertising)
      provenance:
        <<: *wygc
        source_url: https://gaming.wyo.gov/rules-and-regs
        archive_url: sha256:3b86f7f49c3d21498fca9a2566a7678d12fd5de9f2fefe29df793d75873e396b
        retrieved_at: "2026-10-17"
        entered_by: claude-draft-2026-10-17
        page_or_table: Online Sports Wagering Rules, Chapter 8, Section 5
        notes: >-
          Archiving on 2026-10-17 did not yield the section text: the Chapter 8 rule text could not be fetched (the mirror returned 403 and the Commission rules page carries only links); the clause rests on the search excerpt.
          Operative language quoted from search excerpts of the Cornell LII and Justia mirrors of Chapter 8, Section
          5 (URLs as on the preceding row): the Commission shall also require that every form of advertising contain
          a statement that minors are not allowed to open or have access to sports wagering accounts, plus
          information on compulsive or problem gambling programs and self-exclusion procedures. The rule names no
          helpline number in the excerpt, so no helpline_message record is made. Section 1 of the same chapter
          requires a Responsible Gaming Plan covering promotional materials about problem gambling and treatment
          resources and procedures to prevent underage gambling. The official page could not be opened from the
          drafting environment.
  credit_card_deposits:
    allowed: true
    authority_citation: Wyoming Gaming Commission Online Sports Wagering Rules, Chapter 6 (sports wagering accounts), Section 7 (approved funding methods, which list credit and debit cards); W.S. 9-24-101 (cash equivalent includes credit cards and debit cards)
    notes: >-
      Permitted by the funding methods list: a patron's sports wagering account may be funded using approved methods
      that produce a sufficient audit trail for verification of the source of the wagers, and the list includes
      credit and debit cards, electronic payment systems, prepaid instruments and other methods; for card and
      electronic funds transfer deposits the patron may be charged fees that are deducted from the account. The
      enrolled 2021 act (HB 133) defines cash equivalent to include credit cards and debit cards. No prohibition on
      credit card funding was found in the excerpts. Quoted from a search excerpt of a mirror of the cited rule; the
      official page itself could not be opened from the drafting environment.
    provenance:
      <<: *wygc
      source_url: https://gaming.wyo.gov/rules-and-regs
      archive_url: sha256:3b86f7f49c3d21498fca9a2566a7678d12fd5de9f2fefe29df793d75873e396b
