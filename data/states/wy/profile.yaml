summary: >-
  Wyoming authorized statewide online sports wagering through 2021 House Bill 133, signed April 5, 2021 and
  regulated by the Wyoming Gaming Commission; the first online operators launched on September 1, 2021. The
  statute authorizes online wagering only; on-premises sports wagering exists at the Northern Arapaho Tribe's
  Wind River Hotel and Casino under tribal authority. Operators remit 10 percent of online sports wagering
  revenue, defined net of payouts, federal excise tax and promotional play, and the minimum age is 18.
