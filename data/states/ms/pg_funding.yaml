    notes: 'Operative language of SB 3036 (2025 Regular Session, as passed the Senate), Section 10: "Of the funds appropriated
      in Section 1 of this act, it is the intention of the Legislature that Seventy-five Thousand Dollars ($75,000.00) is
      authorized to be transferred to the nonprofit organization, Mississippi Council on Compulsive Gambling, which provides
      crisis intervention and support services." Section 1 appropriates 9,130,593 dollars from the State General Fund to the
      Gaming Commission for July 1, 2025 through June 30, 2026. The House amendment report (https://billstatus.ls.state.ms.us/documents/2025/pdf/ham/Amendment_Report_for_SB3036.pdf)
      keeps the same Section 10 language, but the enrolled or "As Sent to Governor" 2025 text was not located, so the final
      FY2026 figure should be confirmed against it; the FY2024 bill as sent to the Governor (https://billstatus.ls.state.ms.us/documents/2023/html/SB/3000-3099/SB3036SG.htm)
      and the FY2025 bill (https://billstatus.ls.state.ms.us/documents/2024/html/SB/3000-3099/SB3041PS.htm) carry the same
      75,000 dollar language. The amount is a legislative intent authorization, not a mandatory line item. Search notes: searches
      of billstatus.ls.state.ms.us, msgamingcommission.com and dmh.ms.gov for a problem gambling earmark in Title 75, Chapter
      76 or a Department of Mental Health gambling program found none; the only recurring public funding found is this appropriation.
      Retrieval caveat: the network policy of the drafting environment blocked billstatus.ls.state.ms.us, so quoted language
      comes from search-index excerpts of these documents, not from loading them. The "includes" field is left empty because
      the act describes the services only as "crisis intervention and support services". Archiving on 2026-10-17 did not yield
      the section text: billstatus.ls.state.ms.us did not respond to the archiving request; the clause remains as taken from
      the search excerpt until a reviewer opens the page.'
