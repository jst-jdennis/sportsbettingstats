  mechanism_text: Mississippi has no statutory dedication of gaming revenue to problem gambling services. The Gaming Control
    Act (Miss. Code Title 75, Chapter 76) creates the Gaming Commission Fund at section 75-76-325 but no problem gambling
    earmark. Each year the Legislature's appropriation act for the Mississippi Gaming Commission states its intent that 75,000
    dollars of the Commission's general fund appropriation is authorized to be transferred to the nonprofit Mississippi Council
    on Compulsive Gambling, which provides crisis intervention and support services; the same language appears in the FY2024,
    FY2025 and FY2026 appropriation bills and a 100,000 dollar version appeared in 2005.
  administering_agency: Mississippi Gaming Commission (transfer to the Mississippi Council on Compulsive Gambling)
  includes: null
