limitations:
  - Mississippi reports sports wagering revenue by casino region (coastal, central, northern) and does not separate retail from on-premises mobile wagering.
  - Because wagering requires physical presence in a casino, Mississippi handle is driven by casino visitation, including tourists from Alabama, Tennessee and Louisiana, and is not a measure of resident activity.
  - Louisiana (2022) and Tennessee (2020) launched online wagering after Mississippi, which changed cross-border visitation to Mississippi casinos; comparisons across those dates are confounded.
