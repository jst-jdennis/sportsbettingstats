summary: >-
  Mississippi's 2017 fantasy contest law, House Bill 967, removed the state prohibition on sports pools at
  licensed casinos, and the Gaming Commission adopted sports wagering regulations in June 2018 after the
  Murphy decision. Casinos began taking wagers in August 2018. Wagering is on casino premises only; mobile
  wagering is allowed only while the bettor is physically inside the licensed casino. Bills to authorize
  statewide online wagering were considered in the 2025 and 2026 sessions.
