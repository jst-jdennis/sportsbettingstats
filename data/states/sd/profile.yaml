summary: >-
  South Dakota voters approved Constitutional Amendment B on November 3, 2020, allowing the Legislature to authorize
  sports wagering within the city limits of Deadwood, and Senate Bill 44 of 2021 added sports wagering to the games
  permitted under SDCL chapter 42-7B. Retail wagering began in Deadwood on September 9, 2021 and is also offered at
  tribal casinos under compacts. Wagers must be placed on the premises of a licensed Deadwood establishment; there is
  no statewide online channel. The combined gaming tax is 9 percent of adjusted gross proceeds.
