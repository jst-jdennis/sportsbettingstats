    notes: 'The statute page could not be opened from the drafting container (outbound fetches were blocked); a search-engine
      extract of the cited page gives the section title "Gaming addiction treatment and counseling program grants from Gaming
      Commission fund" and the operative language that the commission "may grant an amount not to exceed thirty thousand dollars
      each fiscal year" from the fund to the Department of Social Services, added by 2006 session law chapter 222 (https://mylrc.sdlegislature.gov/api/Documents/SessionLaw/109840.html?Year=2006).
      The lead citations 42-7B-48.1 and 42-7A-24 were not confirmed to contain a problem gambling allocation. The Lottery''s
      figure comes from its newsroom (https://dor.sd.gov/newsroom/south-dakota-lottery-urges-responsible-gaming-this-holiday-season,
      "up to $214,000 annually") and from a state economist''s 2023 testimony to a House committee; the amount and its basis
      should be taken from the General Appropriations Act or the Lottery''s annual report before an amount is entered. Archiving
      on 2026-10-17 did not yield the section text: the South Dakota Legislature page archived is rendered by script and holds
