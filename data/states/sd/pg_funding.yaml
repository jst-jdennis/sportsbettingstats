  mechanism_text: SDCL 42-7B-48.3 lets the South Dakota Commission on Gaming grant up to 30,000 dollars each fiscal year from
    the Gaming Commission fund, which holds the Deadwood gaming tax including the tax on sports wagering, to the Department
    of Social Services for gaming addiction treatment and counseling programs; the grant is discretionary and capped rather
    than a share of revenue. The larger stream is the South Dakota Lottery, which states that it makes up to 214,000 dollars
    a year available to the Department of Social Services for problem gambling treatment, and the statutory basis for that
    amount (an appropriation from the lottery operating fund rather than a dedication in SDCL chapter 42-7A) remains to be
    confirmed. The Department of Social Services' Division of Behavioral Health administers the treatment program. SDCL 42-7B-48.3
    lets the Commission grant up to a capped amount at its discretion, and the lottery funding is an operating-fund allocation,
    so under the classification rule this is discretionary funding recorded as appropriation.
  administering_agency: South Dakota Department of Social Services, Division of Behavioral Health
