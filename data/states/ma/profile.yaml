consumer_protections:
  self_exclusion:
    program_type: statewide_registry
    administered_by: Massachusetts Gaming Commission (Voluntary Self-Exclusion program under 205 CMR 233)
    durations: null
    covers: [casinos, sports_wagering_retail, sports_wagering_online]
    enrollment_methods: [in_person, online]
    url: https://www.mass.gov/doc/205-cmr-256-sports-wagering-advertising/download
    notes: >-
      205 CMR 256.07 bars advertising, texts and unsolicited pop-ups aimed at persons enrolled in the 205 CMR 233
      program. Duration options and enrollment methods not confirmed by search on 2026-10-16; the program page on
      massgaming.com should be cited once retrieved.
    provenance:
      <<: *mareg
      source_url: https://www.mass.gov/doc/205-cmr-256-sports-wagering-advertising/download
  deposit_limits: null
  advertising:
    - rule_type: no_under_age_targeting
      text: Advertising must state the 21 and over requirement and may not be aimed at persons under 21.
      authority_citation: 205 CMR 256.05
      provenance: &ma256
        <<: *mareg
        source_url: https://www.mass.gov/doc/205-cmr-256-sports-wagering-advertising/download
        notes: Version published in Massachusetts Register 1552 (July 18, 2025).
    - rule_type: responsible_gambling_message_required
      text: Advertising must include a link to and the telephone number of the Massachusetts Problem Gambling Helpline.
      authority_citation: 205 CMR 256.06(2)
      provenance: *ma256
    - rule_type: other
      text: Advertising may not be aimed exclusively or primarily at persons at moderate or high risk of gambling addiction, and operators may not use at-risk bettor traits for targeting.
      authority_citation: 205 CMR 256.06(1)
      provenance: *ma256
    - rule_type: opt_out_of_direct_marketing
      text: Operators may not send text messages or unsolicited internet pop-up advertising to persons enrolled in the voluntary self-exclusion program, directly or through affiliates and contracted third parties.
      authority_citation: 205 CMR 256.07
      provenance: *ma256
  credit_card_deposits:
    allowed: false
    authority_citation: M.G.L. c. 23N, s. 3 (a deposit into a sports wagering account shall not be made using a credit card); St. 2022, c. 173 (an operator shall not accept a wager from a person under 21 or a credit card); 205 CMR 248 (account management) and 205 CMR 238.27 (no deposits derived from credit extended by affiliates or agents)
    notes: null
    provenance:
      <<: *maleg
      source_url: https://www.mass.gov/info-details/mass-general-laws-c23n-ss-3
  helpline_message:
    required: true
    required_number: null
    authority_citation: 205 CMR 256.06(2) (link to and telephone number for the Massachusetts Problem Gambling Helpline)
    provenance:
      <<: *ma256
      notes: The regulation names the Helpline rather than a specific number; the number was not confirmed by search on 2026-10-16.
limitations:
  - Massachusetts reports adjusted gross receipts with no promotional deduction, so its taxable and reported revenue is close to gross revenue and higher than in states that deduct free play.
  - Massachusetts shares borders with New Hampshire, Rhode Island, Connecticut and New York, all with online wagering, so cross-border handle is modest in both directions; Vermont launched online wagering in January 2024.
