summary: >-
  Massachusetts authorized sports wagering in Chapter 173 of the Acts of 2022, signed August 10, 2022, which
  created M.G.L. chapter 23N. Retail wagering began at the three casinos on January 31, 2023 and online
  wagering on March 10, 2023. The Massachusetts Gaming Commission licenses and regulates operators, taxes
  adjusted gross receipts at 15 percent for retail and 20 percent for online, and prohibits credit card
  funding of wagering accounts.
