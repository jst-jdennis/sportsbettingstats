  mechanism_text: Sports wagering excise under M.G.L. c. 23N section 14 (15 percent of in-person and 20 percent of mobile
    adjusted gross sports wagering receipts) is deposited in the Sports Wagering Fund, and c. 23N section 17 directs the Gaming
    Commission to transfer 9 percent of the fund to the Public Health Trust Fund established by c. 23K section 58. Casino
    gross gaming revenue tax is distributed under c. 23K section 59, which sends 5 percent of the Gaming Revenue Fund to the
    Public Health Trust Fund, and c. 23N section 15 deposits an operator fee in the same fund. The Secretary of Health and
    Human Services is trustee of the Public Health Trust Fund, which pays for prevention, treatment and research on gambling-related
    problems, and annual budget acts have altered the percentages for particular license categories in some years.
  administering_agency: Massachusetts Executive Office of Health and Human Services (trustee); Department of Public Health,
    Office of Problem Gambling Services
