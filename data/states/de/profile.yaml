limitations:
  - Delaware has no sports wagering tax. The state's share is a statutory distribution of sports lottery proceeds among the State, the video lottery agents, horse racing purses and the vendor under Del. Code tit. 29, Section 4815; the current shares were not confirmed by search on 2026-10-16 and the tax section is left unentered rather than estimated.
  - Delaware figures are not comparable with commercial states because the Lottery is the operator, there is one mobile vendor, and the published monthly figures are net proceeds after payouts rather than operator revenue.
  - A material share of Delaware retail handle before 2018 came from residents of neighboring states where wagering was then illegal, and the launch of Pennsylvania, New Jersey and Maryland markets changed that pattern.
