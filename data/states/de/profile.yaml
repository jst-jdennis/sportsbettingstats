summary: >-
  Delaware's sports lottery statute was re-enacted by House Substitute 1 for House Bill 100, signed on May 14,
  2009, and parlay wagering on NFL games began that September under the state's PASPA exemption. Full single-game
  wagering began at the three racetrack casinos on June 5, 2018. The Delaware Lottery operates sports wagering
  directly through its agents and, since late December 2023, through a single mobile vendor, so the state's take
  is a statutory share of proceeds rather than a tax on licensees.
