  mechanism_text: 'The state lottery statute''s distribution of video lottery and table game proceeds sets aside a share for
    problem gambling: of the table game proceeds returned to the State, 250,000 dollars or one percent, whichever is greater,
    goes to the Division of Substance Abuse and Mental Health in the Department of Health and Social Services, and the video
    lottery provisions set aside a portion of slot machine proceeds for assistance to problem gamblers. The Division contracts
    most of this money to the Delaware Council on Gambling Problems, Inc., a nonprofit that runs the helpline, treatment referral
    and prevention programs. Sports lottery proceeds are not separately earmarked.'
