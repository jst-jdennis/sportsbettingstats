    page_or_table: Del. Code tit. 29, 4815(b)(3) (video lottery proceeds) and the table game proceeds paragraph of 4815(b)
    notes: 'Archived copy checked on 2026-10-17: 4815(b)(3) directs, of the proceeds returned to the State under that paragraph,
      "$250,000 or 1%, whichever is greater" to the Division of Substance Abuse and Mental Health for funding programs for
      the treatment, education and assistance of compulsive gamblers and their families, and the table game proceeds paragraph
      makes the same direction "to be used exclusively" for those programs. The operative language was quoted in a search
      excerpt of a secondary compilation of state statutes (not cited): after administrative and law enforcement costs, "$250,000
      or 1%, whichever is greater, of the proceeds returned to the State under this paragraph" goes to the Division of Substance
      Abuse and Mental Health. The Delaware Council on Gambling Problems states on its own site that the 1994 video lottery
      enabling legislation set aside a portion of slot profits annually for problem gambling and that most of its funding
      is a contract for services with the Division of Substance Abuse and Mental Health. Reviewer should read 29 Del. C. 4815(b)(3)
      and (b)(4) and replace the citation with the exact paragraph. Amount to be taken from the Delaware Lottery annual report
      or the DHSS budget; none was found. Archiving on 2026-10-17 did not yield the section text: the Delaware Code URL archived
      is the chapter landing page, not the section text; the clause remains as taken from the search excerpt until a reviewer
      opens the page.'
