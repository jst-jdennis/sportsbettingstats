name: North Carolina
profile_completeness: status_only
summary: >-
  North Carolina first permitted sports wagering at tribal casinos through 2019 legislation, and the Eastern Band
  of Cherokee Indians opened retail sportsbooks in March 2021. House Bill 347 of 2023 authorized statewide
  online wagering and additional retail locations under the North Carolina State Lottery Commission, with a
  privilege tax on operators' gross wagering revenue; the Commission set a launch in the first half of 2024
  and online wagering began in March 2024.
