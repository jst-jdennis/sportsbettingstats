limitations:
  - The privilege tax on interactive operators (enacted at 18 percent of gross wagering revenue according to press accounts of the Senate amendments; the House version in the General Assembly's fiscal memorandum was 14 percent) and the promotional credit deduction schedule were not confirmed from the session law or G.S. 105-113.126 by search on 2026-10-16 and are left unentered.
  - Tribal retail sportsbooks report no revenue to the state; Lottery Commission figures cover licensed interactive operators and Commission-regulated retail only.
  - Minimum age (21), self-exclusion, deposit limit, advertising, credit card and helpline rules sit in G.S. ch. 18C art. 9 and Commission rules but were not read on review.
