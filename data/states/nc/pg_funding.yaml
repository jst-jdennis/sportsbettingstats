  mechanism_text: 'G.S. 105-113.128 distributes the privilege tax on interactive sports wagering operators'' gross wagering
    revenue: after the Department of Revenue and the State Lottery Commission are reimbursed for administrative costs (the
    Commission capped at 500,000 dollars a year), the first priority for the net proceeds is two million dollars annually
    to the Department of Health and Human Services for gambling addiction education and treatment programs, a fixed amount
    that does not rise with wagering revenue. The State Lottery Act separately transfers one million dollars a year from lottery
    proceeds to the same department for the same purpose. The 2025-26 budget act (S.L. 2026-41, S 257) raised the wagering
    tax rate and changed the distribution of the remainder but, per the General Assembly''s fiscal memorandum, left the two
    million dollar DHHS allocation unchanged.'
