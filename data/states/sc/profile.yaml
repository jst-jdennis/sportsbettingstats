limitations:
- South Carolina is a comparison state with no regulated sports wagering. Residents can and do use offshore sites,
  sweepstakes products and, depending on platform geofencing, federally regulated prediction markets; none of that
  appears in any state revenue series.
- No action by a South Carolina state body against a prediction market platform was found by search on 2026-10-16.
