summary: >-
  South Carolina has not authorized sports wagering in any form; the only legal gambling is the Education Lottery and
  charitable bingo. Bills to create a regulated market, most recently H 3625 and its Senate companion S 444 in the
  2025 to 2026 session, have been introduced but not enacted, and the governor has opposed gambling expansion.
