  mechanism_text: South Carolina has no casinos or sports wagering. S.C. Code 59-150-230(I) directs that a portion of the
    Education Lottery's unclaimed prize money, in an amount the General Assembly sets each year in the annual appropriations
    act, go to the Department of Alcohol and Other Drug Abuse Services or a nonprofit affiliated with the National Council
    on Problem Gambling for the prevention and treatment of compulsive gambling disorder and educational programs, including
    a gambling hotline. Because the statute fixes neither a share nor a dollar amount, the mechanism is an annual appropriation.
    The lottery section of the FY 2025-26 appropriations bill (H 4025) carries 100,000 dollars for gambling addiction services
    from unclaimed prizes, the same amount shown in the FY 2024-25 and FY 2026-27 lottery schedules.
  administering_agency: South Carolina Department of Alcohol and Other Drug Abuse Services (functions moved to the Department
    of Behavioral Health and Developmental Disabilities in 2025)
