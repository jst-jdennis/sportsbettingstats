    notes: 'Neither the spreadsheet nor the statute page could be opened from the drafting container (outbound fetches were
      blocked); the figures come from search-engine extracts. The House Ways and Means lottery spreadsheet for H 4025 (FY
      2025-26) lists 100,000 dollars for DAODAS gambling addiction services under unclaimed prizes; it is the committee''s
      schedule, so the amount should be confirmed against the ratified act''s Part IB lottery proviso. The statute, S.C. Code
      59-150-230 (https://www.scstatehouse.gov/code/t59c150.php), provides as quoted in bill texts that unclaimed prize funds
      go "to the Department of Alcohol and Other Drug Abuse Services, or its successor agency, or to a nonprofit organization
      affiliated with the National Council on Problem Gambling ... for the prevention and treatment of compulsive gambling
      disorder and educational programs related to that disorder, including a gambling hotline" in an amount "determined by
      the General Assembly in the annual appropriations act". The Ways and Means schedule for FY 2026-27 labels the same 100,000
      dollar line under BHDD, consistent with the 2025 agency consolidation; confirm the successor agency. Archived copy checked
      on 2026-10-17: The House Ways and Means lottery schedule for H 4025 as archived lists 100,000 dollars for DAODAS gambling
      addiction services under unclaimed prizes; S.C. Code 59-150-230 as archived carries the unclaimed prize provision.'
