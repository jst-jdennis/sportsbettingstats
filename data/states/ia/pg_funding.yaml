    notes: 'The legis.iowa.gov host was blocked by this session''s network policy, so Iowa Code 99F.11, 135.150 and 8.57I
      could not be opened. Search excerpts from legis.iowa.gov show 99F.11(4) allocating eight-tenths of one percent of the
      adjusted gross receipts tax to the county endowment fund and two-tenths of one percent to a first-tier appropriation
      whose recipient was cut off, 99F.11(5) imposing the 6.75 percent sports wagering tax credited under section 8.57I, the
      LSA Iowa Gambling Treatment Program Historical Summary (docs/publications/SD/6139.pdf) describing 0.5 percent of gross
      lottery revenue and 0.5 percent of casino adjusted gross receipts with amounts above $6 million going to the Rebuild
      Iowa Infrastructure Fund, the HF 2286 fiscal note (docs/publications/FN/1286819.pdf) stating the program is funded from
      the Sports Wagering Receipts Fund and that its repeal may require another source, and the 2026 Session Fiscal Report
      (docs/publications/FR/1611991.pdf) listing a Gambling Treatment Program line of $1.75 million. Because these conflict
      on the current source, the mechanism is left unknown. Reviewer: read 99F.11(4)(d), 8.57I(2), 135.150 and the FY2026
      HHS appropriations act, then set either statutory_earmark_pct_revenue or appropriation and take the amount from the
      Session Fiscal Report. Archived copy checked on 2026-10-17: Iowa Code 135.150 as archived establishes the gambling treatment
      program and fund; the current revenue source could not be read from the archived copies, so the mechanism stays unknown.'
