  mechanism_text: Iowa Code 135.150 establishes the gambling treatment program in the Department of Health and Human Services
    and a gambling treatment fund. Legislative Services Agency documents describe the funding source as having changed over
    time, from 0.3 percent and later 0.5 percent of casino adjusted gross receipts and lottery revenue, to sports wagering
    receipts under the 2019 sports wagering act, with a 2024 fiscal note warning that repeal of the Sports Wagering Receipts
    Fund would require a new source and the 2026 Session Fiscal Report listing a Gambling Treatment Program line of $1.75
    million. The current statutory mechanism could not be read from the Code in this pass.
  administering_agency: Iowa Department of Health and Human Services
