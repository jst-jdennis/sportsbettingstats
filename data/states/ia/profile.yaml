profile_completeness: full
summary: >-
  Iowa authorized sports wagering in Senate File 617 (2019), which amended Iowa Code chapter 99F. Retail and online
  wagering both began on August 15, 2019 through the state's licensed casinos and their advance deposit sports
  wagering partners. The Iowa Racing and Gaming Commission licenses operators and runs the statewide voluntary
  self-exclusion program, and the state taxes sports wagering net receipts at 6.75 percent.
