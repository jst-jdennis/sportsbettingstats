    notes: 'Archived copy checked on 2026-10-17 (Office of Legislative Legal Services 2024 Title 44 compilation, 566 pages):
      44-30-701(2)(a)(VI.5) reads "For the 2022-23 state fiscal year and each state fiscal year thereafter, two million five
      hundred thousand dollars to the responsible gaming grant program cash fund created in section 44-30-1702 (8)"; 44-30-1509(2)(c)(IV)
      transfers undisbursed hold-harmless money to that fund; the section''s editor''s note 3 says subsection (2)(d), the
      130,000 dollar transfer, repealed itself effective December 31, 2023. The earlier draft of this record, written from
      search excerpts, described the repealed transfer as current; the session law 212 (HB 24-1436) PDF archived on the first
      pass did not carry the clause. The amount recorded is the statutory transfer, not an audited actual; the grant program''s
      spending is reported by the Division of Gaming.'
