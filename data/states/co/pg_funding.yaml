  mechanism_text: C.R.S. 44-30-701(2)(a)(VI.5) transfers 2,500,000 dollars from the state share of the limited gaming fund
    to the responsible gaming grant program cash fund created in 44-30-1702(8) for the 2022-23 state fiscal year and each
    fiscal year thereafter. The sports betting fund statute, 44-30-1509(2)(c)(IV), adds any hold-harmless fund money not disbursed
    within two years to the same cash fund each December 31. The former 44-30-1509(2)(d) transfer of 130,000 dollars a year
    from sports betting tax to the office of behavioral health was repealed effective December 31, 2023, so no sports betting
    tax is earmarked for problem gambling as a fixed sum after that date.
  administering_agency: Colorado Department of Revenue, Division of Gaming and Limited Gaming Control Commission, with the
    Behavioral Health Administration
