  mechanism_text: Sports betting tax, license fees and fines are credited to the sports betting fund created by C.R.S. 44-30-1509.
    After the Division of Gaming's administrative costs the state treasurer transfers six percent of full fiscal year revenue
    to the wagering revenue recipients hold-harmless fund, a fixed 130,000 dollars a year to the Behavioral Health Administration
    for the prevention, education and treatment of gambling disorders, and the remainder to the water plan implementation
    cash fund. House Bill 22-1402 created the responsible gaming grant program in the Department of Revenue, administered
    by the Limited Gaming Control Commission with the Behavioral Health Administration, and its cash fund (C.R.S. 44-30-1702(8))
    receives hold-harmless money not disbursed within two years, a transfer from the limited gaming (casino tax) fund under
    C.R.S. 44-30-701(2)(a)(VI.5), and a 200,000 dollar annual lottery fund appropriation.
  administering_agency: Colorado Department of Revenue, Division of Gaming and Limited Gaming Control Commission, with the
    Behavioral Health Administration
