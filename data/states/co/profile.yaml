name: Colorado
profile_completeness: full
summary: >-
  Colorado voters approved Proposition DD on November 5, 2019, bringing House Bill 19-1327 into effect, and retail
  and online sports betting both launched on May 1, 2020. Master licenses are held by the casinos in Black Hawk,
  Central City and Cripple Creek, which contract with internet and retail operators. The state taxes net sports
  betting proceeds at 10 percent, and the deduction for free bets was narrowed by HB 22-1402 and HB 25-1311 and is
  eliminated from July 1, 2026.
