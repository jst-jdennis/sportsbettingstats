consumer_protections:
  self_exclusion:
    program_type: both
    administered_by: Colorado Division of Gaming (statewide list since September 2023); each sports betting operator must also maintain its own program under Rule 9.2
    durations: [1 year, 3 years, 5 years]
    covers: [casinos, sports_wagering_retail, sports_wagering_online]
    enrollment_methods: [online, in_person, mail]
    url: https://sbg.colorado.gov/self-exclusion
    notes: Online enrollment requires a Social Security number; mailed enrollment uses a notarized form (DR 9681). Before September 2023 the list was kept by the Problem Gambling Coalition of Colorado.
    provenance:
      <<: *codg
      source_url: https://sbg.colorado.gov/news-article/state-of-colorado-marks-one-year-of-successful-self-exclusion-list-for-responsible
      notes: Confirmed by search on 2026-10-16 against the Division's news release and registration form; operator program requirement from Sports Betting Rule 9 (1 CCR 207-2).
