  credit_card_deposits: null
  helpline_message: null
limitations:
  - Louisiana taxes net gaming proceeds after a capped promotional play deduction, so its taxable revenue is lower than gross revenue and is not directly comparable to states that tax gross revenue.
  - Online wagering is available only in the 55 approving parishes; statewide per capita figures understate exposure in those parishes and overstate it in the nine that opted out.
  - The online tax rate changed in 2025, so year over year tax collections are not a measure of market growth across that boundary.
