summary: >-
  Louisiana voters in 55 of 64 parishes approved sports wagering in November 2020, and the Legislature enacted
  the Louisiana Sports Wagering Act (Act 440 of 2021, SB 247) on June 21, 2021, with a separate tax act (HB 697)
  signed June 4, 2021. Retail wagering began at casinos in late October 2021 and online wagering on January 28,
  2022, in the approving parishes only. Act 298 of 2025 raised the tax on electronic wagers from 15 percent to
  21.5 percent of net gaming proceeds.
