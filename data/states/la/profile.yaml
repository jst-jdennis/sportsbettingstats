tax:
  - channel: retail
    basis: adjusted_gross_revenue
    rate: 0.10
    tiers: null
    per_wager_fee_cents: null
    promo_deduction_rule: >-
      The tax applies to net gaming proceeds, defined as gross wagers less winnings paid and eligible promotional
      play. Under La. R.S. 27:627 eligible promotional play is the dollar amount of sports wagering promotional
      play wagers actually redeemed, capped at 5,000,000 dollars per licensee per calendar year; a platform
      provider serving several licensees may not claim more than the cap per licensee. A 2024 Third Extraordinary
      Session bill (HB 22) proposed repealing R.S. 27:627; its enactment was not confirmed by search on 2026-10-16.
    effective_from: "2021-10-31"
    effective_to: null
    destination:
      - fund_name: State General Fund and dedicated funds including the Sports Wagering Purse Supplement Fund, early childhood education fund and local government allocations
        share: null
    authority_citation: La. R.S. 27:625(B) (10 percent of net gaming proceeds from wagers placed onsite)
    provenance:
      <<: *laleg
      source_url: https://legis.la.gov/Legis/Law.aspx?d=1239411
      notes: Rate and basis from the statute page. Destination shares not confirmed by search; the fiscal note for HB 639 (2025) describes the allocation, so share is left null.
