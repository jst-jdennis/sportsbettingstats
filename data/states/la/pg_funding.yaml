  mechanism_text: Louisiana levies a 10 percent tax on onsite sports wagering net gaming proceeds and 21.5 percent on online
    and mobile proceeds, and La. R.S. 27:625(G)(6) credits three percent of the monies collected, or 500,000 dollars, whichever
    is greater, to the Compulsive and Problem Gaming Fund created by La. R.S. 28:842. The fund also receives dedications from
    riverboat, land-based casino, video draw poker, racetrack slot and lottery revenue under the statutes listed in R.S. 28:842
    (including one percent of racetrack slot proceeds capped at 500,000 dollars under R.S. 27:392) and forfeitures from wagers
    by self-excluded persons under R.S. 27:27.1. Money may be withdrawn only by legislative appropriation, and the appropriation
    is made to the Louisiana Department of Health, Office of Behavioral Health.
  administering_agency: Louisiana Department of Health, Office of Behavioral Health
