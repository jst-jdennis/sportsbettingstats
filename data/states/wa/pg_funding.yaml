  mechanism_text: Washington funds its problem gambling program from statutory shares of gambling revenue deposited in the
    problem gambling account in the state treasury (RCW 41.05.751). RCW 82.04.285(2) imposes an additional business and occupation
    tax on gross income from contests of chance (card rooms, pull tabs and similar games with $50,000 or more a year in such
    income) of 0.26 percent from July 1, 2024 (0.2 percent before that), deposited in the account; RCW 67.70.340(3) directs
    the Lottery Commission to transfer 0.26 percent of net receipts from shared game lottery revenue to the account for fiscal
    year 2025 and later (0.2 percent in fiscal year 2024). Money in the account may be spent only after appropriation and
    only for the prevention, treatment and professional training program run by the Health Care Authority under RCW 41.05.750
    (formerly RCW 43.20A.890). Tribal sports wagering is not taxed and does not contribute.
