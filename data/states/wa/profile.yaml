name: Washington
profile_completeness: status_only
summary: >-
  Washington authorized sports wagering in March 2020 through ESHB 2638, which permits it only at tribal
  Class III facilities under amended tribal-state gaming compacts. The Gambling Commission negotiates the
  compact amendments and the first sportsbook opened at Snoqualmie Casino on September 9, 2021. Mobile
  wagering is allowed only while the bettor is on tribal gaming premises. There is no state tax on sports
  wagering; compacts provide for tribal contributions and regulatory cost reimbursement.
