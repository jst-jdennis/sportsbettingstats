limitations:
  - Washington publishes no handle or revenue series for tribal sports wagering, so the state cannot be placed in revenue comparisons.
  - Mobile wagering is on premises only, so Washington's market is a retail market for comparison purposes even though apps exist.
  - Minimum age and self-exclusion terms are set by compact and tribal ordinance and were not confirmed on a primary page by search on 2026-10-16; the sections are left empty rather than estimated.
