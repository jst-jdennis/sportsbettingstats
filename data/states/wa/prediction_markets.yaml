    issuing_body: Washington State Gambling Commission
    target: Prediction market operators offering event-based contracts (not named individually)
    summary: The Commission published a notice stating that offering event-based contracts, or participating in prediction markets, is not authorized in Washington, that the matter is in litigation federally and in other states, and that it would monitor the cases. It directed consumers to tribal casinos authorized to conduct sports wagering under compact.
