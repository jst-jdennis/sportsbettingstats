    rulings:
      - date: "2026-07-20"
        court: King County Superior Court
        summary: Granted the state's motion for a preliminary injunction, finding the state likely to prove that Kalshi operates unlicensed online gambling in violation of the Gambling Act and the Consumer Protection Act and rejecting the argument that the Commodity Exchange Act preempts state law.
        document_url: null
      - date: "2026-08-13"
        court: King County Superior Court
        summary: Entered an order requiring Kalshi to geofence Washington users out of sports, election, political, entertainment, culture, technology and science contracts, with an IP and residency based system by 2026-08-18 and a multi-source system by 2026-09-02, a daily penalty for noncompliance, and a bar on advertising restricted contracts to Washington consumers. Requests to stay the injunction pending appeal were denied by the trial court and the Court of Appeals, per press reports.
        document_url: null
