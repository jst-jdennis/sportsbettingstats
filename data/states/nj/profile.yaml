  advertising:
    - rule_type: no_college_partnerships
      text: Sports wagering operators may not enter into advertising or sponsorship partnerships with New Jersey colleges and universities.
      authority_citation: P.L. 2024 (college partnership prohibition); confirm chapter
      provenance:
        <<: *njleg
        notes: Chapter number to be confirmed.
    - rule_type: responsible_gambling_message_required
      text: Advertising must include the 1-800-GAMBLER helpline number and a responsible gaming message.
      authority_citation: N.J.A.C. 13:69N and DGE advertising directives
      provenance: *njdge
    - rule_type: no_risk_free_language
      text: The Division's 2023 responsible gaming advertising guidance restricts describing promotions as risk free when the patron can lose money.
      authority_citation: DGE Responsible Gaming Advertising guidance (2023)
      provenance: *njdge
  credit_card_deposits:
