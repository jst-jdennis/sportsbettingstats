summary: >-
  New Jersey authorized sports wagering in June 2018, days after the Supreme Court decision in Murphy v. NCAA
  that the state had brought. Retail wagering began at racetracks and Atlantic City casinos on June 14, 2018
  and online wagering on August 6, 2018. The Division of Gaming Enforcement regulates and publishes monthly
  revenue, which gives the longest continuous post-2018 series of any state.
