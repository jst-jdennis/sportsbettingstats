    required_number: 1-800-GAMBLER
    authority_citation: N.J.S.A. 5:12A-11 and N.J.A.C. 13:69N
    provenance: *njdge
limitations:
  - New Jersey's monthly revenue figures are gross revenue before promotional deductions, which is not the taxable base and is not directly comparable to states that report adjusted revenue.
  - A share of New Jersey online handle comes from residents of neighboring states who cross the border to wager, which was especially pronounced before New York launched online wagering in January 2022.
