tax:
  - channel: retail
    basis: gross_gaming_revenue
    rate: 0.20
    tiers: null
    per_wager_fee_cents: null
    promo_deduction_rule: >-
      Gross gaming revenue is defined in Neb. Rev. Stat. 9-1101 as the amount collected from games of chance
      less federal taxes other than income taxes and less redeemed promotional credits. No cap on the
      promotional credit deduction was identified. Confirm against the current definition before verification.
    effective_from: "2023-06-22"
    effective_to: null
    destination:
      - fund_name: Property Tax Credit Cash Fund
        share: 0.70
      - fund_name: Compulsive Gamblers Assistance Fund
        share: 0.025
      - fund_name: General Fund
        share: 0.025
      - fund_name: County and city in which the racetrack is located (12.5 percent each)
        share: 0.25
    authority_citation: Neb. Rev. Stat. 9-1203 (annual gaming tax of 20 percent of gross gaming revenue from games of chance at licensed racetrack enclosures)
    provenance:
      <<: *neleg
      source_url: https://www.nebraskalegislature.gov/laws/statutes.php?statute=9-1203
      page_or_table: Neb. Rev. Stat. 9-1203
      notes: >-
        Rate and base confirmed from the statute page by search on 2026-10-16. Distribution shares are taken from
        the LB 561 fiscal note
        (https://nebraskalegislature.gov/FloorDocs/107/PDF/FN/LB561_20210129-123401.pdf), which described an
        earlier version of the bill; confirm against the enacted text of 9-1204. The tax applies to all games of
        chance at racetrack casinos, including sports wagering; effective_from is the first day of sports
        wagering, not the date the rate took effect for casino games.
consumer_protections: null
limitations:
  - Nebraska revenue is reported for games of chance at racetrack casinos; sports wagering is a small retail-only share and is not always broken out separately.
  - Before Missouri's December 2025 launch, Nebraska retail handle was influenced by Iowa and Kansas mobile markets drawing Nebraska residents across the border, and the reverse flow is small.
  - Self-exclusion, deposit limit, advertising, credit card and helpline rules exist in the Commission's rules but were not read on review and are left unentered.
