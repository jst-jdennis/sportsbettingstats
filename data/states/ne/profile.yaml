name: Nebraska
profile_completeness: status_only
summary: >-
  Nebraska voters approved Initiatives 429, 430 and 431 in November 2020, permitting games of chance at
  licensed racetrack enclosures. Legislative Bill 561 (2021) amended the Nebraska Racetrack Gaming Act to
  include sports wagering, limited to in-person wagering at licensed racetrack casinos; online and mobile
  wagering are not authorized. The State Racing and Gaming Commission licenses operators and collects a 20
  percent tax on gross gaming revenue.
