  mechanism_text: Neb. Rev. Stat. 9-1204 distributes the 20 percent tax on racetrack casino gross gaming revenue, which includes
    sports wagering, and credits two and one-half percent of the tax to the Compulsive Gamblers Assistance Fund, with 70 percent
    to the Property Tax Credit Cash Fund, two and one-half percent to the General Fund and 25 percent to the host county and
    city. Neb. Rev. Stat. 9-812 also transfers the first 500,000 dollars of state lottery net proceeds, plus one percent of
    the proceeds remaining after prizes, operating expenses and that transfer, to the same fund, and Neb. Rev. Stat. 9-1006
    adds charitable gaming revenue. The fund pays for the Gamblers Assistance Program, run by the Nebraska Commission on Problem
    Gambling; Legislative Bill 1001 (2026) moves the Commission's oversight and funding under the Racing and Gaming Commission.
  administering_agency: Nebraska Commission on Problem Gambling (Gamblers Assistance Program)
