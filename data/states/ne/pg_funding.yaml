    notes: 'Operative language as excerpted from the statute page: of the tax, seventy-five percent is remitted to the State
      Treasurer for distribution "two and one-half percent to the Compulsive Gamblers Assistance Fund, two and one-half percent
      to the General Fund, and seventy percent to the Property Tax Credit Cash Fund", the remaining twenty-five percent going
      to the county and city where the racetrack sits. Neb. Rev. Stat. 9-812 (https://nebraskalegislature.gov/laws/statutes.php?statute=9-812)
      reads "The first five hundred thousand dollars shall be transferred to the Compulsive Gamblers Assistance Fund" and
      "one percent of the money remaining after the payment of prizes and operating expenses and the initial transfer to the
      Compulsive Gamblers Assistance Fund shall be transferred to the Compulsive Gamblers Assistance Fund". Neb. Rev. Stat.
      9-1006 (https://nebraskalegislature.gov/laws/statutes.php?statute=9-1006) says the commission "shall administer the
      fund for the operation of the Gamblers Assistance Program". The amount is total program expenditures for the fiscal
      year ended June 30, 2025 from the Nebraska Commission on Problem Gambling''s Gamblers Assistance Program 2025 annual
      report (https://problemgambling.nebraska.gov/wp-content/uploads/GAP-2025-ANNUAL-REPORT.pdf): expenditures 2,856,076
      dollars (counseling 2,096,414; other operations 589,759; salaries and benefits 169,903) against revenue of 2,670,076
      dollars, of which casino tax was 1,006,694, charitable gaming 400,000 and lottery advertising share 294,209 as excerpted;
      the revenue lines in the excerpt do not sum to the total, so a reviewer should read the full report. The Department
      of Revenue''s September 2026 budget filing on nebraskalegislature.gov shows FY 2025-26 revenue of 3,378,982 and expenditures
      of 2,855,519 dollars for a later record. LB 1001 (approved March 16, 2026, https://nebraskalegislature.gov/FloorDocs/109/PDF/Slip/LB1001.pdf)
      adds gaming tax proceeds under 9-1204 as a named funding source in 9-1001 and 9-1006 and transfers the Commission to
      the Racing and Gaming Commission; whether it changed the two and one-half percent share was not confirmed. Outbound
      web fetches were blocked from the drafting container, so quotes come from search-engine excerpts of the cited pages.
      Archived copy checked on 2026-10-17: Neb. Rev. Stat. 9-1204 as archived: of the racetrack casino tax, two and one-half
      percent to the Compulsive Gamblers Assistance Fund; the Gamblers Assistance Program 2025 annual report as archived gives
      FY2025 program revenue of 2,670,076 dollars and expenditures of 2,856,076 dollars.'
