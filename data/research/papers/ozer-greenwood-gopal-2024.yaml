slug: ozer-greenwood-gopal-2024
title: "Let It Ride! An Empirical Investigation of Problem Gambling and the Implications of Legalized Online Sports Betting"
authors: [Gorkem Turgut Ozer, Brad N. Greenwood, Anandasivam Gopal]
year_first_circulated: 2024
publication_status: published
venue: Information Systems Research, Articles in Advance (2026)
doi: 10.1287/isre.2024.1526
canonical_url: https://doi.org/10.1287/isre.2024.1526
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  State-level counts of calls to the National Problem Gambling Helpline and state suicide counts, matched to the
  dates on which each state legalized retail sportsbooks and online sports betting.
design: >-
  Staggered difference-in-differences across states, separating the legalization of physical sportsbooks from the
  legalization of online betting. Heterogeneity is examined by age, marital status, education and sex.
plain_language_summary: >-
  The authors ask whether calls to the national problem gambling helpline, and suicide counts, changed when states
  legalized sports betting. They find that helpline calls did not move with the legalization of physical
  sportsbooks but rose when states legalized online betting, and that suicide counts also rose after online
  legalization, with the effects concentrated among young, unmarried, less-educated men. These are state-level
  averages across everyone in a state, not effects on an individual bettor. Helpline call volume responds to the
  advertising of the helpline number as well as to need, which the authors discuss but cannot fully separate.
methodology_notes:
  - Population-average estimates at the state level. The paper does not observe which callers bet.
  - The null result for physical sportsbooks is described by the authors as suggestive, since a precisely estimated zero is hard to establish with state-level counts.
  - The online-betting effect is attributed to ease of mobile access; the paper does not have data on betting volume by channel.
limitations:
  - Helpline calls are a measure of help-seeking, not of problem gambling prevalence. Mandatory helpline messaging in advertising raises call volume on its own.
  - The year of first circulation is inferred from conference presentations (SCECR and CHITA) and a January 2024 seminar listing; the first dated public draft could not be located.
  - The headline percentage increase in helpline calls circulating in press coverage (about 22.8 percent) was not read from the article and is not entered as a figure.
