slug: couture-cross-wu-2024
title: Impact of Sports Gambling on Mental Health
authors: [Cody Couture, Jeffrey Cross, Stephen Wu]
year_first_circulated: 2024
publication_status: published
venue: Economics Letters, volume 243, article 111922 (October 2024)
doi: 10.1016/j.econlet.2024.111922
canonical_url: https://doi.org/10.1016/j.econlet.2024.111922
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  Behavioral Risk Factor Surveillance System responses on self-reported mental health, matched to the timing of
  state sports gambling legalization.
design: >-
  Difference-in-differences across states by the timing of legalization, with estimates reported separately by sex,
  age group and marital status.
plain_language_summary: >-
  The authors ask whether self-reported mental health changed after states legalized sports gambling. They report
  that effects differ by group: men aged 18 to 24 reported better mental health after legalization, married men
  aged 30 to 34 reported worse mental health, and there was no detectable effect for women. These are averages
  across all survey respondents in each group within a state, not effects on people who bet, and the survey does
  not record whether a respondent gambles. The findings differ in direction from a West Virginia University working
  paper using the same survey.
methodology_notes:
  - Population-average estimates by demographic subgroup; the paper cannot identify bettors in BRFSS.
  - Short letter format; detailed robustness checks are limited by the venue.
limitations:
  - Self-reported mental health measures and a survey whose design changed over the period.
  - Subgroup estimates from many comparisons raise the chance that some differences arise by chance.
  - No numeric effect sizes were seen in the materials available; none are entered until the article is read.
