slug: clarida-2021
title: "An Empirical Analysis of the Impact of Legal Sports Betting On Consumer Credit Health"
authors: [Matthew Q. Clarida]
year_first_circulated: 2021
publication_status: published
venue: Columbia Business Law Review, volume 2020, issue 3 (student note, not a peer-reviewed economics journal)
doi: 10.52214/cblr.v2020i3.7812
canonical_url: https://doi.org/10.52214/cblr.v2020i3.7812
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  State-level consumer credit indicators, including mortgage delinquency rates, for the period around the
  first wave of state sports betting legalizations after the 2018 repeal of PASPA.
design: >-
  Difference-in-differences using the staggered timing of state legalization of sports betting to compare
  consumer credit outcomes in states that legalized with states that had not.
plain_language_summary: >-
  This law review note is an early attempt to measure whether legal sports betting changed consumer credit
  health in the states that adopted it. Using the staggered timing of legalization, the author reports a small
  but statistically significant increase in mortgage delinquency rates associated with legal sports betting.
  The estimates are state averages across all residents, not effects on people who bet. The note was written
  within two years of the first legalizations, before online wagering was widespread, and it appeared in a
  student-edited law review rather than a peer-reviewed economics journal.
methodology_notes:
  - Very short post-legalization window, covering only the earliest adopting states.
  - Student note; the estimation details, standard errors and data sources need to be read from the article before the figure is relied on.
limitations:
  - Few treated states and few post-periods, so the estimate is sensitive to which states are included and to pre-existing trends in those states.
  - Mortgage delinquency is a slow-moving outcome and may respond to legalization only with a lag longer than the sample allows.
  - The article was not opened from the build container; the finding is as stated in the indexed abstract.
