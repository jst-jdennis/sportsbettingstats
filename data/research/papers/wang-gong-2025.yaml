slug: wang-gong-2025
title: The Impact of Legalized Sports Betting on Aggression
authors: [Wenche Wang, Hua Gong]
year_first_circulated: 2025
publication_status: published
venue: Journal of Sports Economics, volume 27, issue 1, pages 116 to 146 (2026)
doi: 10.1177/15270025251396530
canonical_url: https://doi.org/10.1177/15270025251396530
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  Incident-level crime reports from the FBI National Incident-Based Reporting System for 2017 to 2021 in markets
  with NFL, NBA, MLB or NHL teams, matched to game schedules, game outcomes, closing betting lines and the dates on
  which states launched legal sports betting after Murphy v. NCAA.
design: >-
  Difference-in-differences comparing crime during the window from game start to four hours after the game ended in
  states that launched legal sports betting with the same window in states that had not, with heterogeneity by home
  games and by whether the outcome contradicted the betting line, and tests for spillovers into neighboring states.
plain_language_summary: >-
  The authors ask whether reported crime around professional games changed after states launched legal sports
  betting. They find an increase in assaults, larceny and vehicle theft in the hours during and after games in
  legalizing states, largest for home games whose outcomes went against the betting line, and some increase in
  neighboring states without legal betting. The authors interpret early effects as driven by financial stress from
  unexpected losses and later effects as also reflecting frustration and anxiety. These are area-level averages of
  reported incidents, not effects on bettors, and only incidents reported to NIBRS agencies are counted.
methodology_notes:
  - Population-average estimates at the reporting-area level; NIBRS coverage of agencies grew over the sample period.
  - The game-window design compares the same areas on game and non-game hours, which limits confounding from area trends.
limitations:
  - NIBRS coverage is incomplete, especially before 2021, and uneven across states.
  - The sample period spans the COVID-19 pandemic, which changed both game attendance and crime reporting.
  - Percentage increases reported in press coverage (about 30 to 70 percent for crime in the game window, 77.23 percent for assaults at home games and 93.42 percent after upsets) were not read from the article and are not entered.
