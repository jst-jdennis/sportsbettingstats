slug: baker-balthrop-johnson-kotter-pisciotta-2024
title: "Gambling Away Stability: Sports Betting's Impact on Vulnerable Households"
authors: [Scott R. Baker, Justin Balthrop, Mark J. Johnson, Jason D. Kotter, Kevin Pisciotta]
year_first_circulated: 2024
publication_status: published
venue: Journal of Financial Economics, volume 183 (2026)
doi: null
canonical_url: https://www.nber.org/papers/w33108
market_segment: regulated_sportsbook
unit_of_effect: household_level
data_used: >-
  De-identified household transaction data from a financial data aggregator, covering bank, card and brokerage
  accounts, which allows sports betting deposits to be observed directly alongside saving, spending and
  borrowing.
design: >-
  Staggered difference-in-differences around the dates states legalized online sports betting, comparing
  households in legalizing states with households elsewhere, with heterogeneity analysis by prior financial
  constraint.
plain_language_summary: >-
  Using transaction records that show actual deposits to betting platforms, the authors find that legalizing
  online sports betting increases betting substantially without reducing other gambling or everyday spending.
  What falls is saving and investing: money that would have gone into brokerage and savings accounts goes to
  betting instead. The effects are largest for households that were already financially constrained, which show
  higher credit card balances, less available credit and more overdrafts after legalization. The paper measures
  household-level outcomes, so unlike population-average credit bureau studies it speaks to what happens to
  households that bet, not to the state as a whole.
methodology_notes:
  - Household-level panel with directly observed betting deposits; this is the main difference from credit bureau studies.
  - The sample is users of a financial aggregation app, who may differ from the general population in income, age and financial engagement.
limitations:
  - External validity depends on how representative aggregator users are.
  - The published version may differ from the NBER working paper in sample and estimates; figures below are tied to the version in which they appear.
