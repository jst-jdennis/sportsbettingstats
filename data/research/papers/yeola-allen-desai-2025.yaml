slug: yeola-allen-desai-2025
title: Growing Health Concern Regarding Gambling Addiction in the Age of Sportsbooks
authors: [Atharva Yeola, Matthew R. Allen, Nimit Desai, Kevin H. Yang, Adam Poliak, Davey M. Smith, John W. Ayers]
year_first_circulated: 2025
publication_status: published
venue: JAMA Internal Medicine, research letter, published online February 17, 2025
doi: 10.1001/jamainternmed.2024.8193
canonical_url: https://doi.org/10.1001/jamainternmed.2024.8193
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  Google search volume for queries mentioning gambling together with addiction, addict or an anonymous
  hotline, by state and month, from 2016 to 2024, compared across states before and after each state's
  sportsbook launch.
design: >-
  Comparison of observed search volume with the volume expected from pre-launch trends, nationally and for
  each state that launched sportsbooks, with separate attention to states that opened online wagering.
plain_language_summary: >-
  The authors use search engine data as a proxy for help-seeking. After states opened sportsbooks, searches
  for help with gambling addiction rose above what the pre-launch trend predicted, by about a fifth nationally
  and by more in several states, with online launches associated with larger rises than retail launches.
  Searches are a measure of interest in help, not of diagnosed problem gambling, and the study cannot say who
  was searching or whether they went on to seek treatment.
methodology_notes:
  - Search volume is an aggregate index, not a count of people. It can rise with publicity of helplines as well as with need.
  - State estimates vary widely in precision; the national estimate is the most stable figure.
limitations:
  - Searches do not measure prevalence. Advertising of 1-800-GAMBLER, required in most legal states, raises searches on its own.
  - Author order after the third author is to be confirmed from the article record.
