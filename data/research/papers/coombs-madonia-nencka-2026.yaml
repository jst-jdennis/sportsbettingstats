slug: coombs-madonia-nencka-2026
title: "Gambling with State Budgets: Legalized Sports Betting and Lost Lottery Revenue"
authors: [Kyle Coombs, Greg Madonia, Peter Nencka, Austin C. Smith]
year_first_circulated: 2026
publication_status: working_paper
venue: IZA Discussion Paper no. 18724 (June 2026)
doi: null
canonical_url: https://www.iza.org/publications/dp/18724
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  State lottery revenue data by state and period, matched to the dates on which states legalized sports betting
  after the 2018 Murphy v. NCAA decision, together with state tax collections from sports betting used to
  compute the combined effect on state revenue.
design: >-
  Staggered difference-in-differences comparing lottery revenue in states that legalized sports betting with
  lottery revenue in states that had not yet done so, with a further calculation combining the lottery loss
  with the tax revenue states collect from sports betting.
plain_language_summary: >-
  The authors ask whether legal sports betting draws spending away from state lotteries. They find that after a
  state legalized sports betting its lottery revenue fell by about 10 to 13 percent and that the decline
  persisted. Because states keep a much smaller share of each dollar bet on sports than of each dollar spent on
  lottery tickets, the combined effect on state revenue from the two sources is estimated to be negative, but
  that combined estimate is imprecise. The figures are state-level averages, not effects on individual lottery
  players or bettors.
methodology_notes:
  - State-level (population-average) estimates of revenue, not estimates of substitution by individual consumers.
  - The combined-revenue estimate depends on each state's sports betting tax rate and on how much of the lottery decline is net new spending on sports betting rather than spending that left gambling entirely.
limitations:
  - Working paper; the imprecise combined-revenue estimate in particular may change in later drafts.
  - Lottery revenue can move for reasons unrelated to sports betting, such as jackpot cycles and the introduction of new lottery products, which a state-by-period design controls for only in part.
  - The 10 to 13 percent figure entered here comes from the abstract as quoted in search results; the tables have not been read.
