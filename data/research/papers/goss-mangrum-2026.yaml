slug: goss-mangrum-2026
title: "Sports Betting Across Borders: Spatial Spillovers, Credit Distress, and Fiscal Externalities"
authors: [Jacob Goss, Daniel Mangrum]
year_first_circulated: 2026
publication_status: working_paper
venue: Federal Reserve Bank of New York Staff Report no. 1184 (February 2026, revised March 2026)
doi: null
canonical_url: https://www.newyorkfed.org/research/staff_reports/sr1184
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  Consumer spending data that identify sportsbook transactions, matched to county of residence and to the
  dates on which states legalized mobile sports betting, together with consumer credit records used to measure
  delinquency on credit cards, auto loans and other consumer debts. The abstract states that 38 states had
  legalized mobile sports betting since the 2018 Murphy v. NCAA decision.
design: >-
  Extended two-way fixed effects event study that separately identifies the direct effect of legalization in a
  state and the spillover effect on counties in non-legal states by distance to the nearest legal state.
  Outcomes are sportsbook spending and take-up, delinquency on consumer debts, and implied state tax revenue.
plain_language_summary: >-
  The authors ask what happened to sportsbook spending and consumer credit after states legalized mobile sports
  betting, and whether residents of neighboring states that had not legalized were also affected. They report
  that sportsbook spending rose about tenfold and the share of people betting rose by about 3 percentage points,
  that counties in non-legal states within 15 miles of a legal state picked up spillover spending of about 14
  percent of the direct effect, fading to zero by about 60 miles, and that the share of borrowers delinquent on
  consumer debt rose by about 0.3 percentage points from a base of about 10.7 percent, with the rise concentrated
  among borrowers under 40 on credit cards and auto loans. All reported effects are averages across every
  resident or borrower in a county or state, bettors and non-bettors alike; the authors also report an implied
  effect per new bettor, which is much larger, by dividing the population effect by the take-up rate.
methodology_notes:
  - Population-average estimates. The abstract notes that ignoring spatial spillovers attenuates estimates and under-counts the affected population, since control counties near legal states are partly treated.
  - The implied per-bettor delinquency effect (about 10 percentage points) is the population effect divided by the roughly 3 percent take-up rate and is a derived quantity, not a direct estimate on bettors.
  - The staff report was revised in March 2026; the March version is the one indexed by RePEc and should be treated as current.
limitations:
  - Working paper that has already been revised once; figures may change in later drafts or in a journal version.
  - Spending data identify sportsbook transactions through payment records and will miss cash, offshore and some payment channels; credit records do not observe who bets.
  - The delinquency figures entered here come from the abstract as quoted in search results; the tables have not been read.
