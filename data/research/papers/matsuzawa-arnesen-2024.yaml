slug: matsuzawa-arnesen-2024
title: Sports Betting Legalization and Intimate Partner Violence
authors: [Kyutaro Matsuzawa, Emily Arnesen]
year_first_circulated: 2024
publication_status: working_paper
venue: null
doi: null
canonical_url: null
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  Incident-level police reports of intimate partner violence from the FBI National Incident-Based Reporting
  System, matched to NFL game outcomes and to the date each state legalized sports wagering.
design: >-
  Difference-in-differences that compares the change in reported intimate partner violence on days when the
  local NFL team loses a game it was favored to win, in states before and after legalization, against the
  same comparison in states without legal wagering. Upset losses are used because they are unexpected and
  are when bettors lose money.
plain_language_summary: >-
  Earlier work found that reports of intimate partner violence rise after a home team loses a game it was
  expected to win. This paper asks whether legal sports betting changes the size of that rise. It finds that
  the increase after an upset loss is larger in states once wagering is legal, by roughly a tenth, and is
  concentrated where online wagering is available. The effect is measured across all residents of a state on
  game days; it does not identify households that bet.
methodology_notes:
  - The identification uses within-season variation in surprise losses, so it is not driven by long-run trends in violence.
  - Results depend on the betting line defining which losses count as upsets.
limitations:
  - Working paper; the estimate and the sample may change between drafts.
  - Police reports undercount intimate partner violence and reporting may itself respond to game outcomes.
  - The SSRN abstract identifier and exact draft date are to be entered from the paper record.
