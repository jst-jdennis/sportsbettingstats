slug: arnesen-matsuzawa-2024
title: "Sports Betting Legalization Amplifies Emotional Cues and Intimate Partner Violence"
authors: [Emily Arnesen, Kyutaro Matsuzawa]
year_first_circulated: 2024
publication_status: working_paper
venue: San Diego State University Center for Health Economics and Policy Studies working paper series
doi: null
canonical_url: https://cheps.sdsu.edu/_resources/docs/working-papers/cheps-wp-20251001.pdf
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  Incident-level police reports of intimate partner violence from the FBI National Incident-Based Reporting
  System, 2011 to 2022, matched to NFL game outcomes and betting lines and to the date each state legalized
  sports wagering.
design: >-
  Extends Card and Dahl (2011). Compares the rise in reported intimate partner violence on days when the local
  NFL team loses a game it was favored to win, before and after a state legalized sports wagering, against the
  same comparison in states without legal wagering. Upset losses are used because they are unexpected and are
  when bettors lose money.
plain_language_summary: >-
  Earlier work found that reports of intimate partner violence rise after a home team loses a game it was
  expected to win. This paper asks whether legal sports betting changes the size of that rise. It finds that
  legalization raises the upset-loss effect by about 10 percentage points, with larger effects in states with
  mobile betting, around paydays and for teams on a winning streak. The authors read this as financial losses
  amplifying the emotional reaction to an unexpected loss. The effect is measured across all residents of a
  state on game days; it does not identify households that bet.
methodology_notes:
  - The identification uses within-season variation in surprise losses, so it is not driven by long-run trends in violence.
  - Results depend on the betting line defining which losses count as upsets.
limitations:
  - Working paper; the estimate and the sample may change between drafts. Two dated copies exist (October 2024 at the Minnesota Senate, October 2025 at CHEPS) and the difference between them has not been read.
  - Police reports undercount intimate partner violence and reporting may itself respond to game outcomes.
