slug: wilken-2025
title: "The Impact of Legalized Sports Betting on Child Maltreatment: Evidence from Child Protective Services Reports"
authors: [Eric Wilken]
year_first_circulated: 2025
publication_status: working_paper
venue: University of Oregon, Department of Economics, job market paper (2025-26 market); also SSRN 5962283
doi: null
canonical_url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5962283
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  Administrative child protective services report data (the October 2025 draft is described as using the
  National Child Abuse and Neglect Data System, NCANDS) covering screened-in maltreatment reports, their type
  and disposition, matched to the dates on which states legalized retail and mobile sports betting.
design: >-
  Staggered difference-in-differences comparing states that legalized sports betting with states that had not
  yet done so, with separate estimates for mobile legalization, for rural and urban areas, and tests of whether
  upset losses by local teams interact with legal betting.
plain_language_summary: >-
  The author asks whether legal sports betting changed the number of child maltreatment reports that child
  protective services screened in for investigation. The paper reports an increase of roughly 7 percent in
  screened-in reports after legalization, concentrated in states that legalized mobile betting and larger in
  rural areas. Legal betting did not amplify the link between upset losses by local teams and maltreatment
  reports, and the author reads the slow build-up of the effect as pointing to financial hardship rather than
  emotional reactions to bets. The estimate is an average across all children in a state, not an effect on
  households that bet, and screened-in reports measure contact with the child welfare system rather than
  confirmed maltreatment.
methodology_notes:
  - Population-average estimate at the state (or county) level; the data do not identify households that bet.
  - Secondary coverage describes the outcome as substantiated reports and the effect as 5 to 7 percent; the abstract of the later drafts describes screened-in reports and a roughly 7 percent effect. The two should be reconciled from the tables, which may report both dispositions.
  - The paper has circulated under two titles. The October 2025 draft and the University of Oregon job market listing use "Sports Betting Legalization's Impact on Child Maltreatment"; the November 2025 draft and the SSRN posting use "The Impact of Legalized Sports Betting on Child Maltreatment".
limitations:
  - Job market paper by a single author, not yet peer reviewed; the title and headline figure have already changed between drafts.
  - Screened-in reports depend on reporting and screening practices that vary across states and over time, so an increase can reflect more reporting as well as more maltreatment.
  - Most states had only a few years of post-legalization data, which limits what can be said about longer-run effects.
