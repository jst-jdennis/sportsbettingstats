slug: nedved-nason-hoffer-2026
title: "Sports Betting, Lotteries, and State Revenues in the Post-PASPA Era"
authors: [Joseph Nedved, David Nason, Adam Hoffer, Amir B. Ferreira Neto, Brad Humphreys]
year_first_circulated: 2026
publication_status: working_paper
venue: West Virginia University Department of Economics Working Paper 26-05
doi: null
canonical_url: https://researchrepository.wvu.edu/econ_working-papers/264
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  Monthly state lottery sales from 18 states, matched to the dates on which states legalized and launched
  sports wagering after the 2018 repeal of PASPA.
design: >-
  Difference-in-differences exploiting the staggered timing of sports betting legalization across states,
  comparing lottery revenue in states that legalized with states that had not yet done so, with robustness
  checks across specifications and sub-samples.
plain_language_summary: >-
  The authors ask whether legal sports betting took revenue away from state lotteries. Using monthly lottery
  sales from 18 states, they find no statistically or economically meaningful effect of sports betting
  legalization on state lottery revenue, and report that this null result holds across specifications and
  sub-samples. The estimate is a state-level aggregate, not a measure of any individual's spending. The paper
  is a working paper, and its finding conflicts with other recent work that reports a decline in lottery revenue
  after legalization.
methodology_notes:
  - The sample is 18 states with monthly lottery data, not all lottery states, so the states included matter for the result.
  - The paper notes that prior evidence on whether sports betting and lotteries are substitutes, complements or unrelated is mixed.
limitations:
  - Working paper; the point estimates and confidence intervals have not been read from the PDF and the precision of the null is unknown.
  - Lottery revenue is a total across products; a null overall effect could hide offsetting changes across draw games and instant tickets, or across retail and online channels.
