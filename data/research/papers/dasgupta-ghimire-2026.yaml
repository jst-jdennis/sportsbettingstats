slug: dasgupta-ghimire-2026
title: "Gambling and Substance Use: Early Evidence From Sports Betting Laws"
authors: [Kabir Dasgupta, Keshar Ghimire]
year_first_circulated: 2026
publication_status: published
venue: Health Economics, volume 35, issue 6, pages 851 to 865 (2026)
doi: 10.1002/hec.70088
canonical_url: https://doi.org/10.1002/hec.70088
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  Behavioral Risk Factor Surveillance System responses from 2016 to 2023 on binge drinking, smoking and marijuana
  use, matched to the dates on which states legalized retail and online sports betting.
design: >-
  Difference-in-differences comparing residents of states that legalized sports betting with residents of states
  that had not, with separate estimates for online and retail legalization and by sex and age group.
plain_language_summary: >-
  The authors ask whether legal sports betting changed alcohol, tobacco or marijuana use. They find that legalizing
  online sports betting raised the frequency of binge drinking among young men by about 10 percent, with the effect
  showing at the intensive margin (men who already binge drink doing so more often), and no detectable change in
  smoking or marijuana use. Retail-only legalization shows smaller effects. These are averages across all young men
  in a state's survey sample, bettors and non-bettors alike, and rely on self-reported drinking.
methodology_notes:
  - Population-average estimates for survey respondents; the subgroup with the clearest effect is men aged 35 and under.
  - The sample period includes the COVID-19 pandemic, which the authors note may have affected drinking patterns.
  - The paper studies only the first years after legalization in most states.
limitations:
  - Self-reported consumption in BRFSS tends to understate drinking, so the level of binge drinking is measured with error.
  - BRFSS does not record whether a respondent bets on sports, so the link to betting is at the state-by-date level.
