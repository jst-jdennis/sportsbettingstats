slug: hollenbeck-larsen-proserpio-2024
title: The Financial Consequences of Legalized Sports Gambling
authors: [Brett Hollenbeck, Poet Larsen, Davide Proserpio]
year_first_circulated: 2024
publication_status: working_paper
venue: null
doi: null
canonical_url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4903302
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  A large consumer credit panel (University of California Consumer Credit Panel, derived from Experian records)
  covering millions of individuals from 2016 onward, matched to the state and date of sports gambling
  legalization and to whether online wagering was permitted.
design: >-
  Staggered difference-in-differences comparing residents of states that legalized sports gambling with residents
  of states that had not yet done so, with separate estimates for states that permitted online wagering. Outcomes
  are credit scores, bankruptcy filings, debt in collections, debt consolidation loans and auto loan delinquency.
plain_language_summary: >-
  The authors ask what happened to household finances in states that legalized sports gambling compared with
  states that had not. They find that average credit scores fell slightly and that bankruptcy filings, debt sent
  to collections and auto loan delinquencies rose, with the effects concentrated in states that allowed online
  wagering and growing over the years after legalization. The paper has circulated in several drafts and the
  headline bankruptcy figure depends on which estimate and which draft is cited: the average effect across all
  post-legalization years is about 10 percent, while the effect three to four years after online legalization is
  reported as 25 to 30 percent. All of these are averages across everyone in a state, bettors and non-bettors
  alike, not the effect on an individual who bets.
methodology_notes:
  - Population-average estimates. The share of residents who bet is a minority, so per-bettor effects would be larger than the population figures and are not estimated.
  - Identification relies on states legalizing at different times for reasons unrelated to household finance trends; the paper reports event-study plots to assess pre-trends.
  - Online-access states are the subgroup with the clearest effects; retail-only legalization shows smaller or imprecise effects.
limitations:
  - Working paper. Estimates have changed across drafts and may change again before publication.
  - Credit bureau data do not observe gambling directly; the link is at the state-by-date level.
