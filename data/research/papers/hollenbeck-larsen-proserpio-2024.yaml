slug: hollenbeck-larsen-proserpio-2024
title: The Financial Consequences of Legalized Sports Gambling
authors:
- Brett Hollenbeck
- Poet Larsen
- Davide Proserpio
year_first_circulated: 2024
publication_status: published
venue: Management Science (accepted or published 2026; confirm issue and date)
doi: 10.1287/mnsc.2025.02515
canonical_url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4903302
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: University of California Consumer Credit Panel, credit rating agency records for a representative sample
  of roughly 7 million US consumers, aggregated to the county level, matched to the date each state legalized sports
  gambling and to whether online or mobile access was allowed (abstract and section 3 of both archived drafts).
design: Staggered difference-in-differences (Callaway and Sant'Anna estimator) with two treatment definitions, any
  legal sports gambling and online access, on county-level means weighted by 2015 panel population; standard errors
  clustered at the county level; event studies by years since legalization (section 4 and the note to Table 4, April
  2025 draft).
plain_language_summary: 'The authors compare consumer credit records in states that legalized sports gambling with
  states that had not yet done so. Average credit scores fall by a small amount after legalization and by about
  three times as much where online wagering is allowed. Where online access exists, bankruptcy filings and debt
  sent to collections rise, with the increase appearing roughly two years after legalization. The headline bankruptcy
  figure has changed as the paper was revised: the October 2024 draft stated both an average effect of about 10
  percent and an event-study peak of 25 to 30 percent three to four years after online legalization; the January
  2025 testimony slides showed 27 percent; the April 2025 draft reports a roughly 10 percent increase and no longer
  states the 25 to 30 percent figure. The 28 percent figure quoted in 2024 press coverage does not appear in either
  archived draft. All estimates are averages over everyone in a county, bettors and non-bettors alike.'
methodology_notes:
- Population-average estimates at the county level. Most residents do not bet, so the effect on bettors would be
  larger than these figures; the paper does not estimate it.
- 'Two treatments are estimated separately: any legal sports gambling, and online or mobile access. Bankruptcy and
  collections effects are statistically significant only for online access (Table 4, April 2025 draft).'
- Effects on bankruptcy appear with a lag of roughly two years, so short post-legalization windows understate them
  (section 4, April 2025 draft).
- 'Heterogeneity: declines are concentrated among consumers with subprime scores before legalization, where the
  draft reports an 11 point credit score drop and bankruptcy likelihood up nearly 12 percent (Table 13 discussion,
  April 2025 draft).'
limitations:
- Estimates changed across drafts and the published version has not been read; the entry records each draft separately
  rather than a single figure.
- Credit bureau data do not observe gambling directly; identification is at the state-by-date level and depends
  on legalization timing being unrelated to local credit trends.
- Baseline bankruptcy rates are low, so percentage changes rest on small absolute changes (the April 2025 Table
  4 coefficient for online access is 0.00009 in filing probability).
