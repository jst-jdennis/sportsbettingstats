slug: ayers-poliak-dredze-2025
title: Sportsbooks and Online Searches for Gambling Addiction Help
authors: [John W. Ayers, Adam Poliak, Mark Dredze, and coauthors]
year_first_circulated: 2025
publication_status: published
venue: JAMA Internal Medicine (2025)
doi: null
canonical_url: https://jamanetwork.com/journals/jamainternalmedicine
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  Google search volume for queries seeking help with gambling addiction, by state and month, from 2016 to
  mid-2024, compared across states before and after each state's sportsbook launch.
design: >-
  Interrupted time series with a synthetic counterfactual built from pre-launch search trends, estimated
  nationally and for each state that launched sportsbooks, with separate attention to states that opened
  online wagering.
plain_language_summary: >-
  The authors use search engine data as a proxy for help-seeking. After states opened sportsbooks, searches
  for help with gambling addiction rose above what the pre-launch trend predicted, by about a fifth nationally
  and by more in several states that launched online wagering. Searches are a measure of interest in help,
  not of diagnosed problem gambling, and the study cannot say who was searching or whether they went on to
  seek treatment.
methodology_notes:
  - Search volume is an aggregate index, not a count of people. It can rise with publicity of helplines as well as with need.
  - State estimates vary widely in precision; the national estimate is the most stable figure.
limitations:
  - Searches do not measure prevalence. Advertising of 1-800-GAMBLER, required in most legal states, raises searches on its own.
  - Author list and the full confidence interval are to be completed from the article record; only the lead authors are entered.
