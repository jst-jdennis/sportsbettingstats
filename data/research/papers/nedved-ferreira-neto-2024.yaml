slug: nedved-ferreira-neto-2024
title: "Sports betting cannibalization: Evidence from Pennsylvania"
authors: [Joseph D. Nedved, Amir B. Ferreira Neto]
year_first_circulated: 2024
publication_status: published
venue: Economics Letters, volume 245, 2024
doi: 10.1016/j.econlet.2024.112031
canonical_url: https://doi.org/10.1016/j.econlet.2024.112031
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: >-
  Casino-level slot machine and table game revenue reported by Pennsylvania casinos, around the staggered
  opening of sports books at those casinos after the state legalized sports wagering.
design: >-
  Staggered difference-in-differences across Pennsylvania casinos, using the different dates on which each
  casino opened a sports book to compare slot and table revenue at casinos with and without sports betting.
plain_language_summary: >-
  The paper asks whether sports betting at Pennsylvania casinos took revenue away from the same casinos' slot
  machines and table games. The abstract reports no short-term effect on slot or table game revenue and some
  evidence of complementarity between sports betting and the other games over the longer term, that is, the
  opposite of cannibalization. The effects are aggregates at the casino level and say nothing about any
  individual gambler. The study covers one state and only the retail sports books located inside casinos.
methodology_notes:
  - Identification uses within-state variation in sports book opening dates, so statewide shocks common to all casinos are differenced out.
  - Short letter format; the article is brief and the number of robustness checks is limited by the venue.
limitations:
  - One state, and retail sports books only; online wagering, which accounts for most Pennsylvania handle, is not the treatment studied.
  - Casino-level revenue cannot distinguish new visitors drawn by sports books from changes in spending by existing patrons.
  - The article is behind a paywall and was not opened from the build container; only the abstract was seen.
