slug: humphreys-2021
title: 'Legalized Sports Betting, VLT Gambling, and State Gambling Revenues: Evidence from West Virginia'
authors:
- Brad R. Humphreys
year_first_circulated: 2020
publication_status: published
venue: Eastern Economic Journal, volume 47, issue 1, pages 9 to 28, January 2021 (sports gambling symposium)
doi: 10.1057/s41302-020-00178-0
canonical_url: https://doi.org/10.1057/s41302-020-00178-0
market_segment: regulated_sportsbook
unit_of_effect: population_average
data_used: Monthly casino-level gambling revenue and tax data from West Virginia covering video lottery terminal
  (VLT) play and sports wagering, around the state's legalization of sports betting in 2018 and the staggered opening
  of sports books at the state's casinos.
design: Instrumental variables and difference-in-differences estimates that use the timing of sports book openings
  at West Virginia casinos as a natural experiment to measure how consumer spending on sports betting changed spending
  on VLTs in the same casinos, and what that implied for the state's gambling tax receipts.
plain_language_summary: The paper asks whether the money wagered at West Virginia's new sports books was new gambling
  spending or spending moved away from the casinos' video lottery terminals, which are taxed at a much higher rate.
  It finds that higher sports betting spending caused a significant fall in VLT spending. The author's fiscal accounting
  puts new sports betting tax revenue at about 2.6 million dollars against a roughly 45.4 million dollar fall in
  VLT tax revenue attributed to expanded sports betting. The estimates are aggregates for the state's casinos, not
  effects on individual bettors, and they cover one small state in the first year or so after legalization.
methodology_notes:
- Single-state study using within-state variation in when each casino opened a sports book.
- The fiscal comparison depends on the large gap between the VLT tax rate and the sports wagering tax rate in West
  Virginia.
- An earlier draft circulated as West Virginia University Department of Economics Working Paper 20-06 in 2020.
limitations:
- One state and a short post-legalization window; the results may not transfer to states with different tax rates
  or without casino VLTs.
- Casino-level revenue cannot separate substitution by the same customers from changes in who visits the casinos.
- The published article is behind a paywall and was not opened from the build container; the figures are as stated
  in the indexed abstract.
