version: "2026.1"
status: draft
effective_from: "2026-10-16"
preamble: >-
  This rubric grades consumer protection policy, not outcomes. A high grade means a state has adopted the
  protections listed here; it does not mean the state has less gambling harm. Each criterion reads named
  inputs from the state's published data files, so a grade can be recomputed by anyone from the rubric and
  the data with scripts/grade.py, and the build fails if the committed grades differ from a fresh computation.
  States with no live regulated sports wagering market are scored only on criteria marked all_states and are
  labeled accordingly rather than graded on protections that have nothing to protect. A state whose inputs
  have not all been entered receives no letter grade until they are; a state whose inputs are entered but not
  yet reviewed receives a provisional grade, marked as such.
inputs_note: >-
  Input names refer to values derived from the state files by scripts/grade.py. Each derivation is listed on
  the report card page with the fields it reads. Scoring rows are tried in order and the first whose "when"
  clause matches awards the points; "otherwise" always matches.
criteria:
  - criterion_id: self_exclusion
    title: Statewide self-exclusion registry covering online and retail sports wagering
    data_path: /consumer_protections/self_exclusion/program_type
    applies_to: states_with_regulated_market
    presence: self_exclusion_program_type
    scoring:
      - { when: { var: self_exclusion_program_type, op: in, value: [statewide_registry, both] }, condition: "program_type is statewide_registry or both", points: 3, label: "Statewide registry" }
      - { when: { var: self_exclusion_program_type, op: in, value: [operator_only, tribal_only] }, condition: "program_type is operator_only or tribal_only", points: 1, label: "Operator or tribal programs only" }
      - { when: otherwise, condition: "program_type is none", points: 0, label: "No program" }
    max_points: 3
    rationale: A single statewide list enrolls a person once across all licensed operators. Operator-only programs require separate enrollment with each platform.
    evidence_basis: []
  - criterion_id: deposit_limits
    title: Deposit limit tools
    data_path: /consumer_protections/deposit_limits
    applies_to: states_with_regulated_market
    presence: deposit_limits_entered
    scoring:
      - { when: { any: [ { var: deposit_mandatory_default, op: eq, value: true }, { var: deposit_required_at_signup, op: eq, value: true } ] }, condition: "mandatory_default or player_set_required_at_signup is true", points: 3, label: "Required by default or at signup" }
      - { when: { var: deposit_player_set_available, op: eq, value: true }, condition: "player_set_available is true", points: 1, label: "Available on request" }
      - { when: otherwise, condition: "no deposit limit tool", points: 0, label: "None" }
    max_points: 3
    rationale: Limits set before a session are more effective than limits set during one.
    evidence_basis: []
  - criterion_id: advertising
    title: Advertising restrictions beyond a helpline message
    data_path: /consumer_protections/advertising
    applies_to: states_with_regulated_market
    presence: advertising_rule_count
    scoring:
      - { when: { var: advertising_substantive_count, op: gte, value: 2 }, condition: "two or more rules whose rule_type is not responsible_gambling_message_required", points: 3, label: "Two or more substantive restrictions" }
      - { when: { var: advertising_substantive_count, op: eq, value: 1 }, condition: "exactly one such rule", points: 2, label: "One substantive restriction" }
      - { when: { var: advertising_rule_count, op: gte, value: 1 }, condition: "only responsible_gambling_message_required rules", points: 1, label: "Helpline message only" }
      - { when: otherwise, condition: "advertising list entered but empty", points: 0, label: "No restrictions" }
    max_points: 3
    rationale: Counts substantive restrictions such as college partnership bans, risk-free language bans and time-of-day limits.
    evidence_basis: []
  - criterion_id: legal_age
    title: Minimum age of 21
    data_path: /legal_age
    applies_to: states_with_regulated_market
    presence: legal_age_min
    scoring:
      - { when: { var: legal_age_min, op: gte, value: 21 }, condition: "every legal_age scope is 21 or older", points: 2, label: "21 everywhere" }
      - { when: otherwise, condition: "some scope permits wagering under 21", points: 0, label: "Under 21 permitted" }
    max_points: 2
    rationale: Aligns with the age used by most states and by the research on early-adult financial harm.
    evidence_basis: []
  - criterion_id: credit_cards
    title: Credit card deposits prohibited
    data_path: /consumer_protections/credit_card_deposits/allowed
    applies_to: states_with_regulated_market
    presence: credit_card_allowed
    scoring:
      - { when: { var: credit_card_allowed, op: eq, value: false }, condition: "allowed is false", points: 2, label: "Prohibited" }
      - { when: otherwise, condition: "allowed is true", points: 0, label: "Permitted" }
    max_points: 2
    rationale: Borrowing to wager is the mechanism most directly linked to debt outcomes in the research library.
    evidence_basis: []
  - criterion_id: pg_funding
    title: Dedicated problem gambling funding
    data_path: pg_funding.yaml/records[latest]/funding_mechanism
    applies_to: all_states
    presence: pg_funding_mechanism
    scoring:
      - { when: { var: pg_funding_mechanism, op: in, value: [statutory_earmark_pct_revenue, statutory_earmark_fixed] }, condition: "funding_mechanism is a statutory earmark", points: 3, label: "Statutory earmark" }
      - { when: { var: pg_funding_mechanism, op: in, value: [appropriation, license_fee, compact_payment] }, condition: "funding_mechanism is appropriation, license_fee or compact_payment", points: 2, label: "Discretionary funding" }
      - { when: { var: pg_funding_mechanism, op: eq, value: none }, condition: "funding_mechanism is none", points: 0, label: "No public funding" }
      - { when: otherwise, condition: "funding_mechanism is unknown", points: 0, label: "Mechanism unknown" }
    max_points: 3
    rationale: Earmarked funding survives budget cycles. Per capita amounts are shown alongside but not scored until amounts are entered for all states.
    evidence_basis: []
  - criterion_id: prevalence_research
    title: State prevalence study within the last seven years
    data_path: outcomes/prevalence_studies.yaml
    applies_to: all_states
    presence: prevalence_searched
    scoring:
      - { when: { var: prevalence_years_since_latest, op: lte, value: 7 }, condition: "most recent study fieldwork_year is within 7 years of the rubric's effective year", points: 2, label: "Recent study" }
      - { when: { var: prevalence_years_since_latest, op: not_null }, condition: "an older study exists", points: 1, label: "Older study only" }
      - { when: otherwise, condition: "no study on file", points: 0, label: "No study found" }
    max_points: 2
    rationale: A state cannot evaluate its own policy without a baseline and follow-up measurement.
    evidence_basis: []
grade_bands:
  - { min_pct: 90, grade: A }
  - { min_pct: 75, grade: B }
  - { min_pct: 60, grade: C }
  - { min_pct: 40, grade: D }
  - { min_pct: 0, grade: F }
no_market_rule: >-
  States with no live regulated sports wagering channel are scored on all_states criteria only, out of those
  criteria's combined maximum, and displayed with the label "no regulated market" beside the grade.
incomplete_rule: >-
  A criterion whose presence input is null has not been entered for that state. The state's points are shown
  for the criteria that are entered, but no letter grade is assigned until every applicable criterion has an
  entry, because an absent record is not evidence that a protection is absent.
provisional_rule: >-
  A grade computed from any input whose provenance status is not verified is provisional. The report card
  shows how many of the inputs are still pending review.
