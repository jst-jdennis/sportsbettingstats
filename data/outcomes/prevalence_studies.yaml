        provenance: &ks2025
          source_id: ks-legislature
          source_url: https://kslegislature.gov/li/b2025_26/committees/ctte_spc_2025_on_fed_and_st_aff_1/documents/testimony/20250922_27.pdf
          archive_url: sha256:43433b225e7b2365af89dbeee312d286d86a7e29472825512f3aac34334daf53
          retrieved_at: '2026-10-16'
          retrieval_method: pdf
          entered_by: claude-phase2-2026-10-16
          status: pending_review
          page_or_table: PDF page 3 (printed page 2)
          notes: Executive summary prepared for KDADS by the Learning Tree Institute at Greenbush, as submitted to the Special Committee on Federal and State Affairs, September 22, 2025.
      - measure: other
        definition: Engaged in at least one of the 14 gambling activities asked on the survey (reference period not stated)
        value_pct: 70.8
        denominator: all respondents, n=1,645
        provenance: *ks2025
      - measure: low_risk
        definition: Low risk of problem gambling by the nine screening questions, 2025
        value_pct: 58.7
        denominator: all respondents, n=1,645 (chart titled "Percent of Respondents at Each Risk Level")
        provenance: &ks2025risk
          <<: *ks2025
          page_or_table: PDF page 5 (printed page 4), risk level chart
      - measure: moderate_risk
        definition: Moderate risk of problem gambling, 2025
        value_pct: 21.4
        denominator: all respondents, n=1,645 (chart titled "Percent of Respondents at Each Risk Level")
        provenance: *ks2025risk
      - measure: high_risk
        definition: High risk of problem gambling, 2025
        value_pct: 20.0
        denominator: all respondents, n=1,645 (chart titled "Percent of Respondents at Each Risk Level")
        provenance: *ks2025risk
      - measure: other
        definition: Reported placing a sports bet (reference period not stated; "Sports Betting Insights")
        value_pct: 36.8
        denominator: all respondents
        provenance:
          <<: *ks2025
          page_or_table: PDF page 12 (printed page 11)
    report_url: https://kslegislature.gov/li/b2025_26/committees/ctte_spc_2025_on_fed_and_st_aff_1/documents/testimony/20250922_27.pdf
    comparability_note: Pairs with ks-kdads-gambling-survey-2017 by the document's own design, but the summary's 2017 baseline (84.4, 11.6 and 4.0 percent) does not match the 2017 report (87.2, 10.1 and 2.7 percent with cut points 0, 1 to 3 and 4 or more), and the summary does not state its own cut points. Until the full 2025 report is archived, the risk-level trend between the waves is unconfirmed. Not comparable with the New Jersey PGSI studies; the Kansas high-risk category is a count of yes answers on a nine-item screen, not a validated clinical threshold. The margin of error of 2.4 points applies to the full sample at 95 percent confidence.
    limitations: Executive summary only; the full report on kdads.ks.gov refused the archiver on 2026-10-16. Fieldwork dates, survey mode and weighting are not stated in the summary. Sports betting legalized in Kansas in 2022, between the two waves.
    provenance: *ks2025

# Searches: dated records of looking for a state's prevalence studies. "No study found" on a report card
# is always one of these, never an absence of entry. A study found but not yet entered is listed under
# candidates and leaves the state unscored on that criterion until it is entered.
searches:
  - fips: "40"
    searched_on: "2026-10-17"
    searched_by: claude-draft-2026-10-17
    scope: >-
      Web search for an Oklahoma statewide adult gambling prevalence survey: Oklahoma Department of Mental Health and
      Substance Abuse Services pages, the Oklahoma Association on Problem Gambling and Gaming, press coverage used only
      to locate a report, 2014 to 2026.
    found: true
    candidates:
      - title: Oklahoma statewide gambling survey of 4,050 adults, fielded April to August 2022 by Elite Research for the Oklahoma Association on Problem Gambling and Gaming, analyzed at Texas Tech University
        year: 2022
        url: https://www.oapgg.org/oklahoma-gambling-statistics
        note: Commissioned by a nonprofit council, not the state; described in a later citation as a non-probability sample. Headline figures reported on the association's page (6.3 percent meeting gambling disorder criteria, 23.5 percent at risk, 57.9 percent gambled in the past year) are not entered until the report itself is read and archived; the association's site did not resolve from the build environment and is queued for archiving.
    notes: >-
      Oklahoma Watch reported in December 2014 that the state had never commissioned a prevalence study; no state-commissioned
      study was found for any later year.
  - fips: '01'
    searched_on: '2026-10-17'
    searched_by: claude-session-2026-10-17 (web search)
    scope: 'Web search on 2026-10-17 for a Alabama statewide adult gambling prevalence survey, query "Alabama statewide gambling
      prevalence study problem gambling survey adults report", then a second agency-targeted query "Alabama Department of Mental
      Health gambling prevalence survey Alabama adults problem gambling study report". Only documents and pages that appeared
      in the result lists were considered; state agency, regulator, lottery and university sources were accepted as candidates,
      and council or press figures given without an underlying report, treatment provider pages and composite rankings were
      not. Years covered: any year.'
    found: false
    notes: 'Results: the Governor''s Study Group on Gambling Policy report of December 2020 (governor.alabama.gov) models participation
      and problem gambling under expansion and is not a measured prevalence survey; a treatment provider''s page cites 2.2 percent
