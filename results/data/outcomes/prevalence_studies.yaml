    report_url: https://kslegislature.gov/li/b2025_26/committees/ctte_spc_2025_on_fed_and_st_aff_1/documents/testimony/20250922_27.pdf
    comparability_note: Comparable with ks-kdads-gambling-survey-2017 by the document's own design. Not comparable with the New Jersey PGSI studies; the Kansas high-risk category is defined by a count of yes answers on a nine-item screen, not by a validated clinical threshold, and the executive summary does not state the cut points. The margin of error of 2.4 points applies to the full sample at 95 percent confidence.
    limitations: Executive summary only; the full report on kdads.ks.gov refused the archiver on 2026-10-16. Fieldwork dates, survey mode and weighting are not stated in the summary. Sports betting legalized in Kansas in 2022, between the two waves.
    provenance: *ks2025
